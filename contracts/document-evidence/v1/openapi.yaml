openapi: 3.1.0
info:
  title: XML Compare Utilities Document Evidence Contract
  version: 1.2.0
  description: >-
    Provider-neutral document-evidence contract and governed table extraction routes.
paths:
  /v2/tables/discover:
    post:
      summary: Discover advisory PDF table candidates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sourcePath]
              properties:
                sourcePath:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Advisory candidate pages/regions only; no governed extraction authority.
          content:
            application/json:
              schema:
                $ref: ./table-discovery.schema.json
  /v2/tables/extract:
    post:
      summary: Extract governed evidence from explicitly selected PDF pages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sourcePath, sourceHash, pages]
              properties:
                sourcePath:
                  type: string
                  minLength: 1
                sourceHash:
                  type: string
                  minLength: 1
                pages:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: integer
                    minimum: 1
                options:
                  type: object
                  additionalProperties: false
                  properties:
                    ocr:
                      type: string
                      enum: [never, always]
                      default: never
                      description: >-
                        `always` runs exactly one bounded existing OCR pass per explicitly selected page.
                    ocrLanguage:
                      type: string
                      minLength: 1
                      default: eng
      responses:
        '200':
          description: Source-bound table observations, per-pass cells, and extraction-only decisions.
          content:
            application/json:
              schema:
                $ref: ./table-extraction.schema.json
components:
  schemas:
    SourceIdentity:
      $ref: ./source.schema.json
    Surface:
      $ref: ./surface.schema.json
    SurfaceTransform:
      $ref: ./transform.schema.json
    Geometry:
      $ref: ./geometry.schema.json
    Observation:
      $ref: ./observation.schema.json
    EvidenceDecision:
      $ref: ./decision.schema.json
    TablePass:
      $ref: ./table-pass.schema.json
    TableDiscovery:
      $ref: ./table-discovery.schema.json
    TableExtraction:
      $ref: ./table-extraction.schema.json
    Overlay:
      $ref: ./overlay.schema.json
    MachineEvidenceEnvelope:
      $ref: ./machine-evidence-envelope.schema.json
    CorrectionEvent:
      $ref: ./correction-event.schema.json
x-contract-status: runtime-partial
x-authority-boundary: extraction-only
x-table-ocr-policy:
  modes: [never, always]
  attemptsPerSelectedPage: 1
  maxPagePixels: 24000000
  maxDimensionPixels: 12000
  maxJobOutputBytes: 134217728
  maxAttemptSeconds: 30
