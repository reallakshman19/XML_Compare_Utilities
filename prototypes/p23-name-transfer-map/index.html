<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TopoFix — Name transfer</title>
<style>body{margin:0;background:#f4f6f9;color:#182538;font:15px system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px}section{background:white;border:1px solid #d5dce6;border-radius:8px;padding:18px;margin:16px 0}h2{font-size:18px;margin-top:0}label{display:block;margin:10px 0}button,input{font:inherit}button{padding:8px 12px;margin:4px;border:1px solid #a0aec0;border-radius:5px;background:#fff}button:disabled{opacity:.45}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:7px;border-bottom:1px solid #e4e8ee}th{position:sticky;top:0;background:#eef3f8}.scroll{max-height:360px;overflow:auto}#status{white-space:pre-wrap;color:#973b27}textarea{width:100%;box-sizing:border-box;min-height:120px}</style>
<script type="importmap">{"imports":{"node:fs":"./browser/node-stub.js","node:url":"./browser/node-stub.js","node:path":"./browser/node-stub.js"}}</script></head><body><main>
<h1>Name Transfer from a Map file</h1><p>CII v14 only. Approved map pairs propose names; the original files are never modified.</p><p id="status" role="alert"></p>
<section><h2>1 · Load and plan</h2><label>Source CII <input type="file" id="source" accept=".cii"></label><label>Target CII <input type="file" id="target" accept=".cii"></label><label>Map file <input type="file" id="map" accept=".json"></label><button id="plan" disabled>Build plan</button></section>
<section><h2>2 · Review names</h2><p id="summary"></p><div id="proposals" class="scroll"></div><h3>Missing name records (not edited)</h3><div id="missing" class="scroll"></div><label>Approved by <input id="by"></label><button id="approve" disabled>Approve all</button></section>
<section><h2>3 · Apply and verify</h2><button id="apply" disabled>Apply approved names</button><p>Any refusal prevents all revised CII output.</p><div id="results" class="scroll"></div></section>
<section><h2>4 · Export</h2><button id="export" disabled>Download Change set</button><button id="download" disabled>Download revised CII</button><textarea id="json" readonly aria-label="Change set JSON"></textarea></section>
</main><script type="module" src="./browser/page.js"></script></body></html>
