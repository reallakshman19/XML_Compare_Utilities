<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>P1.3 CII ↔ CII map export</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 1.5rem; color: #222; }
  fieldset { border: 1px solid #ccc; padding: .6rem 1rem; margin-bottom: 1rem; }
  label { margin-right: 1.2rem; }
  table { border-collapse: collapse; margin: .4rem 0 1.4rem; }
  th, td { border: 1px solid #ddd; padding: 2px 8px; text-align: left; font-variant-numeric: tabular-nums; }
  th { background: #f3f3f3; }
  .bad { color: #a00; }
  .muted { color: #777; }
  details { margin-bottom: 1rem; }
</style>
</head>
<body>
<h1>CII ↔ CII map <span class="muted">(P1.3, read-only CII)</span></h1>
<p>Load two CAESAR II version 14 files. Elements and nodes are paired by geometry; the table lists the named values that differ.</p>
<fieldset>
  <label>File A <input type="file" id="fa" accept=".cii,.CII"></label>
  <label>File B <input type="file" id="fb" accept=".cii,.CII"></label><br><br>
  <label>Tolerance (mm) <input id="tol" value="1" size="5"></label>
  <label>Anchors (optional) <input id="anchors" placeholder="10:10,20:20,30:30" size="28"></label>
  <button id="go">Compare</button>
</fieldset>
<div id="out"></div>
<section id="review" hidden>
  <h2>Review Map pairs</h2>
  <p>All pairs start as candidates. Review the loop closures above before approving.</p>
  <label>Approved by <input id="by" autocomplete="name"></label>
  <button id="exact">Approve all exact</button>
  <button id="approve">Approve selected</button>
  <button id="reject">Reject selected</button>
  <button id="export">Export Map file</button>
  <p id="map-status" role="status"></p>
  <div id="pair-review"></div>
  <div id="export-panel" hidden>
    <label for="map-json">Map JSON</label><br>
    <textarea id="map-json" readonly rows="12" cols="90"></textarea><br>
    <button id="copy">Copy</button><button id="download">Download Map file</button>
  </div>
</section>
<!-- The shared validator is unchanged; its Node-only CLI imports are never called in the browser. -->
<script>globalThis.process ??= {argv: []};</script>
<script type="importmap">{"imports":{"node:fs":"./engine/validator-browser-stub.mjs","node:path":"./engine/validator-browser-stub.mjs","node:url":"./engine/validator-browser-stub.mjs"}}</script>
<script type="module">
import { attempt } from './kit/core.mjs';
import { readCiiGraph } from './engine/cii-graph.mjs';
import { compareCii } from './engine/compare.mjs';
import { toMapFile } from './engine/to-map.mjs';
import { approvePairs, rejectPairs } from './engine/approve.mjs';
import { validateMap } from './engine/map-validation.mjs';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const table = (head, rows) => '<table><tr>' + head.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr>' +
  rows.map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</table>';
const bytesOf = async input => input.files[0] ? new Uint8Array(await input.files[0].arrayBuffer()) : null;
const el = r => r.component !== undefined ? 'piece ' + r.component : r.elementIndex + ' (' + r.fromNode + '→' + r.toNode + ')';
const val = v => v && typeof v === 'object' ? 'moved up to ' + v.maxMoveMm.toFixed(3) + ' mm, shift ' + v.translation.map(x => x.toFixed(3)).join(', ') : v;

let map = null, generation = 0;
const status = text => { $('map-status').textContent = text; };
function invalidateExport() { $('export-panel').hidden = true; $('map-json').value = ''; }
function reset() { generation++; map = null; $('review').hidden = true; invalidateExport(); $('out').textContent = ''; }
for (const id of ['fa', 'fb', 'tol', 'anchors']) $(id).addEventListener('input', reset);
const displayRef = r => r.kind === 'cii-node' ? 'Node ' + r.node : el(r);
function renderMap() {
  const rows = map.pairs.map(p => '<tr><td><input type="checkbox" aria-label="Select ' + esc(p.pairId) + '" value="' + esc(p.pairId) + '"></td>' +
    [p.pairId, displayRef(p.source), displayRef(p.target), p.evidence.rule, p.evidence.detail, p.status, p.approvedBy ?? ''].map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>');
  $('pair-review').innerHTML = '<table><thead><tr>' + ['Select','Pair','A','B','Rule','Evidence','Status','Approved by'].map(h=>'<th>'+h+'</th>').join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody></table>';
  status(map.pairs.length + ' pairs; ' + map.pairs.filter(p => p.status === 'approved').length + ' approved.');
}
const selected = () => [...$('pair-review').querySelectorAll('input:checked')].map(e => e.value);
function update(action, ids) {
  if (!map) return;
  try {
    map = action(map, ids, { by: $('by').value.trim(), at: new Date().toISOString() });
    invalidateExport(); renderMap();
  } catch (e) { status(e.message); }
}
$('exact').onclick = () => update(approvePairs, 'all-exact');
$('approve').onclick = () => update(approvePairs, selected());
$('reject').onclick = () => update(rejectPairs, selected());
$('export').onclick = () => {
  if (!map) return;
  try { validateMap(map); $('map-json').value = JSON.stringify(map, null, 2) + '\n'; $('export-panel').hidden = false; }
  catch (e) { invalidateExport(); status(e.message); }
};
$('copy').onclick = async () => {
  if (!map || $('export-panel').hidden) return;
  try { await navigator.clipboard.writeText($('map-json').value); status('Map JSON copied.'); }
  catch { $('map-json').select(); status('Clipboard unavailable. Select and copy the JSON.'); }
};
$('download').onclick = () => {
  if (!map || $('export-panel').hidden) return;
  const url = URL.createObjectURL(new Blob([$('map-json').value], {type:'application/json'}));
  const a = document.createElement('a'); a.href = url; a.download = 'topofix.map.json'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
};

$('go').onclick = async () => {
  reset(); const run = generation;
  const out = $('out');
  out.textContent = 'Working…';
  const nameA = $('fa').files[0]?.name, nameB = $('fb').files[0]?.name;
  const [a, b] = [await bytesOf($('fa')), await bytesOf($('fb'))];
  if (run !== generation) return;
  if (!a || !b) { out.innerHTML = '<p class="bad">Choose both files.</p>'; return; }
  const r = await attempt(async () => {
    const ga = await readCiiGraph(a, {member: nameA}), gb = await readCiiGraph(b, {member: nameB});
    const comparison = compareCii(ga, gb, { anchors: $('anchors').value.trim() || undefined, toleranceMm: Number($('tol').value) });
    const candidateMap = toMapFile(comparison, {sourceFile: {fileName: nameA, sha256: ga.sha256}, targetFile: {fileName: nameB, sha256: gb.sha256}});
    return {...comparison, candidateMap};
  });
  if (run !== generation) return;
  if (!r.ok) {
    out.innerHTML = '<h2 class="bad">Refused</h2>' + table(['code', 'where', 'detail'], r.refusals.map(x => [x.code, x.where, x.detail]));
    return;
  }
  const s = r.summary, ep = r.pairs.filter(p => p.kind === 'element');
  out.innerHTML =
    '<h2>Summary</h2>' + table(['', 'A', 'B'], [
      ['elements', s.elementsA, s.elementsB], ['element pairs', s.elementPairs, s.elementPairs],
      ['unmatched elements', s.unmatchedA, s.unmatchedB], ['unmatched nodes', s.unmatchedNodesA, s.unmatchedNodesB]]) +
    '<p>Anchors: ' + s.anchors + ' (' + s.anchorMode + '), tolerance ' + s.toleranceMm + ' mm. Pairs by rule: ' +
      Object.entries(s.elementPairsByRule).map(([k, v]) => k + ' ' + v).join(', ') + '.</p>' +
    '<h2>Differences (' + r.fieldDiffs.length + ')</h2>' +
    table(['element A', 'element B', 'value', 'A', 'B'], r.fieldDiffs.map(d => [el(d.a), el(d.b), d.field, val(d.valueA), val(d.valueB)])) +
    (r.unfittedComponentsA.length ? '<h2>Pieces of A not fitted</h2>' + table(['piece', 'first node', 'nodes', 'reason'],
      r.unfittedComponentsA.map(u => [u.component, u.firstNode, u.nodeCount, u.reason])) : '') +
    '<h2>Loop closures (Owner: up to ±6 mm, all shown)</h2>' +
    table(['side', 'element', 'node', 'miss mm', 'allowed mm'], [...(r.loopClosures?.a || []).map(c => ['A', c.element, c.node, c.missMm.toFixed(4), c.toleranceMm]),
      ...(r.loopClosures?.b || []).map(c => ['B', c.element, c.node, c.missMm.toFixed(4), c.toleranceMm])]) +
    '<h2>Unmatched elements</h2>' +
    table(['side', 'element', 'reason'], [...r.unmatchedA.map(u => ['A', el(u), u.reason]), ...r.unmatchedB.map(u => ['B', el(u), u.reason])]) +
    '<details><summary>Element pairs (' + ep.length + ')</summary>' +
    table(['element A', 'element B', 'rule', 'reversed', 'raw distance mm', 'after fit mm'], ep.map(p => [el(p.a), el(p.b), p.rule, p.reversed ? 'yes' : '', p.rawDistanceMm.toFixed(4), p.distanceMm.toFixed(4)])) +
    '</details>';
  map = r.candidateMap; $('review').hidden = false; renderMap();
};
</script>
</body>
</html>
