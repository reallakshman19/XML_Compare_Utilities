<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sequential Engineering SVG Preview</title>
<link rel="stylesheet" href="../../tabs/sequential-sketcher/sequential-sketcher.css">
<link rel="stylesheet" href="../../tabs/sequential-sketcher/continuity/sequential-continuity.css">
<style>
body{margin:0;background:#07101f}.psmap-card{margin:20px;padding:16px}[data-engineering-svg-shell]{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:8px}[data-engineering-svg-shell-canvas]{min-height:420px}svg[data-engineering-svg-root]{width:100%;height:100%;min-height:420px}.ssk-toolbar [data-ssk-preview-status]{font-size:10px;max-width:260px;color:#94a3b8}
</style></head><body><div id="tiles"></div>
<script type="module">
import { installSequentialSketcherTile, mountSequentialSketcherWorkspace } from '../../tabs/sequential-sketcher/sequential-sketcher-tab.js';
import { getSequentialEngineeringSvgPreviewController, mountSequentialEngineeringSvgPreviewController } from '../../tabs/sequential-sketcher/sequential-engineering-svg-preview-controller.js';
import { blockedSequentialFixture, repairedSequentialFixture } from '../helpers/sequential-engineering-svg-fixture.js';

const records = [...blockedSequentialFixture().records, ...repairedSequentialFixture().records];
const branches = records.map((row) => row.name).sort();
let failureStage = '';
let lastClosedController = null;
const failures = [];
const disposeTile = installSequentialSketcherTile(document.querySelector('#tiles'), {
  sequentialEngineeringSvgPreviewFailureFactory(stage) {
    return stage === failureStage ? new Error(`Injected ${stage} failure`) : null;
  },
  onSequentialEngineeringSvgPreviewFailure(detail) { failures.push(detail); },
  showToast() {},
});
function root() { return document.querySelector('.ssk-modal'); }
function controller() { return getSequentialEngineeringSvgPreviewController(root()); }
function click(selector) { const node = root().querySelector(selector); if (!node) throw new Error(`Missing ${selector}`); node.click(); return node; }
function open() { document.querySelector('[data-ssk-open]').click(); return root(); }
function inspect() { root().querySelector('[data-ssk-source]').value = JSON.stringify(records); click('[data-ssk-action="inspect"]'); }
function openBranch(id = branches[0]) { const select = root().querySelector('[data-ssk-branch]'); select.value = id; select.dispatchEvent(new Event('change', { bubbles: true })); }
function advance() { click('[data-ssk-action="advance"]'); }
function run() { click('[data-ssk-action="run"]'); }
function renderer(value) { click(`[data-ssk-renderer="${value}"]`); }
function projection(value) { click(`[data-ssk-view="${value}"]`); }
function tick() { return new Promise((resolve) => setTimeout(resolve, 0)); }
async function activatePreview(id = branches[0], withAdvance = true) { inspect(); openBranch(id); if (withAdvance) advance(); renderer('ENGINEERING_SVG_PREVIEW'); await tick(); await tick(); }
async function reloadSource() {
  const input = root().querySelector('[data-ssk-file="source"]');
  const transfer = new DataTransfer();
  transfer.items.add(new File([JSON.stringify(records)], 'source.json', { type: 'application/json' }));
  input.files = transfer.files; input.dispatchEvent(new Event('change', { bubbles: true })); await tick(); await tick();
}
function state() {
  const current = controller();
  return {
    controller: current?.getState() || null,
    sharedRoots: root()?.querySelectorAll('[data-engineering-svg-shell]').length || 0,
    engineeringRoots: root()?.querySelectorAll('[data-engineering-svg-root]').length || 0,
    constructionHidden: Boolean(root()?.querySelector('[data-ssk-construction-surface]')?.hidden),
    constructionInert: root()?.querySelector('[data-ssk-construction-surface]')?.hasAttribute('inert') || false,
    previewHidden: Boolean(root()?.querySelector('[data-ssk-engineering-svg-preview-host]')?.hidden),
    previewDisabled: Boolean(root()?.querySelector('[data-ssk-renderer="ENGINEERING_SVG_PREVIEW"]')?.disabled),
    inspectorVisible: Boolean(root()?.querySelector('[data-ssk-inspector]')),
    status: root()?.querySelector('[data-ssk-preview-status]')?.textContent || '',
    activeBranch: root()?.querySelector('[data-ssk-active-branch]')?.textContent || '',
    selectedCandidate: root()?.querySelector('.ssk-candidate-card.is-selected')?.dataset?.sskCandidateCard || '',
  };
}
async function subscriptionFailure() {
  const host = document.createElement('div'); document.body.appendChild(host);
  const workspace = mountSequentialSketcherWorkspace(host, { showToast() {} });
  host.querySelector('[data-ssk-source]').value = JSON.stringify(records);
  host.querySelector('[data-ssk-action="inspect"]').click();
  const select = host.querySelector('[data-ssk-branch]'); select.value = branches[0]; select.dispatchEvent(new Event('change', { bubbles: true }));
  const failed = mountSequentialEngineeringSvgPreviewController(host, { workspace, failureFactory: (stage) => stage === 'owner-subscription' ? new Error('Injected owner-subscription failure') : null });
  const result = { state: failed.getState(), roots: host.querySelectorAll('[data-engineering-svg-shell]').length, constructionHidden: host.querySelector('[data-ssk-construction-surface]').hidden };
  failed.destroy(); workspace.destroy(); host.remove(); return result;
}
function close() { lastClosedController = controller(); click('[data-ssk-action="close"]'); }
function destroyTile() { disposeTile(); }

globalThis.__sskPreview = { records, branches, failures, open, inspect, openBranch, advance, run, renderer, projection, tick, activatePreview, reloadSource, state, controller, root, close, destroyTile, subscriptionFailure, oldController: () => lastClosedController, setFailure: (stage) => { failureStage = stage || ''; } };
</script></body></html>
