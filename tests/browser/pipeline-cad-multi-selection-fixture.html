<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PCAD-004R Multi-selection Fixture</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 1180px; background: #020617; color: #e2e8f0; }
    header { padding: 10px 16px; background: #0f172a; border-bottom: 1px solid #334155; }
    .pipeline-3d-model-dialog { display: grid; gap: 12px; padding: 12px; }
    .raw-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .raw-panel { padding: 8px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; }
    textarea { width: 100%; min-height: 110px; background: #020617; color: #cbd5e1; font: 10px monospace; }
    .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .preview-card { height: 470px; overflow: hidden; border: 1px solid #334155; border-radius: 10px; background: #0b1220; }
    [data-p3d-split="table2x-preview"], [data-p3d-split="table3x-preview"] { width: 100%; height: 100%; }
    .output-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .output-card { padding: 8px; border: 1px solid #334155; }
    table { width: 100%; border-collapse: collapse; font: 10px monospace; }
    td { border: 1px solid #334155; padding: 4px; }
  </style>
</head>
<body>
  <header><strong>PCAD-004R current-main reconstruction</strong></header>
  <main class="pipeline-3d-model-dialog" data-browser-fixture="pipeline-cad-multi-selection">
    <section class="raw-grid">
      <div class="raw-panel"><label>Table 2A</label><textarea data-p3d-split="table2a-raw">H(coor)	V(coor)	[H vs V] Length	Station Text	Elevation Text
659.791	—	—	0+000.0	231.32
668.540	-715.825 → -650.258	65.567	0+006.7	230.95
680.803	-715.825 → -650.258	65.567	0+019.0	230.82
732.683	—	—	0+070.8	233.00</textarea></div>
      <div class="raw-panel"><label>Table 3A</label><textarea data-p3d-split="table3a-raw">From H(coor)	To H(coor)	Text Position X	HLength Text
661.791	682.337	671.704	20.5
682.337	716.683	700.435	34.3
716.683	732.683	723.927	16.0</textarea></div>
      <div class="raw-panel"><label>Table 3B</label><textarea data-p3d-split="table3b-raw">From H(coor)	To H(coor)	Text Position X	Z Text
—	—	665.621	A/G
682.337	732.683	708.374	1.5M</textarea></div>
      <div class="raw-panel"><label>Table 3C</label><textarea data-p3d-split="table3c-raw">Text Position X	Marker Text
688.135	PM-001
700.135	PM-002</textarea></div>
    </section>
    <section class="preview-grid">
      <div class="preview-card" data-p3d-split="table2x-preview"></div>
      <div class="preview-card" data-p3d-split="table3x-preview"></div>
    </section>
    <section class="output-grid">
      <div class="output-card" data-p3d="table2x-output"><table><tbody><tr data-output-row="table2"><td>0+019.0</td><td>230.82</td></tr></tbody></table></div>
      <div class="output-card" data-p3d="table3x-output"><table><tbody>
        <tr data-output-row="depth"><td>682.337</td><td>732.683</td><td>708.374</td><td>1.5M</td></tr>
        <tr data-output-row="marker1"><td>688.135</td><td>PM-001</td></tr>
        <tr data-output-row="marker2"><td>700.135</td><td>PM-002</td></tr>
      </tbody></table></div>
    </section>
  </main>
  <script type="module">
    import { mountPipelineCadWorkspace } from '../../tabs/pipeline-3d-model/pipeline-3d-model-cad-workspace.js';

    const dialog = document.querySelector('.pipeline-3d-model-dialog');
    let workspace = null;
    let batchEvents = [];
    const frame = () => new Promise((resolve) => requestAnimationFrame(resolve));

    async function mount() {
      workspace = mountPipelineCadWorkspace(dialog, { force: true });
      if (!workspace) throw new Error('PCAD-004R workspace did not mount.');
      batchEvents = [];
      workspace.controller.addEventListener('batchCommandCommitted', (event) => batchEvents.push({ type: 'committed', detail: event.detail }));
      workspace.controller.addEventListener('batchCommandRejected', (event) => batchEvents.push({ type: 'rejected', detail: event.detail }));
      await frame(); workspace.resize(); await frame(); await frame();
      return workspace;
    }

    function rawValue(name) { return dialog.querySelector(`[data-p3d-split="${name}-raw"]`)?.value || ''; }
    function nodes(graphName) {
      const graph = workspace.graphs[graphName];
      return graphName === 'table2x' ? graph.currentNodes() : [...graph.markerNodes(), ...graph.depthNodes()];
    }
    function findNode(graphName, query = {}) {
      const graph = workspace.graphs[graphName];
      const node = nodes(graphName).find((candidate) => {
        if (query.id && candidate.id !== query.id) return false;
        if (query.type && candidate.type !== query.type) return false;
        if (query.text && candidate.text !== query.text) return false;
        if (Number.isFinite(query.index) && nodes(graphName).indexOf(candidate) !== query.index) return false;
        return true;
      });
      if (!node) throw new Error(`Node not found: ${graphName} ${JSON.stringify(query)}`);
      const screen = graph.worldToScreen(node);
      return { id: node.id, type: node.type || 'elevation-node', x: screen.x, y: screen.y, world: { x: node.x, y: node.y } };
    }
    function state() {
      const controller = workspace.controller;
      return {
        mountId: workspace.mountId,
        revision: controller.model?.revision || 0,
        history: { undo: controller.history.undoStack.length, redo: controller.history.redoStack.length },
        raw: { table2a: rawValue('table2a'), table3b: rawValue('table3b'), table3c: rawValue('table3c') },
        selection: {
          table2x: workspace.graphs.table2x.selection,
          table3x: workspace.graphs.table3x.selection,
          activeGraph: workspace.authoring.getActiveGraph(),
        },
        precisionIdentity: workspace.precision?.sessions?.identity || null,
        batchEvents: structuredClone(batchEvents),
        table2: controller.model.table2Rows.map((row) => ({ id: row.id, elevationValue: row.elevationValue })),
        depth: controller.model.table3DepthRows.map((row) => ({ id: row.id, z: row.z })),
        markers: controller.model.table3MarkerRows.map((row) => ({ id: row.id, absoluteH: row.absoluteH, markerText: row.markerText })),
        overrides: {
          table2: [...workspace.graphs.table2x.visualOverrides.entries()],
          depth: [...workspace.graphs.table3x.depthOverrides.entries()],
          markers: [...workspace.graphs.table3x.markerOverrides.entries()],
        },
      };
    }
    function destroy() {
      if (!workspace) return false;
      const current = workspace; workspace = null; return current.destroy();
    }
    async function remount() { destroy(); return mount(); }

    await mount();
    globalThis.__pcad004r = {
      get workspace() { return workspace; }, dialog, state, findNode, nodes, mount, destroy, remount,
      setMode(mode) { workspace.authoring.setMode(mode); workspace.precision?.setMode(mode); },
      commitDepthBatch() {
        const row = workspace.controller.model.table3DepthRows[0];
        return workspace.authoring.batch.commitMove({ graph: 'table3x', entityType: 'depth-node', changes: [{ id: row.id, z: row.z - 1 }] });
      },
    };
    document.body.dataset.pcad004rReady = '1';
  </script>
</body>
</html>
