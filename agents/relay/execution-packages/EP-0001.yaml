outcome:
  user_visible:
  - Produce a complete local exact-source Node diagnostic receipt for frozen RC 759612b4e355a585aed7d64b566f199340429bdf, clearly separated from governed clean-checkout qualification.
  engineering:
  - Execute the frozen-RC workflow-equivalent focused Node test surface from exact GitHub text sources under Node 22 without mutating product, tests, workflows, benchmark oracles, PR readiness, or merge state.
  - Preserve PASS, FAIL and NOT_RUN evidence conservatively and localize any reproducible failure to the first wrong production boundary before proposing a new RC.
context_capsule:
  product_goal: Close Primary Support Assembly release hardening and governed qualification while preserving frozen product semantics.
  roadmap_position: OBJ-001 / PHASE-001 / WP-001 local exact-source focused Node diagnostic execution.
  why_this_work_exists: Hosted Actions credits are exhausted and the prior hosted jobs never reached repository execution, so local exact-source Node execution is the available diagnostic route while governed clean-checkout gates remain separately classified.
  current_architecture: The frozen RC uses ps-family-psclash XML parsing, exact current/reference zone scoping, Primary Support relationship bundles, reconciliation/orphan/count authority, structural/relationship/axis typicality consensus, and governed Support Report publication. The qualification workflow selects tests/support-primary-*.test.mjs plus explicit support-report test files.
  prior_owner_decisions:
  - Keep RC 759612b4e355a585aed7d64b566f199340429bdf immutable for qualification evidence.
  - Do not reopen protected algorithms without a concrete reproducible failure.
  - Keep PR #1223 draft/unmerged; merge authority is Owner-only.
  - Real 1835 relationship checks require separate authoritative Owner relationship XML and cannot use geometry-only 1835.zip as a substitute.
  current_implementation_state: Product source is frozen at PR #1223 head. Retained LEG-014 27/27 and LEG-017 13/13 are technical history only. Current local reconstructed exact-source diagnostics have passed relationship/parser/reconciliation/input slices but do not close governed clean-checkout gates.
  known_problems:
  - Hosted Actions credits are exhausted; exact-RC hosted jobs remain NOT_RUN because no repository step executed.
  - The connector cannot provide a complete authenticated private-repository checkout or binary benchmark ZIP directly into the execution container.
  - Playwright Node packages are unavailable locally even though Chromium exists.
  - Authoritative real 1835 support-to-support relationship XML is absent.
  deliberate_non_goals:
  - No product/source/test/workflow/benchmark-oracle patch in this EP.
  - No rebase or mutation of frozen RC solely because main advanced.
  - No readiness promotion, merge, or substitution of diagnostic execution for governed clean-checkout qualification.
  terminology:
    RC_SHA: 759612b4e355a585aed7d64b566f199340429bdf
    LIVE_MAIN: 3ee90ca25368f69d42f44cbe967d5bbc81972f77
    CUSTODY_BRANCH: agent/support-primary-1225
    GOVERNED_NOT_RUN: A required gate for which the repository-defined workload did not execute or its authoritative input is absent.
repository_discovery:
- id: DSTEP-01
  action: VERIFY
  target: agents/relay/REPO_STATE.yaml
  question: Does repository state still route to EP-0001 on RM-0002 / WP-001?
  expected_outputs: [active EP id and path, roadmap id and revision, current work package, material authority]
  receipt_required: true
  on_failure: Reconcile repository custody before engineering writes.
- id: DSTEP-02
  action: VERIFY_GIT
  target: live checkout or authenticated repository observation
  question: Does the execution route still preserve frozen RC 759612b4e355a585aed7d64b566f199340429bdf, custody branch agent/support-primary-1225, and observed main basis?
  expected_outputs: [execution branch or connector route, current custody head, RC identity result, live main result, base drift disposition]
  receipt_required: true
  on_failure: Retain READ_ONLY authority and reconcile route or drift before execution evidence is published.
- id: DSTEP-03
  action: VERIFY
  target: .github/workflows/support-report-typicality-qualification.yml at RC_SHA
  question: What exact focused Node test selection and Node runtime does the frozen-RC workflow define?
  expected_outputs: [Node major version, wildcard test selector, explicit support-report test selectors]
  receipt_required: true
  on_failure: Do not invent a substitute test set; classify focused execution NOT_RUN until the repository-owned command is resolved.
inputs:
- id: INPUT-01
  name: Frozen release candidate
  description: Immutable product qualification identity whose exact text sources are reconstructed for this diagnostic EP.
  authority: PR #1223 head and #1225 release-hardening authority
  source: github:reallaksh19/XML_Compare_Utilities@759612b4e355a585aed7d64b566f199340429bdf
  value: 759612b4e355a585aed7d64b566f199340429bdf
  type: git_commit
  units: NA
  editable: false
  applicability: CURRENT_EP_REQUIRED
  resolution: READY
  consumers: [STEP-01, STEP-02, STEP-03]
  validation: [Confirm PR #1223 head still equals the frozen RC before treating results as current RC diagnostics.]
  stale_if: [PR #1223 head changes or Owner explicitly establishes a new RC.]
- id: INPUT-02
  name: Frozen focused qualification workflow
  description: Repository-owned test selection that defines the workflow-equivalent Node surface for this diagnostic EP.
  authority: Frozen RC repository source
  source: .github/workflows/support-report-typicality-qualification.yml@759612b4e355a585aed7d64b566f199340429bdf
  type: workflow_definition
  units: NA
  editable: false
  applicability: CURRENT_EP_REQUIRED
  resolution: READY
  consumers: [STEP-01, STEP-03]
  validation: [Resolve the test selectors directly from the exact RC workflow and do not use stale runbook filenames as authority.]
  stale_if: [A new RC changes the workflow definition.]
- id: INPUT-03
  name: Local Node runtime
  description: Offline runtime for exact-source diagnostic execution.
  authority: Local execution environment observation
  source: node --version
  value: v22.16.0
  type: runtime
  units: NA
  editable: false
  applicability: CURRENT_EP_REQUIRED
  resolution: READY
  consumers: [STEP-03]
  validation: [Confirm Node major version remains 22 before execution.]
  stale_if: [Local Node major version changes from 22.]
benchmarks:
- id: BENCH-01
  name: Exact-source identity
  purpose: Prevent reconstructed files from silently diverging from the frozen RC.
  source: Git blob identities returned for each frozen-RC file
  oracle_class: REFERENCE_DATA
  payload: Each materialized source/test file must reproduce its Git blob object identity where the connector exposes the blob SHA.
  expected: All executed text files match frozen-RC repository objects; any unverifiable or missing dependency is explicit NOT_RUN rather than PASS.
  tolerance: null
  independence: Git object identity is repository metadata independent of Node test outcomes.
  applicability: CURRENT_EP_REQUIRED
  resolution: READY
  verifies: [AC-02, TEST-02]
  stale_if: [RC_SHA changes.]
- id: BENCH-02
  name: Workflow-equivalent focused Node result
  purpose: Determine whether the repository-owned focused Node surface reproduces a product/test failure locally.
  source: Frozen workflow command plus exact-RC test and production files
  oracle_class: EXECUTABLE_TEST
  payload: Run the resolved node --test selection under Node 22 and retain raw test totals/failures/not-run reasons.
  expected: All resolvable workflow-selected tests pass; any unresolved dependency or transport limitation is classified NOT_RUN and is not upgraded to PASS.
  tolerance: null
  independence: The test expectations are stored in the frozen repository and are not derived from the implementation result produced during this EP.
  applicability: CURRENT_EP_REQUIRED
  resolution: READY
  verifies: [AC-01, AC-03, TEST-01, TEST-03]
  stale_if: [RC_SHA or workflow test selection changes.]
scope:
  allowed:
  - path: agents/relay/**
    reason: Record V2.5 execution/custody/quality/checkpoint evidence only after the candidate satisfies relay write readiness.
  allowed_reads:
  - path: .github/workflows/support-report-typicality-qualification.yml
    reason: Resolve the authoritative focused Node command.
  - path: tests/support-primary-*.test.mjs
    reason: Execute the Primary Support focused test surface.
  - path: tests/support-report-*.test.mjs
    reason: Execute the explicit Support Report qualification surface selected by the workflow.
  - path: tabs/support-steel-relationship-builder/**
    reason: Materialize exact production dependencies used by the tests.
  - path: tabs/ps-family-clash-audit/ps-family-psclash-xml-parser.js
    reason: Materialize the shared relationship parser used by Primary Support input parsing.
  - path: agents/chains/SUPPORT-PRIMARY-1225/**
    reason: Preserve legacy evidence and authority context during migration.
  protected:
  - invariant: Frozen RC 759612b4e355a585aed7d64b566f199340429bdf is immutable during this EP.
    reason: Qualification receipts must remain attributable to one product identity.
  - invariant: Geometry grouping is not promoted over explicit relationship topology, DATUM remains non-countable, ambiguity fails closed, and secondary typicality channels cannot promote structural rejection.
    reason: These are protected product semantics from #1225/#1222.
  - invariant: Governed clean-checkout, ZIP, browser and real-1835 gates retain their own PASS/FAIL/NOT_RUN status.
    reason: Local reconstructed Node diagnostics are not substitutes for different evidence classes.
  prohibited:
  - domain: tabs/** product mutation
    reason: No reproducible first-wrong-boundary product failure exists at EP creation.
  - domain: tests/** or .github/workflows/** mutation
    reason: This EP executes the frozen qualification contract; it does not rewrite it.
  - domain: benchmarks/** mutation or oracle editing
    reason: Owner benchmark inputs/oracles are protected evidence.
  - domain: PR #1223 readiness, rebase, merge or close operations
    reason: Merge authority is Owner-only and release disposition remains HOLD_DRAFT.
  owner_reserved:
  - decision: Authorize a new product RC or merge/readiness transition.
    reason: These actions change release authority and require explicit Owner authorization.
  - decision: Supply or designate the authoritative real 1835 relationship XML.
    reason: The input is external Owner authority and cannot be inferred or substituted.
anti_drift:
  do_not:
  - id: ADR-01
    restriction: Do not mutate product/test/workflow/benchmark material while executing WP-001.
    reason: Preserve frozen-RC diagnostic attribution.
  - id: ADR-02
    restriction: Do not classify reconstructed local diagnostics as governed clean-checkout PASS evidence.
    reason: Evidence classes have different trust and input requirements.
  stale_if:
  - id: STALE-01
    condition: PR #1223 head changes from 759612b4e355a585aed7d64b566f199340429bdf.
    effect: STALE
    rationale: The EP no longer addresses the current RC.
  - id: STALE-02
    condition: RM-0002 changes WP-001 scope, dependencies, acceptance or protected invariants.
    effect: STALE
    rationale: The forward execution contract no longer matches roadmap authority.
  - id: STALE-03
    condition: Owner changes merge authority, product mutation authority, or the governed qualification definition.
    effect: STALE
    rationale: Authority assumptions must be reconciled before continuing.
implementation_plan:
- id: STEP-01
  objective: Resolve the exact frozen-RC workflow-equivalent Node test inventory.
  targets: [.github/workflows/support-report-typicality-qualification.yml, tests]
  reads: [.github/workflows/support-report-typicality-qualification.yml, tests]
  writes: []
  inputs: [INPUT-01, INPUT-02]
  acceptance: [AC-01]
  tests: [TEST-01]
  expected_state: One explicit test inventory derived from the RC workflow, with no stale runbook substitutions.
  stop_conditions: [Stop if the RC workflow cannot be resolved exactly.]
- id: STEP-02
  objective: Materialize the full text dependency closure needed by the resolved tests into an ephemeral local workspace and verify frozen-RC object identity.
  targets: [tests/support-primary-*.test.mjs, tests/support-report-*.test.mjs, tabs/support-steel-relationship-builder/**, tabs/ps-family-clash-audit/ps-family-psclash-xml-parser.js]
  reads: [frozen RC repository objects]
  writes: []
  inputs: [INPUT-01]
  acceptance: [AC-02]
  tests: [TEST-02]
  expected_state: Every executed repository text file is tied to its frozen-RC object identity; unresolved files remain explicit gaps.
  stop_conditions: [Stop rather than fabricate or hand-edit a missing dependency.]
- id: STEP-03
  objective: Execute the resolved Node test surface under Node 22 and retain raw outcome classification.
  targets: [ephemeral local workspace]
  reads: [materialized exact-RC dependency closure]
  writes: []
  inputs: [INPUT-01, INPUT-02, INPUT-03]
  acceptance: [AC-03]
  tests: [TEST-03]
  expected_state: PASS/FAIL/NOT_RUN totals and first failing boundary, if any, are known without product mutation.
  stop_conditions: [Stop product patching unless an executable failure identifies a concrete first-wrong production boundary.]
- id: STEP-04
  objective: Reconcile the diagnostic result into V2.5 evidence while preserving governed gate classifications and release controls.
  targets: [agents/relay/checkpoints, agents/relay/quality, agents/relay/roadmap/PROGRESS.yaml, agents/relay/REPO_STATE.yaml]
  reads: [raw local execution result, legacy retained evidence]
  writes: [agents/relay/checkpoints, agents/relay/quality, agents/relay/roadmap/PROGRESS.yaml, agents/relay/REPO_STATE.yaml]
  inputs: [INPUT-01, INPUT-02]
  acceptance: [AC-04]
  tests: [TEST-04]
  expected_state: Diagnostic evidence is durable, no governed gate is improperly upgraded, and the next frontier is recomputed.
  stop_conditions: [Do not perform STEP-04 material writes until takeover certification and material_write_ready permit them.]
next_work:
  phase_transition: false
  steps:
  - order: 1
    action: Execute DSTEP-01 through DSTEP-03, create candidate discovery/takeover evidence required by V2.5, and only after material write readiness execute STEP-01 through STEP-04.
    targets: [agents/relay/REPO_STATE.yaml, agents/relay/execution-packages/EP-0001.yaml, frozen RC source and tests]
    inputs: [INPUT-01, INPUT-02, INPUT-03]
    tests: [TEST-01, TEST-02, TEST-03, TEST-04]
    benchmarks: [BENCH-01, BENCH-02]
    acceptance: [AC-01, AC-02, AC-03, AC-04]
    expected_result: The full local exact-source Node diagnostic surface is classified with durable evidence and without mutating the frozen product RC.
    stop_if: [Route or RC identity changes, takeover certification fails, a required exact source cannot be resolved, or a protected invariant would be violated.]
qualification_boundary:
  required: false
  trigger: null
  from_phase: null
  to_phase: null
  changed_dimensions: []
  basis: []
  question_set: null
quality:
  applicable:
  - blueprint: testing
    reason: WP-001 exists to execute and classify repository-owned qualification tests.
    review_focus: [exact test inventory, object identity, raw outcome classification, NOT_RUN discipline]
  - blueprint: migration
    reason: This is the first executable package after V2 to V2.5 relay migration and evidence classifications must remain semantically preserved.
    review_focus: [legacy evidence preservation, authority mapping, progress/frontier consistency]
  not_applicable:
  - {blueprint: coding, reason: Product or relay implementation code changes are prohibited in WP-001; only relay evidence/control artifacts may be written after certification.}
  - {blueprint: software-design, reason: No product architecture or state-ownership redesign is authorized.}
  - {blueprint: ui-ux, reason: Browser/UI execution is a later work package and no UI change is authorized here.}
  - {blueprint: engineering-numerics, reason: WP-001 does not alter numerical tolerances or engineering calculations.}
  - {blueprint: code-review, reason: No product patch is created in this EP.}
  - {blueprint: accessibility, reason: No UI implementation change occurs in this EP.}
  - {blueprint: performance, reason: This EP is correctness/evidence execution rather than performance tuning.}
  - {blueprint: github-delivery, reason: No GitHub issue/PR projection mutation is required to execute WP-001.}
  review_contract:
    required: true
    required_before_checkpoint: true
    receipt_namespace: QRV-
    required_outputs: [procedure_results, findings, owner_report, successor_handover]
  findings_policy: Quality findings remain quality state unless they map to an existing acceptance, authority, protected-invariant, or safety hard-stop condition.
  ordinary_findings_are_hard_stops: false
acceptance:
- id: AC-01
  description: The exact workflow-equivalent focused Node test inventory is resolved from frozen RC repository authority.
  weight: 20
  verification: [TEST-01, BENCH-02]
- id: AC-02
  description: Every repository text file actually executed locally is bound to the frozen RC by Git object identity or an equivalent exact repository identity; unverifiable dependencies are not executed as if authoritative.
  weight: 25
  verification: [TEST-02, BENCH-01]
- id: AC-03
  description: The resolvable workflow-equivalent Node surface executes under Node 22 with raw PASS/FAIL/NOT_RUN results and any reproducible failure localized before patching.
  weight: 45
  verification: [TEST-03, BENCH-02]
- id: AC-04
  description: Product/test/workflow/oracle/merge state remains unchanged and local diagnostics do not upgrade governed clean-checkout, ZIP, browser, or real-1835 gates.
  weight: 10
  verification: [TEST-04]
validation:
- id: TEST-01
  class: MUST_PASS
  method: Compare the resolved local test inventory to the node --test selectors in the exact-RC qualification workflow.
  proves: [AC-01]
- id: TEST-02
  class: MUST_PASS
  method: Recompute/compare Git blob object identity for every materialized repository text file used by execution.
  proves: [AC-02]
- id: TEST-03
  class: MUST_PASS
  method: Execute the resolved node --test command under Node 22 and retain raw test totals and failure output; missing dependency/transport is NOT_RUN.
  proves: [AC-03]
- id: TEST-04
  class: MUST_PASS
  method: Re-read PR head/status, frozen RC, governed gate ledger and changed custody paths before checkpoint publication.
  proves: [AC-04]
failure_and_stop_conditions:
  hard_stop_categories: [OWNER_DECISION_REQUIRED, ESSENTIAL_INPUT_MISSING, AUTHORITY_VIOLATION, PROTECTED_INVARIANT_FAILURE, WRITE_COLLISION, SUPERSEDED_EP, ROADMAP_CONFLICT, REPOSITORY_STATE_CONFLICT, UNSAFE_ENGINEERING_RESULT]
report_contract:
