claims:
  - id: PR1009-CLAIM-001
    statement: Writer1C SIF Phase-2B writable custody is limited to canonical neutral Version 11 with exact parsed ELEMENT index to physical 15-row block index plus matching FROM/TO endpoints.
    evidence: tabs/cii-workspace/cii-workspace-writer1c-sif-custody.js
    status: IMPLEMENTED_SOURCE_INSPECTED
  - id: PR1009-CLAIM-002
    statement: Qualified production SIF mutation is limited to existing 10-row SIF blocks and item3 ii / item4 io fields; block creation, pointer allocation and raw payload copy remain excluded.
    evidence: tabs/cii-workspace/cii-workspace-writer1c-sif-custody.js; tabs/cii-workspace/cii-workspace-writer1c-sif.js
    status: IMPLEMENTED_SOURCE_INSPECTED
  - id: PR1009-CLAIM-003
    statement: Blank or non-numeric SIF state is not treated as numeric zero, and the production mutation slice requires explicit finite current/proposed values >= 1.0.
    evidence: tabs/cii-workspace/cii-workspace-writer1c-sif-deltas.js; tabs/cii-workspace/cii-workspace-writer1c-sif.js; tests/cii-workspace-writer1c-sif-phase2b.test.js
    status: IMPLEMENTED_SOURCE_INSPECTED_TEST_AUTHORED_NOT_RUN
  - id: PR1009-CLAIM-004
    statement: Production SIF mutation requires finite equal SOURCE/TARGET tee Type and agreement with the actual TARGET slot Type.
    evidence: tabs/cii-workspace/cii-workspace-writer1c-sif-deltas.js; tabs/cii-workspace/cii-workspace-writer1c-sif.js
    status: IMPLEMENTED_SOURCE_INSPECTED
  - id: PR1009-CLAIM-005
    statement: Piping-code equality is not inferred from an unqualified neutral-file field; mutation requires an explicit engineer-attested same-active-piping-code context.
    evidence: tabs/cii-workspace/cii-workspace-transfer-policy.js; tabs/cii-workspace/cii-workspace-writer1c-sif.js; tabs/cii-workspace/cii-workspace-tab.js; tabs/cii-workspace/cii-workspace-transfer-scope-ui.js
    status: IMPLEMENTED_SOURCE_INSPECTED
  - id: PR1009-CLAIM-006
    statement: Shared physical SIF spans block unapproved alias effects, canonicalize identical all-owner postimages and block divergent postimages.
    evidence: tabs/cii-workspace/cii-workspace-writer1c-sif.js; tests/cii-workspace-writer1c-sif-phase2b.test.js
    status: IMPLEMENTED_SOURCE_INSPECTED_TEST_AUTHORED_NOT_RUN
  - id: PR1009-CLAIM-007
    statement: Writer1C NODENAME and SIF mutations are patched against one original TARGET byte preimage with overlap protection rather than sequential writer output chaining.
    evidence: tabs/cii-workspace/cii-workspace-target-writer-1c.js
    status: IMPLEMENTED_SOURCE_INSPECTED
  - id: PR1009-CLAIM-008
    statement: Writer1C round-trip validation independently derives authorized NODENAME/SIF spans and rejects unrelated byte changes outside that set.
    evidence: tabs/cii-workspace/cii-workspace-writer1c-validation.js; tests/cii-workspace-writer1c-sif-phase2b.test.js
    status: IMPLEMENTED_SOURCE_INSPECTED_TEST_AUTHORED_NOT_RUN
  - id: PR1009-CLAIM-009
    statement: A parsed-element-index displacement with otherwise matching endpoints cannot qualify writable SIF physical custody.
    evidence: tests/cii-workspace-writer1c-sif-phase2b.test.js
    status: AUTHORED_NOT_RUN_ENVIRONMENT
  - id: PR1009-CLAIM-010
    statement: Browser Writer1C flow carries explicit SIF code context and rechecks current context at apply time to prevent stale authorization reuse.
    evidence: tabs/cii-workspace/cii-workspace-tab.js; tabs/cii-workspace/cii-workspace-transfer-scope-ui.js; tests/cii-workspace-writer1c-sif-context-ui.test.js
    status: IMPLEMENTED_SOURCE_INSPECTED_TEST_AUTHORED_NOT_RUN
  - id: PR1009-CLAIM-011
    statement: The low-level SIF mutation planner independently validates the piping-code authority token and normalized SOURCE/TARGET code equality; a forged QUALIFIED status alone cannot authorize mutation.
    evidence: tabs/cii-workspace/cii-workspace-writer1c-sif.js; tests/cii-workspace-writer1c-sif-context-planner.test.js
    status: IMPLEMENTED_SOURCE_INSPECTED_TEST_AUTHORED_NOT_RUN
  - id: PR1009-CLAIM-012
    statement: Dedicated qualification coverage exists for all four Version-11 mutable positions: slot1 item3 ii, slot1 item4 io, slot2 item3 ii and slot2 item4 io, each asserting its exact 13-byte mutation span.
    evidence: tests/cii-workspace-writer1c-sif-four-position-plan.test.js
    status: AUTHORED_NOT_RUN_ENVIRONMENT
qualification_findings:
  - id: PR1009-QF-001
    finding: Low-level planner previously trusted sifContext.status=QUALIFIED without independently checking the authority token and equal non-empty code values.
    disposition: FIXED_IN_PR
  - id: PR1009-QF-002
    finding: Initial positive mutation regression covered only slot1 item3 ii while the production claim covers four Version-11 positions.
    disposition: COVERAGE_CLOSED_WITH_FOUR_POSITION_TEST
