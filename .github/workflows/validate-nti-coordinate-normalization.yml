name: Validate NTI Coordinate Normalization

on:
  push:
    branches: [owner/nti-coordinate-normalization]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner/nti-coordinate-normalization
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply source patch
        run: python scripts/run-nti-coordinate-normalization.py
      - name: Generate focused test
        continue-on-error: true
        run: |
          mkdir -p artifacts/nti-coordinate-normalization
          python scripts/write-nti-coordinate-profile-test.py > artifacts/nti-coordinate-normalization/test-writer.log 2>&1
      - name: Upload writer diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nti-coordinate-test-writer
          path: artifacts/nti-coordinate-normalization/test-writer.log
          if-no-files-found: warn
