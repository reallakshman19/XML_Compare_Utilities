name: CII102 independent original physical chain falsifier

on:
  pull_request:
    paths:
      - "tests/cii102-independent-original-chain-falsifier.test.mjs"
      - "tests/cii102-f2-original-chain-review.test.mjs"
      - "tests/cii102-owner-phase2-verbatim-428-audit.test.mjs"
      - "tests/cii102-owner-phase2-source-level-product-comparison.test.mjs"
      - "tests/cii102-owner-landmark-span-contract.test.mjs"
      - "scripts/cii-architecture-a2-landmark-span-shadow.mjs"
      - "tests/qualification/owner-phase2-20261015-*"
      - "tests/cii-102-reconciled-authority-review.test.mjs"
      - "docs/tabs/cii-workspace/cii102-independent-pr103-adoption-2026-10-15.md"
      - "parser/**"
      - "Benchmark/**"
      - "tabs/cii-workspace/**"
      - ".github/workflows/cii102-independent-chain-adoption.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-original-replay:
    name: SHA-frozen S2/S3 full chain and unchanged active Writer2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout independent PR
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse independent chain falsifier
        run: node --check tests/cii102-independent-original-chain-falsifier.test.mjs
      - name: Replay immutable original S2/S3/T physical chains, with OD revision alternatives
        run: node tests/cii102-independent-original-chain-falsifier.test.mjs
      - name: Verify SHA-frozen original F2 witness joins in existing Compare Review
        run: node tests/cii102-f2-original-chain-review.test.mjs
      - name: Re-run authentic P1/P2 coexistence boundary on S1/S2/S3/T (no Writer)
        run: node tests/cii-102-reconciled-authority-review.test.mjs
      - name: Audit exact Owner 428-row raw PS-to-SL list against original CII lexical and physical census
        run: node tests/cii102-owner-phase2-verbatim-428-audit.test.mjs
      - name: Verify Owner A-01 2-source-to-1-target landmark span and 100mm tolerance negative controls
        run: node tests/cii102-owner-landmark-span-contract.test.mjs
      - name: Compare blind current product AUTO/manual replay with physically addressable Owner PS-to-SL pairs
        run: node tests/cii102-owner-phase2-source-level-product-comparison.test.mjs
      - name: Retain Owner input reconciliation and unresolved crosswalk JSON evidence
        uses: actions/upload-artifact@v4
        with:
          name: cii102-owner-428-golden-custody-${{ github.sha }}
          path: |
            test-results/cii-method-a-qualification/owner-phase2-428-current-custody-audit.json
            test-results/cii-method-a-qualification/owner-phase2-428-source-level-product-comparison.json
          if-no-files-found: error

