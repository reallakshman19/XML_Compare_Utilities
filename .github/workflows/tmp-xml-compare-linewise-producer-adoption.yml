name: Temporary XML Compare Line-wise Producer Adoption

on:
  pull_request:
    paths:
      - 'scripts/apply-xml-compare-linewise-producer-adoption.py'
      - '.github/workflows/tmp-xml-compare-linewise-producer-adoption.yml'
      - 'xml-compare/XmlCompareLinewiseProducerAdoption.js'
      - 'xml-compare/XmlCompareLinewiseProducerStatusView.js'
      - 'xml-compare/XmlCompareLinewiseWorkflowActions.js'
      - 'xml-compare/XmlCompareLinewiseWorkflowState.js'
      - 'tests/xml-compare-linewise-producer-adoption.test.js'

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.head_ref == 'agent/xml-compare-sideload-producer-adoption'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply exact adoption patch
        run: python scripts/apply-xml-compare-linewise-producer-adoption.py

      - name: Run syntax and source limits
        id: syntax
        continue-on-error: true
        run: |
          set -o pipefail
          {
            node --check xml-compare/XmlCompareLinewiseProducerAdoption.js
            node --check xml-compare/XmlCompareLinewiseProducerStatusView.js
            node --check xml-compare/XmlCompareLinewiseWorkflowActions.js
            node --check xml-compare/XmlCompareLinewiseWorkflowState.js
            node --check xml-compare/XmlCompareLinewiseWorkflowView.js
            node --check tabs/xml-compare-tab.js
            node --check tests/xml-compare-linewise-producer-adoption.test.js
            python - <<'PY'
          from pathlib import Path
          for path in [
              'xml-compare/XmlCompareLinewiseProducerAdoption.js',
              'xml-compare/XmlCompareLinewiseProducerStatusView.js',
          ]:
              count = len(Path(path).read_text(encoding='utf-8').splitlines())
              assert count <= 300, f'{path} exceeds 300 lines: {count}'
          PY
          } > xml-compare-linewise-adoption-syntax.log 2>&1

      - name: Upload syntax evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml-compare-linewise-adoption-syntax-log
          path: xml-compare-linewise-adoption-syntax.log
          retention-days: 14

      - name: Enforce syntax and source limits
        if: always()
        run: |
          cat xml-compare-linewise-adoption-syntax.log
          test '${{ steps.syntax.outcome }}' = 'success'

      - name: Focused adoption tests
        run: |
          node tests/xml-compare-linewise-producer-adoption.test.js
          node tests/xml-compare-linewise-workflow-native.test.js
          node tests/inputxml-workspace-accdb-sideload.test.js
          node tests/categorized-inputxml-worker-integration.test.js

      - name: Full repository tests
        run: npm test

      - name: Commit tested product patch and self-clean
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          rm scripts/apply-xml-compare-linewise-producer-adoption.py
          rm .github/workflows/tmp-xml-compare-linewise-producer-adoption.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: adopt producer worker in XML Compare sideload'
          git push origin "HEAD:${BRANCH}"
