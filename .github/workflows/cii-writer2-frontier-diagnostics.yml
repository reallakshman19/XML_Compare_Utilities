# Read-only qualification for truthful CII Writer2 frontier diagnostics (#69).
# PR code is untrusted: no secrets, no pull_request_target, no write permissions.
name: CII Writer2 Frontier Diagnostics
on:
  push:
    branches:
      - fix/cii-writer2-frontier-diagnostics-69
  pull_request:
    paths:
      - 'tabs/cii-workspace/cii-workspace-compare-review.js'
      - 'tabs/cii-workspace/cii-workspace-multisource-review-ui.js'
      - 'tabs/cii-workspace/cii-workspace-propagation.js'
      - 'tests/cii-workspace-frontier-diagnostics.test.js'
      - '.github/workflows/cii-writer2-frontier-diagnostics.yml'

permissions:
  contents: read

jobs:
  review-diagnostics:
    name: Frontier and review authority regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Real Node.js focused correspondence/review tests
        run: |
          set -euo pipefail
          node tests/cii-workspace-frontier-diagnostics.test.js
          node tests/cii-workspace-compare-review-ambiguity.test.js
          node tests/cii-workspace-multisource-review-ui.test.js
          node tests/cii-workspace-multisource-review-state.test.js
          node tests/cii-workspace-propagation.test.js
          node tests/cii-workspace-single-anchor.test.js
          node tests/cii-workspace-source-target-audit.test.js
  retained-benchmark:
    name: Original multisource benchmark (non-mutating)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Physical S1/S2/S3 to T automatic anchor retention
        run: |
          set -euo pipefail
          node tests/cii-workspace-multisource-retained-auto-anchor-benchmark.test.js
          node tests/cii-workspace-multisource-texpected-benchmark.test.js
