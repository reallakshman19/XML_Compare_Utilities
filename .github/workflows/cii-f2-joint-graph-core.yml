name: CII ARCH01 F2 Joint Graph Core (Read-only)
on:
  push:
    branches: [feat/cii-69-f2-joint-graph-core-20261015]
  pull_request:
    paths:
      - scripts/cii-architecture-a2-*.mjs
      - scripts/cii-a2-json-sha256.mjs
      - tabs/cii-workspace/cii-workspace-f2-canonical-*.js
      - tabs/cii-workspace/cii-workspace-f2-physical-gap-ledger.js
      - tabs/cii-workspace/cii-workspace-multisource-writer2-ui.js
      - tests/cii-arch01-f2-isomorphic-sha.test.js
      - tests/browser/cii-f2-canonical-worker.spec.mjs
      - playwright.cii-f2-canonical-worker.config.mjs
      - tabs/cii-workspace/architecture/**
      - tests/cii-architecture-a*.test.js
      - tests/cii-arch01-f2-authority-mode-original-census.test.js
      - .github/workflows/cii-f2-joint-graph-core.yml

permissions:
  contents: read

jobs:
  original-and-falsifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node source parse
        run: |
          node --check scripts/cii-architecture-a2-shadow-joint-evidence.mjs
          node --check scripts/cii-architecture-a2-physical-path-constraints.mjs
          node --check scripts/cii-architecture-a2-global-constraint-shadow.mjs
          node --check scripts/cii-architecture-a2-frontier-recovery.mjs
          node --check scripts/cii-architecture-a2-frontier-reconciliation.mjs
          node --check scripts/cii-arch01-f2-joint-report.mjs
          node --check tabs/cii-workspace/architecture/cii-transfer-capability-contracts.js
      - name: Cross-runtime SHA-256 parity and no Node-only core imports
        run: node tests/cii-arch01-f2-isomorphic-sha.test.js
      - name: Transfer family read-only contracts
        run: node tests/cii-architecture-a1-capability-contracts.test.js
      - name: Original S1 S2 S3 AUTO vs manual claim reconciliation
        run: node tests/cii-architecture-a2-shadow-joint-evidence.test.js
      - name: Physical EDGE / 1-to-N PIPE / bounded path falsifiers and originals
        run: node tests/cii-architecture-a2-physical-path-constraints.test.js
      - name: Global constrained solution, multiple-solution veto and custody original
        run: node tests/cii-architecture-a2-global-constraint-shadow.test.js
      - name: Recovered SOURCE frontiers and independent physical witness reconciliation
        run: node tests/cii-architecture-a2-frontier-reconciliation.test.js
      - name: Exact original factor endpoint RCA and adversarial proof controls
        run: node tests/cii-f2-physical-gap-rca.test.js
      - name: Original Owner AUTO vs MANUAL census and 11 Phase 1 rows (#96 retained)
        run: node tests/cii-arch01-f2-authority-mode-original-census.test.js
      - name: Existing production correspondence is unaffected
        run: |
          node tests/cii-workspace-multisource-retained-auto-anchor-benchmark.test.js
          node tests/cii-workspace-source-target-audit.test.js
      - name: Install browser test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Real original CII browser canonical A2 Worker and legacy Writer preservation
        run: npx playwright test --config=playwright.cii-f2-canonical-worker.config.mjs
      - name: Original 100mm main-gate shadow report
        run: |
          node scripts/cii-arch01-f2-joint-report.mjs \
            --source S1:Benchmark/S1.CII --source S2:Benchmark/S2.CII \
            --source S3:Benchmark/S3.CII --target Benchmark/T.CII \
            --manual S2:420:415 --manual S3:1580:7880 \
            --m1-tolerance 100 --out test-results/cii-arch01-f2-joint-100.json
      - name: Real 200mm F2 physical report on integrated Method A policy
        run: |
          node scripts/cii-arch01-f2-joint-report.mjs \
            --source S1:Benchmark/S1.CII --source S2:Benchmark/S2.CII \
            --source S3:Benchmark/S3.CII --target Benchmark/T.CII \
            --manual S2:420:415 --manual S3:1580:7880 \
            --m1-tolerance 200 --out test-results/cii-arch01-f2-joint-200.json
      - name: Test same original double-blank physical discriminator at actual Method A 100 and 200mm
        run: |
          for tol in 100 200; do
            node scripts/cii-102-f2-double-blank-geometry-probe.mjs \
              --report test-results/cii-arch01-f2-joint-${tol}.json \
              --out test-results/cii102-f2-double-blank-${tol}.json
          done
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import assert from "node:assert/strict";
            const a=JSON.parse(readFileSync("test-results/cii102-f2-double-blank-100.json"));
            const b=JSON.parse(readFileSync("test-results/cii102-f2-double-blank-200.json"));
            assert.equal(a.originalDoubleBlankFactors,21);
            assert.equal(a.originalPhysicalSourceNodes,150);
            assert.equal(a.originalPhysicalSourceElements,147);
            assert.deepEqual(a.selectedSourceFactors.map(r=>r.sourceElementKey),[
              "S1:E9:4050->4060","S2:E44:630->640","S3:E1:1350->1360"
            ]);
            for(const x of [a,b]){
              assert.equal(x.physicalCertifications,0);
              assert.equal(x.writerReady,false);
              assert.equal(x.transferPlan,null);
              assert.equal(x.writeScope,null);
              assert.deepEqual(x.selectedSourceFactors.map(r=>r.adjacentSeedBoundaryAnalysis.reduce(
                (n,e)=>n+e.originalTargetSeedIds.length,0)),[1,0,0]);
              assert.deepEqual(x.selectedSourceFactors.map(r=>r.adjacentSeedBoundaryAnalysis.reduce(
                (n,e)=>n+e.newlyRecoveredUnverifiedTargetSeedIds.length,0)),[2,1,0]);
              assert.deepEqual(x.selectedSourceFactors.map(r=>r.boundaryDiagnosis),[
                "ONLY_UNVERIFIED_RECOVERED_SEEDS_HAVE_ROOTED_PATHS",
                "CURRENT_SEEDS_WITH_NO_BOUNDED_ROOTED_PHYSICAL_PATH",
                "NO_IMMEDIATE_TARGET_SEED_REQUIRES_INDEPENDENT_COMPONENT_BASIS"
              ]);
            }
            assert.equal(a.originalTargetSha256,b.originalTargetSha256);
            assert.deepEqual(a.originalSourceShaById,b.originalSourceShaById);
            // Geometry is independently enumerated from original files, not
            // from M1 score weights; two applied policies must not fabricate
            // different physical target routes for identical original edges.
            assert.deepEqual(a.selectedSourceFactors,b.selectedSourceFactors);
            console.log("CII102_BOTH_ENDPOINTS_BOUNDARY_COMPARE_100_200_PASS",
              JSON.stringify(a.selectedSourceFactors.map(r=>({
                factor:r.sourceElementKey,boundaryDiagnosis:r.boundaryDiagnosis,
                unanchoredPhysicalRoutes:r.targetRoutesWithGeometryOnly
              }))));
          '
      - name: Compare actual 100mm and 200mm applied policy, physical census and no Writer
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import assert from "node:assert/strict";
            const a=JSON.parse(readFileSync("test-results/cii-arch01-f2-joint-100.json"));
            const b=JSON.parse(readFileSync("test-results/cii-arch01-f2-joint-200.json"));
            assert.equal(a.policy.spatialToleranceMm,100);
            assert.equal(a.policy.appliedSpatialToleranceMm,100);
            assert.equal(a.policy.requestedSpatialToleranceCapability,"RUNTIME_CONFIGURED");
            assert.equal(b.policy.spatialToleranceMm,200);
            assert.equal(b.policy.appliedSpatialToleranceMm,200);
            assert.equal(b.policy.requestedSpatialToleranceCapability,"RUNTIME_CONFIGURED");
            assert.deepEqual(a.custody,b.custody);
            assert.deepEqual(a.originalPhysicalSourceNodeCount,b.originalPhysicalSourceNodeCount);
            assert.deepEqual(a.originalPhysicalSourceElementCount,b.originalPhysicalSourceElementCount);
            assert.equal(b.writerReady,false);
            assert.deepEqual(b.identityCertificates,[]);
            assert.equal(b.physicalGapLedger.writerReady,false);
            assert.equal(a.policy.qualifiedMethodAScoreLinkPresent,"REQUIRE_SEPARATE_PR98_PROOF");
            assert.equal(a.originalPhysicalSourceNodeCount,150);
            assert.equal(a.originalPhysicalSourceElementCount,147);
            assert.equal(a.physicalGapLedger.schema,"CiiF2PhysicalFactorGapLedger.v1");
            assert.equal(a.physicalGapLedger.totalPhysicalSourceElements,147);
            assert.equal(a.physicalGapLedger.originalEndpointMissingFactors,49);
            assert.equal(a.physicalGapLedger.currentEndpointMissingFactors,33);
            const gap=a.physicalGapLedger;
            assert.equal(Object.values(gap.originalRootCauseCounts).reduce((x,y)=>x+y,0),49);
            assert.equal(Object.values(gap.currentMissingEndpointDirectionCounts).reduce((x,y)=>x+y,0),33);
            assert.equal(Object.values(gap.byMember).reduce((x,y)=>x+y.physicalElementCount,0),147);
            assert(gap.rows.every(x=>x.endpointDiagnosis?.length===2));
            assert(gap.rows.every(x=>x.nextInvestigation&&!x.physicalIdentityCertified&&!x.writerReady));
            assert(gap.rows.filter(x=>x.recheckedStatus==="ENDPOINT_CANDIDATE_MISSING")
              .every(x=>x.endpointDiagnosis.some(y=>y.missingAfter)));
            for(const suffix of ["100","200"]){
              const csv=readFileSync("test-results/cii-arch01-f2-joint-"+suffix+".physical-gap-rca.csv","utf8");
              assert.equal(csv.trimEnd().split("\n").length,148);
              assert(csv.includes("sourceElementKey")&&csv.includes("nextInvestigation"));
            }
            console.log("F2_INTEGRATED_FACTOR_RCA",JSON.stringify({
              originalRootCauses:gap.originalRootCauseCounts,
              remainingMissingDirections:gap.currentMissingEndpointDirectionCounts,
              byMember:gap.byMember,nextActions:gap.nextInvestigationCounts
            }));
            assert.equal(new Set(a.physicalGapLedger.rows.map(x=>x.sourceElementKey)).size,147);
            assert.equal(a.physicalGapLedger.writerReady,false);
            assert.equal(a.physicalGapLedger.writeScope,null);
            assert.equal(a.writerReady,false);
            assert.deepEqual(a.identityCertificates,[]);
            assert.equal(a.frontierRecovery.recoveredHypotheses,22);
            assert.equal(a.frontierReconciliation.uniqueNewlyCoveredNodes,16);
            assert.deepEqual(a.globalConstraints.states,{INCOMPLETE_PHYSICAL_EVIDENCE:3});
            console.log("F2_INTEGRATED_100_200_POLICY",JSON.stringify({
              sourceNodeCount:a.originalPhysicalSourceNodeCount,
              sourceElementFactors:a.originalPhysicalSourceElementCount,
              modeCensus:a.modeCensus.map(x=>({mode:x.mode,BOUND:x.BOUND,UNEMITTED:x.UNEMITTED})),
              recoveredHypotheses:a.frontierRecovery.recoveredHypotheses,
              certifiedNodeCount:a.certifiedNodeCount,writerReady:a.writerReady
            }));
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cii-arch01-f2-100-200-joint-shadow
          path: |
            test-results/cii-arch01-f2-joint-*.json
            test-results/cii102-f2-double-blank-*.json
            test-results/cii-arch01-f2-joint-*.physical-gap-rca.csv
          if-no-files-found: warn
          retention-days: 14
