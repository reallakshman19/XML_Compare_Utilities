name: Topology SVG Editor Evidence

on:
  pull_request:
    paths:
      - 'tabs/topology-trace-validator/**'
      - 'tests/topology-svg-editor-foundation.test.js'
      - 'tests/topology-trace-validator-static.test.js'
      - 'tests/browser/topology-trace-validator.spec.mjs'
      - '.github/workflows/topology-svg-editor-evidence.yml'
  workflow_dispatch:

jobs:
  editor-contract-and-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run SVG editor foundation contracts
        run: node tests/topology-svg-editor-foundation.test.js

      - name: Validate changed module syntax and limits
        shell: bash
        run: |
          set -euo pipefail
          files=(
            tabs/topology-trace-validator/topology-svg-editor-model.js
            tabs/topology-trace-validator/topology-svg-editor-history.js
            tabs/topology-trace-validator/topology-svg-editor-view-model.js
            tabs/topology-trace-validator/topology-svg-editor-overlay.js
            tabs/topology-trace-validator/topology-svg-editor-controller.js
            tabs/topology-trace-validator/topology-validator-controller.js
            tabs/topology-trace-validator/topology-workspace-controller.js
            tabs/topology-trace-validator/topology-trace-validator-tab.js
            tabs/topology-trace-validator/topology-workspace-markup.js
          )
          for file in "${files[@]}"; do
            node --check "$file"
            test "$(wc -l < "$file")" -le 300
            ! grep -Eq "export[[:space:]]+default|from[[:space:]]+['\"]node:|require\\(|process\\." "$file"
          done

      - name: Generate backup comparison patch
        shell: bash
        run: |
          set -euo pipefail
          worklog='.agent-worklogs/20260717_1208_ttv-svg-editor-foundation'
          backup='.backups/20260717_1208_ttv-svg-editor-foundation'
          mkdir -p "$worklog" artifacts/ttv-svg-editor-foundation
          patch='artifacts/ttv-svg-editor-foundation/changes.patch'
          : > "$patch"
          compare() {
            local relative="$1"
            git diff --no-index --binary -- "$backup/$relative" "$relative" >> "$patch" || test "$?" -eq 1
          }
          compare 'tabs/topology-trace-validator/topology-validator-controller.js'
          compare 'tabs/topology-trace-validator/topology-workspace-controller.js'
          compare 'tabs/topology-trace-validator/topology-trace-validator-tab.js'
          compare 'tabs/topology-trace-validator/topology-workspace-markup.js'
          compare 'tabs/topology-trace-validator/topology-parity-workspace.css'
          compare 'tests/topology-trace-validator-static.test.js'
          compare 'tests/browser/topology-trace-validator.spec.mjs'
          for relative in \
            'tabs/topology-trace-validator/topology-svg-editor-model.js' \
            'tabs/topology-trace-validator/topology-svg-editor-history.js' \
            'tabs/topology-trace-validator/topology-svg-editor-view-model.js' \
            'tabs/topology-trace-validator/topology-svg-editor-overlay.js' \
            'tabs/topology-trace-validator/topology-svg-editor-controller.js' \
            'tabs/topology-trace-validator/topology-svg-editor.css' \
            'tests/topology-svg-editor-foundation.test.js' \
            '.github/workflows/topology-svg-editor-evidence.yml'; do
            git diff --no-index --binary -- /dev/null "$relative" >> "$patch" || test "$?" -eq 1
          done
          cp "$patch" "$worklog/changes.patch"

      - name: Upload SVG editor evidence
        uses: actions/upload-artifact@v4
        with:
          name: topology-svg-editor-${{ github.sha }}
          path: |
            .agent-worklogs/20260717_1208_ttv-svg-editor-foundation/changes.patch
            artifacts/ttv-svg-editor-foundation/changes.patch
          if-no-files-found: error
          retention-days: 30
