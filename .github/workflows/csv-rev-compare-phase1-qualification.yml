name: CSV Rev Compare Phase 1 Qualification

on:
  push:
    branches:
      - issue-1181-csv-rev-compare-xml
    paths:
      - 'tabs/csv-rev-compare/**'
      - 'xml-compare/table-categorizer/**'
      - 'scripts/csv-rev-compare-phase1-real-benchmark.mjs'
      - 'scripts/support-report-xlsx-zip-to-csv.py'
      - 'tests/csv-rev-compare-*.test.js'
      - 'tests/table-categorized-creation-modes.test.js'
      - '.github/workflows/csv-rev-compare-phase1-qualification.yml'
  pull_request:
    paths:
      - 'tabs/csv-rev-compare/**'
      - 'xml-compare/table-categorizer/**'
      - 'scripts/csv-rev-compare-phase1-real-benchmark.mjs'
      - 'scripts/support-report-xlsx-zip-to-csv.py'
      - 'tests/csv-rev-compare-*.test.js'
      - 'tests/table-categorized-creation-modes.test.js'
      - '.github/workflows/csv-rev-compare-phase1-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  phase1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Phase 1 PS No. change benchmark contract
        run: node tests/csv-rev-compare-phase1-ps-no-change.test.js

      - name: Phase 1 real mismatch regression patterns
        run: node tests/csv-rev-compare-phase1-real-patterns.test.js

      - name: CSV/XML revision compare regression
        run: node tests/csv-rev-compare-xml-based.test.js

      - name: CSV/XML ambiguity review regression
        run: node tests/csv-rev-compare-review.test.js

      - name: Categorizer creation-mode regression
        run: node tests/table-categorized-creation-modes.test.js

      - name: Real R2 to R3 PS No. change benchmark
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:benchmarks/R2.zip > /tmp/R2.zip
          git show origin/main:benchmarks/R3.zip > /tmp/R3.zip
          python3 scripts/support-report-xlsx-zip-to-csv.py /tmp/R2.zip /tmp/R2.csv
          python3 scripts/support-report-xlsx-zip-to-csv.py /tmp/R3.zip /tmp/R3.csv
          node scripts/csv-rev-compare-phase1-real-benchmark.mjs /tmp/R2.csv /tmp/R3.csv /tmp/phase1-real-benchmark.json
