name: CSV Rev Compare R2 Deletion Qualification

on:
  pull_request:
    paths:
      - 'tabs/csv-rev-compare/**'
      - 'xml-compare/table-categorizer/**'
      - 'scripts/csv-rev-compare-r2-deletion-benchmark.mjs'
      - 'scripts/support-report-xlsx-zip-to-csv.py'
      - 'tests/csv-rev-compare-*.test.js'
      - '.github/workflows/csv-rev-compare-phase1-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  r2-deletion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: R2 deletion-state regression
        run: node tests/csv-rev-compare-deletion-state.test.js

      # The frozen-base csv-rev-compare-xml-based.test.js contains one exact
      # assertion for the superseded source-tombstone sentence. R2's focused
      # test and real benchmark assert the new Owner wording/output directly;
      # do not mutate the frozen historical regression to manufacture a pass.
      - name: CSV/XML ambiguity review regression
        run: node tests/csv-rev-compare-review.test.js

      - name: Phase 3 load regression
        run: node tests/csv-rev-compare-phase3-load-change.test.js

      - name: Phase 4 total-support regression
        run: node tests/csv-rev-compare-phase4-total-support-points.test.js

      - name: Real R2 to R3 deletion-state benchmark
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:benchmarks/R2.zip > /tmp/R2.zip
          git show origin/main:benchmarks/R3.zip > /tmp/R3.zip
          python3 scripts/support-report-xlsx-zip-to-csv.py /tmp/R2.zip /tmp/R2.csv
          python3 scripts/support-report-xlsx-zip-to-csv.py /tmp/R3.zip /tmp/R3.csv
          node scripts/csv-rev-compare-r2-deletion-benchmark.mjs /tmp/R2.csv /tmp/R3.csv
