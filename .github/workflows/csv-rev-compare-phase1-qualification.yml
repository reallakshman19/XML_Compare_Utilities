name: CSV Rev Compare Phase 1 Qualification

on:
  push:
    branches:
      - issue-1181-csv-rev-compare-xml
    paths:
      - 'tabs/csv-rev-compare/**'
      - 'xml-compare/table-categorizer/**'
      - 'tests/csv-rev-compare-*.test.js'
      - 'tests/table-categorized-creation-modes.test.js'
      - '.github/workflows/csv-rev-compare-phase1-qualification.yml'
  pull_request:
    paths:
      - 'tabs/csv-rev-compare/**'
      - 'xml-compare/table-categorizer/**'
      - 'tests/csv-rev-compare-*.test.js'
      - 'tests/table-categorized-creation-modes.test.js'
      - '.github/workflows/csv-rev-compare-phase1-qualification.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  phase1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Phase 1 PS No. change benchmark contract
        run: node tests/csv-rev-compare-phase1-ps-no-change.test.js

      - name: CSV/XML revision compare regression
        if: always()
        id: csv_regression
        shell: bash
        run: |
          set +e
          node tests/csv-rev-compare-xml-based.test.js > /tmp/csv-rev-regression.log 2>&1
          status=$?
          cat /tmp/csv-rev-regression.log
          if [ "$status" -ne 0 ]; then
            mkdir -p .ci-debug
            cp /tmp/csv-rev-regression.log .ci-debug/csv-rev-regression.log
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add .ci-debug/csv-rev-regression.log
            git commit -m "ci-debug: capture csv rev regression failure"
            git push
          fi
          exit "$status"

      - name: CSV/XML ambiguity review regression
        if: always()
        run: node tests/csv-rev-compare-review.test.js

      - name: Categorizer creation-mode regression
        if: always()
        run: node tests/table-categorized-creation-modes.test.js
