name: Run Workbench3D Imported InputXML Review Hardening

on:
  pull_request:
    paths:
      - '.github/workflows/workbench3d-imported-inputxml-review-hardening-trigger.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/workbench3d-imported-inputxml-review
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Execute owner-review hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/workbench3d-imported-inputxml-review-hardening.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply owner-review hardening\n'
          start = source.index(marker)
          run_start = source.index('        run: |\n', start) + len('        run: |\n')
          end = source.index('\n      - name: Run corrected WP4 qualification', run_start)
          block = source[run_start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          Path('/tmp/workbench3d-imported-review-harden.sh').write_text(script, encoding='utf-8')
          subprocess.run(['bash', '/tmp/workbench3d-imported-review-harden.sh'], check=True)
          Path('.github/workflows/workbench3d-imported-inputxml-review-hardening-trigger.yml').unlink()
          PY
      - name: Run corrected WP4 qualification
        run: |
          node --check workbench3d/ui/imported-inputxml-review.js
          node --check workbench3d/ui/workbench3d-tab.js
          node tests/workbench3d-imported-inputxml-review.test.js
          node tests/workbench3d-imported-inputxml-review-static.test.js
          npm run test:workbench3d
          npm run test:inputxml-workspace
          git diff --check
      - name: Commit qualified hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(workbench3d): require genuine CAESAR InputXML review source'
          git push origin HEAD:agent/workbench3d-imported-inputxml-review
