name: UXML B8 categorized source-bound editing coverage
on:
  pull_request:
    paths:
      - 'docs/uxml-edit-ops-step12.md'
      - 'tests/uxml-b7-controller.test.mjs'
      - 'uxml/**'
      - 'xml-compare/**'
      - 'utils/line-no-metadata.js'
      - 'docs/GREInputxml.xml'
      - 'docs/PLB314Inputxml.xml'
      - 'opt/mock-xml.xml'
      - 'converters/scripts/pdf_inputxml_profile_bm_cii.xml'
      - 'uxml/UxmlCategorizedPatchBack.js'
      - 'uxml/UxmlCategorizedProjectionMap.js'
      - 'docs/uxml/UxmlCategorizedPatchBack.js'
      - 'docs/uxml/UxmlCategorizedProjectionMap.js'
      - 'tabs/inputxml-workspace/inputxml-workspace-categorized-edit-controller.js'
      - 'tabs/inputxml-workspace/inputxml-workspace-tab.js'
      - 'tests/uxml-b8-*.test.mjs'
      - 'docs/uxml/B7-CATEGORIZED-EDIT-HOWTO.md'
      - 'docs/uxml/S4.2-PATCH-BACK.md'
      - '.github/workflows/uxml-b8-categorized-coverage.yml'
      - 'playwright.uxml-b8.config.mjs'
      - 'tests/browser/uxml-b8-categorized-coverage.spec.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b8-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: B8 original-red and final public source coverage
        run: node --test tests/uxml-b8-coverage.test.mjs tests/uxml-b8-extended.test.mjs
      - name: B8 R3 FAST four-public section editable baseline counts
        run: node --test tests/uxml-b8-r3-editable-counts.test.mjs
      - name: B8 R2 FAST physical section carry, inbound Line, graph and numeric controls
        run: node --test tests/uxml-b8-r2-carry.test.mjs
      - name: B8 independent UI field classification
        run: node --test tests/uxml-b8-ui-classification.test.mjs
      - name: B8 JavaScript syntax
        run: node --check uxml/UxmlCategorizedPatchBack.js && node --check uxml/UxmlCategorizedProjectionMap.js && node --check tabs/inputxml-workspace/inputxml-workspace-categorized-edit-controller.js && node --check tabs/inputxml-workspace/inputxml-workspace-tab.js
      - name: B8 original-red mutants LF
        run: node --test tests/uxml-b8-mutants.test.mjs
      - name: B8 original-red mutants simulated CRLF
        env:
          B8_MUTANT_COPY_CRLF: '1'
        run: node --test tests/uxml-b8-mutants.test.mjs
      - name: B7 controller
        run: node --test tests/uxml-b7-controller.test.mjs
      - name: S4.2 projection
        run: node --test tests/uxml-s4-2-projection.test.mjs
      - name: S4.2 original patcher
        run: node --test tests/uxml-s4-2-patch-back.test.mjs
      - name: Strict S3 and S4.1
        run: node --test tests/uxml-s3-harden-source-structure.test.mjs tests/uxml-s4-1-categorized-reader.test.mjs
      - name: Unchanged S4.0 source mapping audit
        run: node --test tests/s4-0-audit-*.test.mjs
      - name: B8 exhaustive four-public mapped-leaf Editable versus actual engine acceptance
        run: node --test tests/uxml-b8-editability-public.test.mjs

  b8-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install pinned browser test dependencies
        run: npm ci --ignore-scripts
      - name: Install real Chromium
        run: npx playwright install --with-deps chromium
      - name: B8 refused, checked, downloaded and global read-only browser states
        run: npx playwright test --config=playwright.uxml-b8.config.mjs
      - name: Retain public-sample screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uxml-b8-public-browser-evidence
          if-no-files-found: warn
          path: |
            artifacts/uxml-b8/
            test-results/uxml-b8/
