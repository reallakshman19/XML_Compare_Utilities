# Method C-only, read-only hosted qualification. New workflow; no existing shared CI edited.
name: Method C WP2-WP7 Original CII and protected safety
on:
  push:
    branches:
      - 'methodc/**'
    paths:
      - '.github/workflows/cii-method-c-wp2.yml'
      - 'tabs/cii-workspace/cii-workspace-method-c-*.js'
      - 'tests/cii-workspace-method-c-*.test.js'
      - 'Benchmark/*.CII'
      - 'docs/METHOD_C_ENGINEERING.md'
  pull_request:
    paths:
      - '.github/workflows/cii-method-c-wp2.yml'
      - 'tabs/cii-workspace/cii-workspace-method-c-*.js'
      - 'tests/cii-workspace-method-c-*.test.js'
      - 'Benchmark/*.CII'
      - 'docs/METHOD_C_ENGINEERING.md'

permissions:
  contents: read

concurrency:
  group: method-c-wp2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  physical-geometry:
    name: Original bytes + red controls (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the exact candidate SHA (not PR merge ref)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          echo "CANDIDATE_SHA=$expected"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check Method C modules and regression tests
        run: |
          set -euo pipefail
          node --check tabs/cii-workspace/cii-workspace-method-c-original-geometry.js
          node --check tabs/cii-workspace/cii-workspace-method-c-rigid-fit.js
          node --check tabs/cii-workspace/cii-workspace-method-c-registration.js
          node --check tests/cii-workspace-method-c-original-geometry.test.js
          node --check tests/cii-workspace-method-c-original-cii.test.js
          node --check tests/cii-workspace-method-c-rigid-fit.test.js
          node --check tests/cii-workspace-method-c-registration.test.js
          node --check tabs/cii-workspace/cii-workspace-method-c-candidates.js
          node --check tests/cii-workspace-method-c-candidates.test.js
          node --check tabs/cii-workspace/cii-workspace-method-c-svg.js
          node --check tabs/cii-workspace/cii-workspace-method-c-exports.js
          node --check tabs/cii-workspace/cii-workspace-method-c-ui.js
          node --check tabs/cii-workspace/cii-workspace-method-c-native-adapter.js
          node --check tabs/cii-workspace/cii-workspace-method-c-tile.js
          node --check tests/cii-workspace-method-c-native-adapter.test.js
          node --check tests/cii-workspace-method-c-svg.test.js
          node --check tests/cii-workspace-method-c-ui-browser.test.js
      - name: Run original S1/S2/S3/T tests and explicit corruption negatives
        run: |
          set -euo pipefail
          node --test \
            tests/cii-workspace-method-c-original-geometry.test.js \
            tests/cii-workspace-method-c-original-cii.test.js \
            tests/cii-workspace-method-c-rigid-fit.test.js \
            tests/cii-workspace-method-c-registration.test.js \
            tests/cii-workspace-method-c-candidates.test.js \
            tests/cii-workspace-method-c-svg.test.js \
            tests/cii-workspace-method-c-native-adapter.test.js


  interactive-svg-chromium:
    name: Served Method C module Chromium interactions (not native WP6)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          echo "CANDIDATE_SHA=$expected"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Navigate HTTP-served Method C module with real Chromium and native SHA-256
        run: node --test tests/cii-workspace-method-c-ui-browser.test.js
      - name: Preserve browser screenshot and downloaded numerical exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cii-method-c-wp5-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/cii-method-c-wp5/
          if-no-files-found: warn
          retention-days: 14


  protected-mainline-methodab-writer2:
    name: Existing Method A/B and Writer2 unchanged safety at candidate SHA
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Check candidate SHA and ownership, fail on any shared-file overlap
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          echo "CANDIDATE_SHA=$expected"
          base="3a7c34cd1b8f2f88b36e55503a96378406ea0c71"
          test "$(git cat-file -t "$base")" = commit
          echo "PROTECTED_BASE_SHA=$base"
          git diff --name-only "$base" HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Owned Method C isolation / no Writer2 promotion red controls
        run: |
          set -euo pipefail
          CII_METHOD_C_BASE=3a7c34cd1b8f2f88b36e55503a96378406ea0c71 \
            node --test tests/cii-workspace-method-c-firebreak.test.js
      - name: Run unmodified baseline A/B axis, 35-25-20-10-10 policy, and Writer2 scope regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 \
            tests/cii-workspace-geometry-authority.test.js \
            tests/cii-workspace-method-a-confidence-config.test.js \
            tests/cii-workspace-method-a-weight-policy.test.js \
            tests/cii-workspace-method-a-anchor-provenance.test.js \
            tests/cii-workspace-method-a-base-anchor-custody.test.js \
            tests/cii-workspace-base-anchor-method-fusion.test.js \
            tests/cii-workspace-multi-base-authority.test.js \
            tests/cii-workspace-multi-base-correspondence.test.js \
            tests/cii-workspace-topology-route-gates.test.js \
            tests/cii-workspace-writer2-composite-scope-custody.test.js \
            tests/cii-workspace-writer2-source-set-composite-custody.test.js \
            tests/cii-workspace-writer2-absent-family-readiness.test.js \
            tests/cii-workspace-writer2-product-routing.test.js \
            tests/cii-workspace-writer2-benchmark-identity-control.test.js

  protected-pr107-reference-policy:
    name: Pinned PR107 100-mm path & Method A/B reference (unmerged separate SHA)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 86a2d3b40568c2bcb43dacbe32c862144d00fd53
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm independent protected PR107 reference SHA (NOT Method C candidate)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "86a2d3b40568c2bcb43dacbe32c862144d00fd53"
          echo "REFERENCE_PR107_SHA=$(git rev-parse HEAD)"
          echo "This job tests PR107 in isolation, NOT a combined or integrated tree."
      - name: Verify existing physical path budget, W12/W14 original controls and Method A/B veto
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 \
            tests/cii-workspace-phase2-normalization-length.test.js \
            tests/cii-workspace-phase2-live-path-policy.test.js \
            tests/cii-workspace-phase2-midcycle-w12-original-path-review.test.js \
            tests/cii-workspace-phase2-midcycle-w14-methodab-registration-review.test.js \
            tests/cii-workspace-method-a-confidence-config.test.js \
            tests/cii-workspace-multi-base-correspondence.test.js \
            tests/cii-workspace-writer2-composite-scope-custody.test.js
