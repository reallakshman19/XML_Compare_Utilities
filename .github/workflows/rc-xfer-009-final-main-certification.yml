name: RC-XFER-009 Final Main Certification

on:
  pull_request:
    paths:
      - '.github/workflows/rc-xfer-009-final-main-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-xfer-009-final-main-certification
  cancel-in-progress: true

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Record exact environment
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          git rev-parse HEAD^1
          node --version
          npm --version
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Expose installed Chromium
        run: |
          chromium_path=$(node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          console.log(chromium.executablePath());
          NODE
          )
          test -x "$chromium_path"
          echo "CHROMIUM_PATH=$chromium_path" >> "$GITHUB_ENV"
          "$chromium_path" --version
      - name: Run exact Revision Compare qualification
        run: |
          set -o pipefail
          /usr/bin/time -v npm run test:revision-compare-qualification 2>&1 | tee rc-xfer-009-final-qualification.log
      - name: Record repository state
        if: always()
        run: |
          git status --short | tee rc-xfer-009-final-worktree.log
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-xfer-009-final-main-evidence
          if-no-files-found: warn
          retention-days: 30
          path: |
            rc-xfer-009-final-qualification.log
            rc-xfer-009-final-worktree.log
            playwright-report/
            test-results/
