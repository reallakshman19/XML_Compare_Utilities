name: CII Writer2 S1 D5.1 causal trace

on:
  push:
    branches:
      - validation/cii-writer2-s1-d5-1-1282
  workflow_dispatch:

jobs:
  d5-1-causal-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout diagnostic head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Guard exact D4 diagnostic basis
        shell: bash
        run: |
          set -euo pipefail
          D4=8103d860d3d284c32fdcc5d61419b873114bc3b3

          expected="$(printf '%s\n'             '.github/workflows/cii-writer2-s1-d5-1-1282.yml'             'tests/browser/cii-writer2-s1-d5-1-causal-trace.spec.mjs' | sort)"
          actual="$(git diff --name-only "$D4"...HEAD | sort)"
          test "$actual" = "$expected"

          test "$(git hash-object tests/browser/cii-writer2-s1-d5-1-causal-trace.spec.mjs)" = "a05bd228525cc8c0cc96f16c087172862f4e0631"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-multi-base-correspondence.js)" = "fbfa4b32fd2c4db9da0aa50f9b23bc1c54191a5d"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-anchor-physical-candidates.js)" = "ce3326a86f9e8fd88f26e583e27bf8147d0b39dd"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-source-target-audit.js)" = "8787fe0f09215ccd4e6bcc337f6d88a8f31d6d91"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-benchmark-overlay.js)" = "0bc83e1b747725a3c0e7e5cbd147aded421f10c4"

          if git diff --name-only "$D4"...HEAD -- tabs/cii-workspace | grep -q .; then
            echo "Production mutation forbidden in D5.1"
            exit 1
          fi
          if git diff --name-only "$D4"...HEAD -- Benchmark | grep -q .; then
            echo "Benchmark mutation forbidden in D5.1"
            exit 1
          fi

          echo "D5_1_DIAGNOSTIC_GUARD_PASS"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Create focused Playwright config
        shell: bash
        run: |
          cat > playwright.s1-d5-1.config.mjs <<'EOF'
          import base from './playwright.cii-writer2-retained.config.mjs';
          export default {
            ...base,
            testMatch: ['cii-writer2-s1-d5-1-causal-trace.spec.mjs'],
            timeout: 240_000,
            expect: { timeout: 20_000 },
            workers: 1,
            retries: 0,
            reporter: [['list']],
            outputDir: 'test-results/cii-writer2-s1-d5-1',
          };
          EOF

      - name: Run D5.1 causal trace
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.s1-d5-1.config.mjs 2>&1 | tee s1-d5-1.log

      - name: Upload D5.1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cii-writer2-s1-d5-1-causal-trace
          path: |
            s1-d5-1.log
            test-results/cii-writer2-s1-d5-1
          if-no-files-found: warn
