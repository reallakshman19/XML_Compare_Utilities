name: Profile static exact diagnostic

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/profile-static-exact-diagnostic.yml']

permissions:
  contents: read

env:
  TARGET_BRANCH: owner/fix-navis-benchmark-static-contract
  EXPECTED_TARGET_SHA: c31a58c28a33256e96f86baaa01ff78a1d510618

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Capture exact profile static output
        id: profile_static_exact
        continue-on-error: true
        run: |
          mkdir -p /tmp/profile-static-exact
          node tests/pipeline-3d-model-profile-propagation-static.test.js > /tmp/profile-static-exact/output.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-static-exact-output
          path: /tmp/profile-static-exact/output.log
          if-no-files-found: error
      - name: Require exact profile static pass
        if: steps.profile_static_exact.outcome != 'success'
        run: exit 1
