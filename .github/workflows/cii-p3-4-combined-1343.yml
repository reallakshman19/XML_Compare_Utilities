name: CII P3.4-C combined UI exact-head qualification

on:
  push:
    branches:
      - validation/cii-p3-4-combined-1343
  workflow_dispatch:

jobs:
  qualify-p3-4-c:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: C-U1 exact combined composition
        shell: bash
        run: |
          set -euo pipefail
          BASE=4c07c1da6bbbf90e318330c1550a4762e87281c5
          PRODUCT=62ab95b28cc6913d3ca525d5f427685157f8bc9f
          WORKFLOW=.github/workflows/cii-p3-4-combined-1343.yml

          test "$(git diff --name-only "$PRODUCT"...HEAD | sort)" = "$WORKFLOW"

          expected="$(printf '%s\n' \
            'agents/WIP-1341-writer2-ui-prepared-session_workreport.md' \
            'agents/WIP-1342-review-only-router-prepared-session_workreport.md' \
            'tabs/cii-workspace/cii-workspace-multisource-review-only-router.js' \
            'tabs/cii-workspace/cii-workspace-multisource-writer2-ui.js' \
            'tests/cii-workspace-review-only-router-prepared-session-wiring.test.js' \
            'tests/cii-workspace-writer2-ui-prepared-session-wiring.test.js' | sort)"
          test "$(git diff --name-only "$BASE" "$PRODUCT" | sort)" = "$expected"

          test "$(git rev-parse "$PRODUCT:tabs/cii-workspace/cii-workspace-multisource-writer2-ui.js")" = "d898258c1c2ff149e3025744fd741cdbf1d27480"
          test "$(git rev-parse "$PRODUCT:tabs/cii-workspace/cii-workspace-multisource-review-only-router.js")" = "c95d135e7e9bfbaf78d51cbb6979ae2d19d1400f"
          test "$(git rev-parse "$PRODUCT:tests/cii-workspace-writer2-ui-prepared-session-wiring.test.js")" = "a5a9f1ce9c5db6d4947aa9feeb9e0430031c9001"
          test "$(git rev-parse "$PRODUCT:tests/cii-workspace-review-only-router-prepared-session-wiring.test.js")" = "a536ac26faf4d196cb41203778e41274d6cd1f96"

          git diff --check "$BASE" "$PRODUCT"

          if git diff --name-only "$BASE" "$PRODUCT" -- \
            tabs/cii-workspace/cii-workspace-core.js \
            tabs/cii-workspace/cii-workspace-writer-version-bridge.js \
            tabs/cii-workspace/cii-workspace-source-set.js \
            tabs/cii-workspace/cii-workspace-multisource-preview.js \
            tabs/cii-workspace/cii-workspace-multisource-review-only.js \
            tabs/cii-workspace/cii-workspace-multisource-review-only-prepared.js \
            tabs/cii-workspace/cii-workspace-common-analysis-key.js \
            tabs/model-converters/xml-cii-inputxml-path-aligner.js \
            Benchmark | grep -q .; then
            echo "P3.4 protected/P3.3/Benchmark surface changed"
            exit 1
          fi

          echo "C_U1_EXACT_COMPOSITION_PASS"

      - name: Detach to frozen combined candidate
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=62ab95b28cc6913d3ca525d5f427685157f8bc9f
          git checkout --detach "$PRODUCT"
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          echo "QUALIFICATION_HEAD=$PRODUCT"

      - name: Install dependencies
        run: npm ci

      - name: C-U2 retained Writer2 prepared reuse
        shell: bash
        run: |
          set -euo pipefail
          node tests/cii-workspace-writer2-ui-prepared-session-wiring.test.js
          node tests/cii-workspace-prepared-source-set-session.test.js
          node tests/cii-workspace-prepared-writer2-preview.test.js
          node tests/cii-workspace-common-analysis-cache.test.js
          node tests/cii-workspace-common-analysis-projection.test.js

      - name: C-U3 generic review-only prepared reuse
        shell: bash
        run: |
          set -euo pipefail
          node tests/cii-workspace-review-only-router-prepared-session-wiring.test.js
          node tests/cii-workspace-multisource-review-only-router.test.js
          node tests/cii-workspace-prepared-review-only-adapter.test.js
          node tests/cii-workspace-prepared-review-only-thin-integration.test.js
          node tests/cii-workspace-multisource-review-only.test.js

      - name: C-U4 inherited semantic and session regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/cii-workspace-common-analysis-authority-key.test.js
          node tests/xml-cii-inputxml-path-aligner-purity.test.js
          node tests/cii-workspace-multisource-review-state.test.js
          node tests/cii-workspace-multisource-review-ledger-binding.test.js
          node tests/cii-workspace-multisource-session-persistence.test.js
          node tests/cii-workspace-multisource-retained-auto-anchor-benchmark.test.js

      - name: C-U4 final exact-head assertion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "62ab95b28cc6913d3ca525d5f427685157f8bc9f"
          git diff --quiet
          echo "P3_4_C_COMBINED_EXACT_HEAD_QUALIFICATION_PASS"
