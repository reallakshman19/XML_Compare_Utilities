name: CII U4.3 Method-A base-anchor custody qualification

on:
  push:
    branches:
      - validation/cii-method-a-base-anchor-custody-1294
  workflow_dispatch:

jobs:
  u4-3-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Guard exact U4.3 product
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_BASE=02e17c61f238dbdfa1a9d1bb5707ec0f235a330b
          PRODUCT_HEAD=4c96220447315d538dd85b3a4db5a9cce6eeac77

          actual_validation="$(git diff --name-only "$PRODUCT_HEAD"...HEAD | sort)"
          test "$actual_validation" = ".github/workflows/cii-method-a-base-anchor-custody-1294.yml"

          expected_product="$(printf '%s\n' \
            'agents/WIP-1294-base-anchor-custody_workreport.md' \
            'tabs/cii-workspace/cii-workspace-node-custody.js' \
            'tests/cii-workspace-method-a-base-anchor-custody.test.js' | sort)"
          actual_product="$(git diff --name-only "$PRODUCT_BASE" "$PRODUCT_HEAD" | sort)"
          test "$actual_product" = "$expected_product"

          test "$(git rev-parse "$PRODUCT_HEAD:tabs/cii-workspace/cii-workspace-node-custody.js")" = "221ae3dd5ea6f1e98afaf763646885db91e51ff2"
          test "$(git rev-parse "$PRODUCT_HEAD:tests/cii-workspace-method-a-base-anchor-custody.test.js")" = "a01f9e216dd3c21cbd95baf60d763b2d6746d28a"
          test "$(git rev-parse "$PRODUCT_HEAD:agents/WIP-1294-base-anchor-custody_workreport.md")" = "177099e6b35b34cca1206d678493f5bd9053eb58"

          test "$(git rev-parse "$PRODUCT_HEAD:tabs/cii-workspace/cii-workspace-alignment.js")" = "cfdbd033c2852627908874e2542de0e0c33f3014"
          test "$(git rev-parse "$PRODUCT_HEAD:tabs/cii-workspace/cii-workspace-multi-base-correspondence.js")" = "00b8fc6054b14afd8b6b299d477c940843cb2b85"
          test "$(git rev-parse "$PRODUCT_HEAD:tabs/cii-workspace/cii-workspace-correspondence-arbitration.js")" = "ff26a1921dc527a7d7cef2e9a94c56b92651484f"
          test "$(git rev-parse "$PRODUCT_HEAD:tests/cii-workspace-method-a-boundary-node-custody.test.js")" = "030156fd8ee0fda90413a202d6c8f1cc2693ca33"
          test "$(git rev-parse "$PRODUCT_HEAD:tests/cii-workspace-method-a-boundary-local-projection.test.js")" = "aaef0c3ed47f804d3b1917f24fcc527d3e4614eb"
          test "$(git rev-parse "$PRODUCT_HEAD:tests/cii-workspace-boundary-local-endpoint.test.js")" = "e829342e2bd3a1a4ea4a9bf64ef7049e488760cb"

          if git diff --name-only "$PRODUCT_BASE" "$PRODUCT_HEAD" -- Benchmark | grep -q .; then
            echo "Benchmark mutation forbidden"
            exit 1
          fi

          for protected in \
            tabs/cii-workspace/cii-workspace-alignment.js \
            tabs/cii-workspace/cii-workspace-multi-base-correspondence.js \
            tabs/cii-workspace/cii-workspace-correspondence-arbitration.js \
            tabs/cii-workspace/cii-workspace-candidates.js \
            tabs/cii-workspace/cii-workspace-geometry.js \
            tabs/cii-workspace/cii-workspace-anchor-physical-candidates.js \
            tabs/cii-workspace/cii-workspace-writer-version-bridge.js; do
            if git diff --name-only "$PRODUCT_BASE" "$PRODUCT_HEAD" -- "$protected" | grep -q .; then
              echo "Protected product surface changed: $protected"
              exit 1
            fi
          done

          echo "U4_3_EXACT_PRODUCT_GUARD_PASS"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check U4.3 product
        run: |
          node --check tabs/cii-workspace/cii-workspace-node-custody.js
          node --check tests/cii-workspace-method-a-base-anchor-custody.test.js

      - name: Run U4.3 focused custody parity contract
        run: node tests/cii-workspace-method-a-base-anchor-custody.test.js

      - name: Run inherited D5.3 adjacent-boundary custody regression
        run: node tests/cii-workspace-method-a-boundary-node-custody.test.js

      - name: Run inherited U4.2 projection regression
        run: node tests/cii-workspace-method-a-boundary-local-projection.test.js

      - name: Run inherited U4.1 alignment regression
        run: node tests/cii-workspace-boundary-local-endpoint.test.js
