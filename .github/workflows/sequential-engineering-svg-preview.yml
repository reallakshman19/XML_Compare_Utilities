name: Sequential Engineering SVG Preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'tabs/sequential-sketcher/sequential-engineering-svg-preview-*.js'
      - 'tabs/sequential-sketcher/sequential-engineering-svg-parity-validation.js'
      - 'tabs/sequential-sketcher/sequential-engineering-svg-shadow-workspace.js'
      - 'tests/sequential-engineering-svg-shadow-dependency-guard.test.js'
      - 'tabs/sequential-sketcher/sequential-sketcher-tab.js'
      - 'tabs/sequential-sketcher/sequential-sketcher-markup.js'
      - 'tests/sequential-engineering-svg-preview-*.test.js'
      - 'tests/browser/sequential-engineering-svg-preview-*'
      - 'playwright.sequential-engineering-svg-preview.config.mjs'
      - '.github/workflows/sequential-engineering-svg-preview.yml'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  exact-head-preview-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with: { ref: '${{ github.event.pull_request.head.sha || github.sha }}', fetch-depth: 1 }
      - name: Verify exact head and allowlist
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"; test "$actual" = "$EXPECTED_SHA"
          mkdir -p artifacts/sequential-engineering-svg-preview
          printf '{"schema":"SequentialEngineeringSvgPreviewExactHead.v1","expected":"%s","actual":"%s","match":true}\n' "$EXPECTED_SHA" "$actual" > artifacts/sequential-engineering-svg-preview/exact-head.json
          git fetch --no-tags --depth=1 origin main
          base="${BASE_SHA:-$(git merge-base HEAD origin/main)}"
          git diff --name-only "$base" "$EXPECTED_SHA" | sort > artifacts/sequential-engineering-svg-preview/changed-files.txt
          while IFS= read -r path; do
            case "$path" in
              tabs/sequential-sketcher/sequential-engineering-svg-preview-policy.js|tabs/sequential-sketcher/sequential-engineering-svg-preview-workspace.js|tabs/sequential-sketcher/sequential-engineering-svg-preview-controller.js|tabs/sequential-sketcher/sequential-engineering-svg-parity-validation.js|tabs/sequential-sketcher/sequential-engineering-svg-shadow-workspace.js|tabs/sequential-sketcher/sequential-sketcher-tab.js|tabs/sequential-sketcher/sequential-sketcher-markup.js|tests/sequential-engineering-svg-shadow-dependency-guard.test.js|tests/sequential-engineering-svg-preview-policy.test.js|tests/sequential-engineering-svg-preview-workspace.test.js|tests/sequential-engineering-svg-preview-controller.test.js|tests/sequential-engineering-svg-preview-static.test.js|tests/sequential-engineering-svg-preview-parity.test.js|tests/browser/sequential-engineering-svg-preview-fixture.html|tests/browser/sequential-engineering-svg-preview.spec.mjs|playwright.sequential-engineering-svg-preview.config.mjs|.github/workflows/sequential-engineering-svg-preview.yml) ;;
              *) echo "Forbidden SSK-ESVG-003C path: $path"; exit 1 ;;
            esac
          done < artifacts/sequential-engineering-svg-preview/changed-files.txt
          ! grep -Eq '^(core/|workbench3d/|tabs/revision-compare/|tabs/pipeline-3d-model/|package-lock.json$|package.json$)' artifacts/sequential-engineering-svg-preview/changed-files.txt
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Preview policy contract
        run: node tests/sequential-engineering-svg-preview-policy.test.js
      - name: Preview workspace contract
        run: node tests/sequential-engineering-svg-preview-workspace.test.js
      - name: Preview controller contract
        run: node tests/sequential-engineering-svg-preview-controller.test.js
      - name: Preview static boundaries
        run: node tests/sequential-engineering-svg-preview-static.test.js
      - name: Preview parity contract
        run: node tests/sequential-engineering-svg-preview-parity.test.js
      - name: Accepted owner adapter shadow and parity gates
        run: |
          node tests/sequential-engineering-svg-owner-bridge.test.js
          node tests/sequential-engineering-svg-index-projection.test.js
          node tests/sequential-engineering-svg-owner-bridge-static.test.js
          node tests/sequential-engineering-svg-adapter.test.js
          node tests/sequential-engineering-svg-parity.test.js
          for test_file in tests/sequential-engineering-svg-shadow-*.test.js; do node "$test_file"; done
      - name: Sequential UI construction transaction support and review gates
        run: |
          node tests/sequential-sketcher-ui-static.test.js
          node tests/sequential-sketcher-branch-switch-ui.test.js
          node tests/sequential-construction-engine.test.js
          node tests/sequential-supervised-transactions.test.js
          node tests/sequential-construction-acceptance.test.js
          node tests/sequential-confirmed-support-projection.test.js
          node tests/sequential-sketcher-support-projection.test.js
          node tests/sequential-sketcher-support-integration.test.js
          node tests/sequential-review-queue-ui.test.js
      - name: Syntax startup and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          for file in tabs/sequential-sketcher/sequential-engineering-svg-preview-*.js tabs/sequential-sketcher/sequential-engineering-svg-parity-validation.js tabs/sequential-sketcher/sequential-engineering-svg-shadow-workspace.js tabs/sequential-sketcher/sequential-sketcher-tab.js tabs/sequential-sketcher/sequential-sketcher-markup.js tests/sequential-engineering-svg-preview-*.test.js tests/sequential-engineering-svg-shadow-dependency-guard.test.js tests/browser/sequential-engineering-svg-preview.spec.mjs playwright.sequential-engineering-svg-preview.config.mjs; do node --check "$file"; done
          node tests/startup-module-syntax.test.js
          git diff --check "${BASE_SHA}" "$EXPECTED_SHA"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: SSK-ESVG-003C-B01
        run: npx playwright test --config=playwright.sequential-engineering-svg-preview.config.mjs --grep 'SSK-ESVG-003C-B01'
      - name: SSK-ESVG-003C-B02
        run: npx playwright test --config=playwright.sequential-engineering-svg-preview.config.mjs --grep 'SSK-ESVG-003C-B02'
      - name: SSK-ESVG-003C-B03
        run: npx playwright test --config=playwright.sequential-engineering-svg-preview.config.mjs --grep 'SSK-ESVG-003C-B03'
      - name: SSK-ESVG-003C-B04
        run: npx playwright test --config=playwright.sequential-engineering-svg-preview.config.mjs --grep 'SSK-ESVG-003C-B04'
      - name: SSK-ESVG-003C-B05
        run: npx playwright test --config=playwright.sequential-engineering-svg-preview.config.mjs --grep 'SSK-ESVG-003C-B05'
      - name: SSK-ESVG-003C-B06
        run: npx playwright test --config=playwright.sequential-engineering-svg-preview.config.mjs --grep 'SSK-ESVG-003C-B06'
      - name: SSK-ESVG-003C-B07
        run: npx playwright test --config=playwright.sequential-engineering-svg-preview.config.mjs --grep 'SSK-ESVG-003C-B07'
      - name: SSK-ESVG-003C-B08
        run: npx playwright test --config=playwright.sequential-engineering-svg-preview.config.mjs --grep 'SSK-ESVG-003C-B08'
      - name: SSK-ESVG-003C-B09
        run: npx playwright test --config=playwright.sequential-engineering-svg-preview.config.mjs --grep 'SSK-ESVG-003C-B09'
      - name: SSK-ESVG-003C-B10
        run: npx playwright test --config=playwright.sequential-engineering-svg-preview.config.mjs --grep 'SSK-ESVG-003C-B10'
      - name: Complete Sequential preview Chromium suite
        run: npx playwright test --config=playwright.sequential-engineering-svg-preview.config.mjs
      - name: Full repository tests
        run: npm test
      - name: Upload exact-head preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequential-engineering-svg-preview-${{ env.EXPECTED_SHA }}
          path: |
            artifacts/sequential-engineering-svg-preview
            test-results/sequential-engineering-svg-preview
            sequential-engineering-svg-preview-results.json
          if-no-files-found: error
          retention-days: 90
