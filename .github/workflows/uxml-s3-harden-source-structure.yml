name: UXML S3 harden original source structure

on:
  pull_request:
    paths:
      - 'uxml/**'
      - 'xml-compare/**'
      - 'utils/**'
      - 'docs/**'
      - 'opt/**'
      - 'converters/**'
      - 'tools/**'
      - 'tests/**'
      - 'uxml/UxmlInputXmlSchemaMapper.js'
      - 'uxml/UxmlInputXmlSourceStructure.js'
      - 'uxml/UxmlCategorizedInputXmlSchemaMapper.js'
      - 'docs/uxml/UxmlInputXmlSourceStructure.js'
      - 'docs/uxml/UxmlCategorizedInputXmlSchemaMapper.js'
      - 'tests/uxml-s3-*.test.mjs'
      - 'tests/uxml-s4-1-*.test.mjs'
      - 'docs/uxml/S3-HARDEN-SOURCE-STRUCTURE.md'
      - 'docs/uxml/CODER-CHECKPOINT-S3-HARDEN.md'
      - '.github/workflows/uxml-s3-harden-source-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s3-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: S3 source structure refusals and pinned-main byte-identity proof
        run: node --test tests/uxml-s3-harden-source-structure.test.mjs
      - name: S3 structural mutants LF
        run: node --test tests/uxml-s3-harden-mutants.test.mjs
      - name: S3 structural mutants Windows autocrlf simulation
        env:
          S3_MUTANT_COPY_CRLF: '1'
        run: node --test tests/uxml-s3-harden-mutants.test.mjs
      - name: S3 exact source regressions and existing source mutations
        run: node --test tests/uxml-s3-caesar-inputxml.test.mjs tests/uxml-s3-reconcile.test.mjs tests/uxml-s3-caesar-mutants.test.mjs
      - name: S4.1 categorized regression
        run: node --test tests/uxml-s4-1-categorized-reader.test.mjs
      - name: S4.1 isolated mutation kills LF
        run: node --test tests/uxml-s4-1-mutants.test.mjs
      - name: S4.1 isolated mutation kills Windows autocrlf simulation
        env:
          S4_MUTANT_COPY_CRLF: '1'
        run: node --test tests/uxml-s4-1-mutants.test.mjs
      - name: S4.0 converter audit
        run: node --test tests/s4-0-audit-*.test.mjs
      - name: S1 PSI116 reader and follow-up mutants
        run: node --test tests/uxml-psi116-s1.test.mjs tests/uxml-s1-followup-mutants.test.mjs
      - name: Topology admission
        run: node --test tests/inputxml-workspace-topo-admission.test.mjs
      - name: ACCDB sideload
        run: node tests/inputxml-workspace-accdb-sideload.test.js
      - name: Enrichment preview
        run: node tests/xml-compare-enrichment-apply-preview.test.js
