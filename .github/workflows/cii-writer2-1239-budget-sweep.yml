name: CII Writer2 #1239 Method-A Budget Sweep

on:
  push:
    branches:
      - validation/cii-writer2-1239-pr1234-budget-sweep

permissions:
  contents: read

concurrency:
  group: cii-writer2-1239-budget-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Retained Method-A physical candidate budget sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sweep validation tree
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove validation-only sweep boundary
        shell: bash
        run: |
          set -euo pipefail
          OVERLAY_SHA=86415c1b0efae6fb4bde8eedcb21e97984b87fa6
          test "$(git merge-base "$OVERLAY_SHA" HEAD)" = "$OVERLAY_SHA"
          mapfile -t unexpected < <(git diff --name-only "$OVERLAY_SHA" HEAD | grep -Ev '^(\.github/validation/cii-writer2-1239-search-budget-sweep\.mjs|\.github/workflows/cii-writer2-1239-budget-sweep\.yml|\.github/validation/cii-writer2-1239-budget-sweep-trigger\.txt)$' || true)
          if [ "${#unexpected[@]}" -ne 0 ]; then
            printf 'UNEXPECTED_SWEEP_DRIFT\n%s\n' "${unexpected[@]}"
            exit 1
          fi

      - name: Run retained candidate-budget sweep
        shell: bash
        run: |
          set -o pipefail
          node .github/validation/cii-writer2-1239-search-budget-sweep.mjs 2>&1 | tee search-budget-sweep.log

      - name: Upload sweep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cii-writer2-1239-budget-sweep
          path: search-budget-sweep.log
          if-no-files-found: error
