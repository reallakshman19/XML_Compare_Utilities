name: Repository baseline finalize v3

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/repository-baseline-finalize-v3.yml']

permissions:
  contents: write

env:
  TARGET_BRANCH: owner/fix-navis-benchmark-static-contract
  EXPECTED_TARGET_SHA: 2401a75d78045583c394ba4551de8dbba1125a18

jobs:
  certify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
      - name: Align Navis benchmark static contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/navis-tag-isonote-static.test.js')
          text = path.read_text()
          old_read = "const benchmarkWorkflow = readFileSync('.github/workflows/navis-tag-isonote-full-benchmark.yml', 'utf8');"
          new_read = "const benchmarkExpected = JSON.parse(readFileSync('fixtures/navis-tag-isonote/asim1836-benchmark-expected.json', 'utf8'));"
          old_assert = "assert.match(benchmarkWorkflow, /asim1836-benchmark-expected\\.json/);\nassert.match(benchmarkWorkflow, /Frozen benchmark verified/);"
          new_assert = "assert.match(benchmarkRunner, /const expectedPath = options\\.expected \\|\\| '';/);\nassert.match(benchmarkRunner, /coverage\\.expectations = verifyExpectations/);\nassert.equal(benchmarkExpected.schema, 'navis-tag-isonote-benchmark-expectations/v1');\nassert.equal(benchmarkExpected.profileId, 'asim1836-managed-stage-2/v1');\nassert.equal(benchmarkExpected.sourceCounts.tableRows, 163);\nassert.equal(benchmarkExpected.identityTrace.resolvedCount, 163);\nassert.equal(benchmarkExpected.coordinateFrame.status, 'DISJOINT_COORDINATE_EXTENTS');\nassert.equal(benchmarkExpected.resolution.unresolvedCount, 163);"
          if text.count(old_read) != 1 or text.count(old_assert) != 1:
              raise SystemExit(f'Navis source blocks not found: read={text.count(old_read)}, assertions={text.count(old_assert)}')
          path.write_text(text.replace(old_read, new_read, 1).replace(old_assert, new_assert, 1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Focused repaired contracts
        run: |
          node tests/navis-tag-isonote-static.test.js
          node tests/pipeline-3d-model-cad-browser-contract.test.js
          node tests/xml-builder-viewport-browser-contract.test.js
          node tests/pipeline-3d-model-hard-051-no-fallback-static.test.js
          node tests/pipeline-3d-model-hard-051-ui-static.test.js
          node tests/pipeline-3d-model-profile-propagation.test.js
          node tests/pipeline-3d-model-profile-propagation-static.test.js
      - name: Repository-wide validation
        run: |
          set -o pipefail
          mkdir -p /tmp/npm-test
          npm test 2>&1 | tee /tmp/npm-test/npm-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-baseline-final-v3-npm-test
          path: /tmp/npm-test/npm-test.log
          if-no-files-found: error
      - name: Enforce repair scope
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = 'tests/navis-tag-isonote-static.test.js'
          git diff --name-only origin/main...HEAD | sort > /tmp/branch-files
          printf '%s\n' \
            tests/navis-tag-isonote-static.test.js \
            tests/pipeline-3d-model-cad-browser-contract.test.js \
            tests/xml-builder-viewport-browser-contract.test.js \
            tests/pipeline-3d-model-hard-051-no-fallback-static.test.js \
            tests/pipeline-3d-model-hard-051-ui-static.test.js \
            tests/pipeline-3d-model-profile-propagation.test.js \
            tests/pipeline-3d-model-profile-propagation-static.test.js | sort > /tmp/expected
          diff -u /tmp/expected /tmp/branch-files
      - name: Commit and push final repair
        run: |
          git config user.name 'Repository Baseline Owner'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/navis-tag-isonote-static.test.js
          git commit -m 'test: align Navis benchmark static contract'
          git push origin HEAD:${TARGET_BRANCH}
