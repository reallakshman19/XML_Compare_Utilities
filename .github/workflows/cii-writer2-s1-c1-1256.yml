name: CII Writer2 S1 C1 diagnostic

on:
  push:
    branches:
      - validation/cii-writer2-s1-c1-1256
  workflow_dispatch:

jobs:
  s1-c1-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validation head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Guard validation-only delta
        shell: bash
        run: |
          set -euo pipefail
          BASE=b2ff4c67fe6b1ad1e9d4a0be182d6aa3dc53ac08
          allowed=$(cat <<'EOF'
          .github/workflows/cii-writer2-s1-c1-1256.yml
          tabs/cii-workspace/cii-workspace-anchor-physical-candidates.js
          tabs/cii-workspace/cii-workspace-anchor-suggestions-core.js
          tabs/cii-workspace/cii-workspace-anchor-suggestions.js
          tabs/cii-workspace/cii-workspace-multisource-review-only-filter-shell.js
          tabs/cii-workspace/cii-workspace-source-set.js
          tests/cii-workspace-s1-auto-anchor-c1-diagnostic.mjs
          EOF
          )
          changed="$(git diff --name-only "$BASE"...HEAD | sort)"
          printf '%s\n' "$changed"
          unexpected="$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$allowed" | sed 's/^          //' | sort) || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected validation drift:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          test "$(git hash-object tabs/cii-workspace/cii-workspace-anchor-physical-candidates.js)" = "18e04998fdf48368f56ff5bf975671075d90cd84"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-anchor-suggestions-core.js)" = "1037163d7ace8f91cc889108c044d1d2e9884d58"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-anchor-suggestions.js)" = "48ac451a7084873a8f48b6a48237627ba0a4786c"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-multisource-review-only-filter-shell.js)" = "ebe18d2dc2ffe3ac8dd60b8e330aca25cfb01c28"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-source-set.js)" = "f4d36814c34a20b194389eebe7ed7ec52e42ba3b"

          if git diff --name-only "$BASE"...HEAD -- Benchmark | grep -q .; then
            echo "Benchmark mutation forbidden"
            exit 1
          fi
          echo "S1_C1_VALIDATION_GUARD_PASS"
          echo "VALIDATION_HEAD=$(git rev-parse HEAD)"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check diagnostic
        run: node --check tests/cii-workspace-s1-auto-anchor-c1-diagnostic.mjs

      - name: Run retained S1 candidate funnel matrix
        shell: bash
        run: |
          set -euo pipefail
          node tests/cii-workspace-s1-auto-anchor-c1-diagnostic.mjs 2>&1 | tee s1-c1-diagnostic.log

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cii-writer2-s1-c1-diagnostic
          path: s1-c1-diagnostic.log
          if-no-files-found: warn
