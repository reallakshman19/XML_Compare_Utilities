name: Sequential Engineering SVG Shadow Workspace
# Post-merge certification repair: rerun B01-B05 after the B03 contract assertion correction.

on:
  pull_request:
    branches: [main]
    paths:
      - 'tabs/sequential-sketcher/sequential-engineering-svg-shadow-workspace.js'
      - 'tests/sequential-engineering-svg-shadow-*.test.js'
      - 'tests/browser/sequential-engineering-svg-shadow-*'
      - 'playwright.sequential-engineering-svg-shadow.config.mjs'
      - '.github/workflows/sequential-engineering-svg-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  shadow-contracts-regressions-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
      - name: Verify exact source head
        id: exact_head
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          sha_match=false
          if [[ "$actual_sha" == "$EXPECTED_SHA" ]]; then
            sha_match=true
          fi
          {
            echo "actual_sha=$actual_sha"
            echo "sha_match=$sha_match"
          } >> "$GITHUB_OUTPUT"
          mkdir -p test-results/sequential-engineering-svg-shadow
          cat > test-results/sequential-engineering-svg-shadow/exact-head.json <<EOF
          {
            "schema": "SequentialEngineeringSvgShadowExactHead.v1",
            "expectedSha": "${EXPECTED_SHA}",
            "actualSha": "${actual_sha}",
            "match": ${sha_match}
          }
          EOF
          {
            echo "## Exact source head"
            echo "- Expected: \`${EXPECTED_SHA}\`"
            echo "- Actual: \`${actual_sha}\`"
            echo "- Match: \`${sha_match}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$sha_match" != "true" ]]; then
            echo "::error::Checked-out HEAD ${actual_sha} does not match expected source SHA ${EXPECTED_SHA}."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Engineering Scene contracts
        run: |
          node tests/engineering-scene-contracts.test.js
          node tests/engineering-scene-validation.test.js
      - name: Engineering SVG adapter conformance
        run: |
          node tests/engineering-svg-adapter-conformance.test.js
          node tests/engineering-svg-adapter-dependency-guard.test.js
      - name: Engineering SVG read-only shell guards
        run: |
          node tests/engineering-svg-shell-dependency-guard.test.js
          node tests/engineering-svg-readonly-shell-dependency-guard.test.js
      - name: Merged Sequential adapter authority and parity
        run: |
          node tests/sequential-engineering-svg-authority.test.js
          node tests/sequential-engineering-svg-adapter.test.js
          node tests/sequential-engineering-svg-parity.test.js
          node tests/sequential-engineering-svg-dependency-guard.test.js
      - name: Sequential construction regressions
        run: |
          node tests/sequential-construction-engine.test.js
          node tests/sequential-attachment-event.test.js
          node tests/sequential-zero-length-inline.test.js
          node tests/sequential-head-boundary-gate.test.js
          node tests/sequential-construction-acceptance.test.js
          node tests/sequential-supervised-transactions.test.js
      - name: Sequential continuity repair and support regressions
        run: |
          node tests/sequential-continuity-geometry.test.js
          node tests/sequential-construction-tolerance-policy.test.js
          node tests/sequential-confirmed-support-projection.test.js
          node tests/support-carrier-attachment-geometry.test.js
      - name: Shadow ownership parity and dependency guards
        run: |
          node tests/sequential-engineering-svg-shadow-ownership.test.js
          node tests/sequential-engineering-svg-shadow-parity.test.js
          node tests/sequential-engineering-svg-shadow-dependency-guard.test.js
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check tabs/sequential-sketcher/sequential-engineering-svg-shadow-workspace.js
          node --check tests/sequential-engineering-svg-shadow-ownership.test.js
          node --check tests/sequential-engineering-svg-shadow-parity.test.js
          node --check tests/sequential-engineering-svg-shadow-dependency-guard.test.js
          node --check tests/browser/sequential-engineering-svg-shadow.spec.mjs
          node --check playwright.sequential-engineering-svg-shadow.config.mjs
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find core tabs -type f -name '*.js' -print0 | sort -z)
          node --check main-rhbg-fitguard.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: SSK-ESVG-SHADOW-B01 blocked state
        id: b01
        run: npx playwright test --config=playwright.sequential-engineering-svg-shadow.config.mjs --grep 'SSK-ESVG-SHADOW-B01'
      - name: SSK-ESVG-SHADOW-B02 repair and rejection
        id: b02
        run: npx playwright test --config=playwright.sequential-engineering-svg-shadow.config.mjs --grep 'SSK-ESVG-SHADOW-B02'
      - name: SSK-ESVG-SHADOW-B03 support ownership
        id: b03
        run: npx playwright test --config=playwright.sequential-engineering-svg-shadow.config.mjs --grep 'SSK-ESVG-SHADOW-B03'
      - name: SSK-ESVG-SHADOW-B04 projection and immutability
        id: b04
        run: npx playwright test --config=playwright.sequential-engineering-svg-shadow.config.mjs --grep 'SSK-ESVG-SHADOW-B04'
      - name: SSK-ESVG-SHADOW-B05 failure and lifecycle
        id: b05
        run: npx playwright test --config=playwright.sequential-engineering-svg-shadow.config.mjs --grep 'SSK-ESVG-SHADOW-B05'
      - name: Startup smoke
        id: startup_smoke
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/xml-compare-startup-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node tests/browser/xml-compare-startup-smoke.mjs
      - name: Full repository tests
        id: full_tests
        run: npm test
      - name: Write exact-head certification evidence
        if: always()
        shell: bash
        env:
          ACTUAL_SHA: ${{ steps.exact_head.outputs.actual_sha }}
          SHA_MATCH: ${{ steps.exact_head.outputs.sha_match }}
          B01_RESULT: ${{ steps.b01.outcome }}
          B02_RESULT: ${{ steps.b02.outcome }}
          B03_RESULT: ${{ steps.b03.outcome }}
          B04_RESULT: ${{ steps.b04.outcome }}
          B05_RESULT: ${{ steps.b05.outcome }}
          STARTUP_RESULT: ${{ steps.startup_smoke.outcome }}
          FULL_TEST_RESULT: ${{ steps.full_tests.outcome }}
        run: |
          set -euo pipefail
          mkdir -p test-results/sequential-engineering-svg-shadow
          cat > test-results/sequential-engineering-svg-shadow/certification.json <<EOF
          {
            "schema": "SequentialEngineeringSvgShadowCertification.v1",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "expectedSha": "${EXPECTED_SHA}",
            "actualSha": "${ACTUAL_SHA}",
            "shaMatch": ${SHA_MATCH:-false},
            "results": {
              "B01": "${B01_RESULT}",
              "B02": "${B02_RESULT}",
              "B03": "${B03_RESULT}",
              "B04": "${B04_RESULT}",
              "B05": "${B05_RESULT}",
              "startupSmoke": "${STARTUP_RESULT}",
              "fullRepositoryTests": "${FULL_TEST_RESULT}"
            }
          }
          EOF
      - name: Upload exact-head certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequential-engineering-svg-shadow-certification-${{ env.EXPECTED_SHA }}
          path: |
            test-results/sequential-engineering-svg-shadow/exact-head.json
            test-results/sequential-engineering-svg-shadow/certification.json
          if-no-files-found: error
      - name: Upload exact-head browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sequential-engineering-svg-shadow-failure-${{ env.EXPECTED_SHA }}
          path: test-results/sequential-engineering-svg-shadow
          if-no-files-found: warn
