name: I121 Detailed Original Writer2 CPU Stage Diagnostic
on:
  push:
    branches:
      - i121/perf-stage-diagnostic-20261018
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-stage-profile:
    name: Real S1 T graph versus anchor versus Method A profile
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify diagnostic JavaScript
        run: node --check tests/cii-workspace-writer2-method-c-perf-detailed.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Diagnose real original S1 S2 S3 T CPU stage in served docs
        env:
          I121_PROFILE_TIMEOUT_MS: '90000'
        run: node tests/cii-workspace-writer2-method-c-perf-detailed.mjs
      - name: Retain original-file detailed stage evidence even when red
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i121-original-writer2-detailed-stage-profile
          path: test-results/i121-original-profile/
          if-no-files-found: warn
          retention-days: 14
