name: CII A2-17 Public GitHub Pages Live Chromium Smoke
on:
  push:
    branches:
      - test/cii-a2-17-public-pages-smoke-69-20261015
  pull_request:
    paths:
      - 'tests/browser/cii-writer2-a2-17-public-pages.spec.mjs'
      - 'playwright.cii-a2-17-public-pages.config.mjs'
      - '.github/workflows/cii-a2-17-public-pages-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-hosted-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked Playwright dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify released Github Pages and actual original-file Geometry UI
        run: npx playwright test --config=playwright.cii-a2-17-public-pages.config.mjs
      - name: Preserve real-host browser screenshot / release receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cii-a2-17-actual-pages-live-smoke
          path: |
            test-results/cii-a2-17-public-pages
            test-results/cii-a2-17-public-pages.json
            test-results/cii-a2-17-public-pages-traces
          retention-days: 14
          if-no-files-found: warn
