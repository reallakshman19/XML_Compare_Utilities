name: I121 WP2 Prepared Worker Hostile Response Contracts
on:
  push:
    branches: [i121/worker-adoption-wp2-20261018]
permissions:
  contents: read
jobs:
  prepared-contract:
    name: Prepared custody and stale abort errors Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Source and deployed session protocol byte parity
        run: |
          node --check tests/cii-workspace-i121-wp2-prepared-contract.test.mjs
          cmp tabs/cii-workspace/cii-workspace-prepared-inspection-client.js docs/tabs/cii-workspace/cii-workspace-prepared-inspection-client.js
          cmp tabs/cii-workspace/cii-workspace-prepared-inspection-protocol.js docs/tabs/cii-workspace/cii-workspace-prepared-inspection-protocol.js
          cmp tabs/cii-workspace/cii-workspace-prepared-inspection.worker.js docs/tabs/cii-workspace/cii-workspace-prepared-inspection.worker.js
      - name: Run adversarial prepared-session tests
        run: node --test tests/cii-workspace-i121-wp2-prepared-contract.test.mjs
