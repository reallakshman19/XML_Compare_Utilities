name: NTI-003 Static Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  split-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Navis core
        run: node tests/navis-tag-isonote.test.js
      - name: Navis benchmark
        run: node tests/navis-tag-isonote-benchmark.test.js
      - name: Navis readiness
        run: node tests/navis-tag-isonote-readiness.test.js
      - name: Navis v3 contracts
        run: node tests/navis-tag-isonote-contracts-v3.test.js
      - name: Navis static
        run: node tests/navis-tag-isonote-static.test.js
      - name: Deploy workflow artifact
        run: node tests/deploy-workflow-pages-artifact.test.js
      - name: Utility layout stabilizer
        run: node tests/psnm-utility-layout-stabilizer.test.js
      - name: Pipeline CAD foundation
        run: node tests/pipeline-3d-model-cad-foundation.test.js
      - name: Pipeline CAD workspace static
        run: node tests/pipeline-3d-model-cad-workspace-static.test.js
      - name: Pipeline CAD workspace
        run: node tests/pipeline-3d-model-cad-workspace.test.js
      - name: Pipeline CAD authoring
        run: node tests/pipeline-3d-model-cad-authoring.test.js
      - name: Pipeline CAD readiness
        run: node tests/pipeline-3d-model-cad-readiness.test.js
      - name: Pipeline CAD browser contract
        run: node tests/pipeline-3d-model-cad-browser-contract.test.js
      - name: Pipeline CAD runtime policy
        run: node tests/pipeline-3d-model-cad-runtime-policy.test.js
      - name: Pipeline CAD production hardening
        run: node tests/pipeline-3d-model-cad-production-hardening.test.js
      - name: Pipeline CAD interaction quality
        run: node tests/pipeline-3d-model-cad-interaction-quality.test.js
      - name: Pipeline CAD lifecycle performance
        run: node tests/pipeline-3d-model-cad-lifecycle-performance.test.js
      - name: Pipeline CAD canvas audit hardening
        run: node tests/pipeline-3d-model-canvas-audit-hardening.test.js
      - name: Pipeline CAD soak evidence
        run: node tests/pipeline-3d-model-cad-soak-evidence.test.js
      - name: Pipeline CAD floating preview
        run: node tests/pipeline-3d-model-cad-floating-preview.test.js
      - name: Pipeline CAD engineering review
        run: node tests/pipeline-3d-model-cad-engineering-review.test.js
      - name: Pipeline CAD preview modes
        run: node tests/pipeline-3d-model-cad-preview-modes.test.js
