name: UXML S3 Strict CAESAR InputXML Reader
on:
  pull_request:
    paths:
      - 'uxml/UxmlInputXmlSchemaMapper.js'
      - 'uxml/UxmlInputXmlDeltaGraph.js'
      - 'uxml/UxmlInputXmlDeltaGraph.js'
      - 'docs/GREInputxml.xml'
      - 'docs/PLB314Inputxml.xml'
      - 'tools/inputxml-to-uxml.mjs'
      - 'tests/uxml-s3-caesar-inputxml.test.mjs'
      - 'tests/uxml-s3-caesar-mutants.test.mjs'
      - 'tests/fixtures/uxml-s3-synthetic.psi116.xml'
      - 'tests/fixtures/uxml-s3-synthetic.workspace.input.xml'
      - 'tests/fixtures/uxml-s3-synthetic.workspace.delta-only.input.xml'
      - 'tools/uxml-s3-workspace-pair.mjs'
      - '.github/workflows/uxml-s3-inputxml.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and source-linked strict mapper, legacy non-mutation, CLI
        run: |
          node --check uxml/UxmlInputXmlSchemaMapper.js
          node --check uxml/UxmlInputXmlDeltaGraph.js
          node --check uxml/UxmlInputXmlDeltaGraph.js
          node --check tools/inputxml-to-uxml.mjs
          node --test tests/uxml-s3-caesar-inputxml.test.mjs tests/uxml-s3-caesar-mutants.test.mjs
  workspace-pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Real Workspace Clean XML to 5C InputXML synthetic source witness
        run: node tools/uxml-s3-workspace-pair.mjs --verify
