name: Committed profile propagation fixture validation

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/profile-propagation-committed-validation.yml']

permissions:
  contents: read

env:
  TARGET_BRANCH: owner/fix-navis-benchmark-static-contract
  EXPECTED_TARGET_SHA: 7cb5ca5ab6790dba50af28e32af032e2c54d0509

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
      - run: node tests/pipeline-3d-model-profile-propagation.test.js
      - run: test -z "$(git status --short)"
