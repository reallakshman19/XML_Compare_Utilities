name: PS Mapping CSV Upload and Mock Sample Qualification

on:
  push:
    branches:
      - feat/psmap-csv-upload-mock-20261028
  pull_request:
    paths:
      - 'tabs/ps-mapping-utility/**'
      - 'tabs/ps-mapping-utility-tab-source-ux-ui.js'
      - 'docs/tabs/ps-mapping-utility/**'
      - 'docs/tabs/ps-mapping-utility-tab-source-ux-ui.js'
      - 'tests/ps-mapping-csv-upload*'
      - 'tests/fixtures/psmap-csv-upload.html'
      - 'playwright.psmap-csv-upload.config.mjs'
      - '.github/workflows/psmap-csv-upload-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psmap-csv-upload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  csv-node:
    name: CSV parser, mock fixtures and resolver integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/ps-mapping-csv-upload.test.mjs
      - run: node tests/deploy-workflow-pages-artifact.test.js

  csv-browser:
    name: Chromium CSV and mock buttons → Run Mapping
    needs: csv-node
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.psmap-csv-upload.config.mjs
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: psmap-csv-upload-browser-debug
          path: test-results/
          if-no-files-found: ignore
