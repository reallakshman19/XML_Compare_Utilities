name: XML Builder Viewport Browser Acceptance

on:
  pull_request:
    paths:
      - 'xml-compare/universal-categorizer/**'
      - 'tabs/xml-compare-universal-categorizer-runtime.js'
      - 'xml-compare/XmlCompareTabView.js'
      - 'tests/browser/xml-builder-viewport-*'
      - 'tests/xml-compare-universal-viewport-*'
      - 'playwright.xml-builder-viewport.config.mjs'
      - 'package.json'
      - '.github/workflows/xml-builder-viewport-browser.yml'
  push:
    branches: [main]
    paths:
      - 'xml-compare/universal-categorizer/**'
      - 'tabs/xml-compare-universal-categorizer-runtime.js'
      - 'xml-compare/XmlCompareTabView.js'
      - 'tests/browser/xml-builder-viewport-*'
      - 'tests/xml-compare-universal-viewport-*'
      - 'playwright.xml-builder-viewport.config.mjs'
      - 'package.json'
      - '.github/workflows/xml-builder-viewport-browser.yml'
  workflow_dispatch:

jobs:
  chromium-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run XML Builder viewport unit acceptance
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm run test:xml-builder-viewport 2>&1 | tee artifacts/xml-builder-viewport-unit.log
      - name: Install pinned Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.54.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run XML Builder Chromium acceptance
        run: npm run test:xml-builder-viewport-browser
      - name: Upload XML Builder viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml-builder-viewport-${{ github.sha }}
          path: |
            artifacts/xml-builder-viewport-unit.log
            artifacts/xml-builder-viewport-browser-results.json
            playwright-report/xml-builder-viewport
            test-results/xml-builder-viewport
          if-no-files-found: warn
          retention-days: 30
