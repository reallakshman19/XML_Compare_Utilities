name: PS Family Clash Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'tabs/ps-family-clash-audit/**'
      - 'tests/ps-family-*.test.js'
      - '.github/workflows/ps-family-clash-audit.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'tabs/ps-family-clash-audit/**'
      - 'tests/ps-family-*.test.js'
      - '.github/workflows/ps-family-clash-audit.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.test_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_name: Core audit
            test_file: tests/ps-family-clash-audit.test.js
          - test_name: Configuration and reports
            test_file: tests/ps-family-clash-audit-config.test.js
          - test_name: UI smoke and scrolling
            test_file: tests/ps-family-clash-audit-ui-smoke.test.js
          - test_name: Output fixtures
            test_file: tests/ps-family-output-fixtures.test.js
          - test_name: Performance benchmark
            test_file: tests/ps-family-performance-benchmark.test.js
          - test_name: Accessibility gate
            test_file: tests/ps-family-accessibility-gate.test.js
          - test_name: Implementation compliance
            test_file: tests/ps-family-implementation-compliance.test.js
          - test_name: Sample fixtures
            test_file: tests/ps-family-sample-fixtures.test.js
          - test_name: Sample buttons
            test_file: tests/ps-family-sample-buttons.test.js
          - test_name: Report filtering
            test_file: tests/ps-family-report-filter-search.test.js
          - test_name: Active report export
            test_file: tests/ps-family-active-report-export.test.js
          - test_name: Row details
            test_file: tests/ps-family-row-details.test.js
          - test_name: Hierarchy report
            test_file: tests/ps-family-hierarchy-tab.test.js
          - test_name: Tabbed workspace
            test_file: tests/ps-family-tabbed-workspace-ui.test.js
          - test_name: PS clash report
            test_file: tests/ps-family-psclash-report.test.js
          - test_name: Readiness
            test_file: tests/ps-family-readiness.test.js
          - test_name: Benchmark readiness aggregate
            test_file: tests/ps-family-clash-audit-benchmark-readiness.test.js
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run ${{ matrix.test_name }}
        run: node ${{ matrix.test_file }}
