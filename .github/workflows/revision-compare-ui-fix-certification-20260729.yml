name: Revision Compare UI Visibility Certification

on:
  pull_request:
    paths:
      - '.github/workflows/revision-compare-ui-fix-certification-20260729.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revision-compare-ui-visibility-certification
  cancel-in-progress: true

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: 'true'
      EXPECTED_PRODUCT_HEAD: d32dd67935a20d1e68de35db1a5324ec864e405e
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cert/revision-compare-ui-visibility-20260729
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify exact product ancestry and certification-only delta
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor "$EXPECTED_PRODUCT_HEAD" HEAD
          git diff --name-only "$EXPECTED_PRODUCT_HEAD"..HEAD > /tmp/actual-certification-delta
          printf '%s\n' '.github/workflows/revision-compare-ui-fix-certification-20260729.yml' > /tmp/expected-certification-delta
          diff -u /tmp/expected-certification-delta /tmp/actual-certification-delta
          git rev-parse HEAD
          git show -s --format='%H %P' HEAD
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Expose installed Chromium
        run: |
          chromium_path=$(node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          console.log(chromium.executablePath());
          NODE
          )
          test -x "$chromium_path"
          echo "CHROMIUM_PATH=$chromium_path" >> "$GITHUB_ENV"
      - name: Diagnose review-side intrinsic overflow
        run: |
          python3 -m http.server 4179 --bind 127.0.0.1 > revision-compare-ui-diagnostic-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          cat > revision-compare-ui-diagnostic.mjs <<'NODE'
          import { chromium } from '@playwright/test';
          import { readFile, writeFile } from 'node:fs/promises';
          import { resolve } from 'node:path';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          await page.goto('http://127.0.0.1:4179/tests/browser/revision-compare-layout.html', { waitUntil: 'networkidle' });
          await page.locator('[data-revc-open]').click();
          await page.locator('[data-revc-file="baseline"]').setInputFiles({ name: 'a.json', mimeType: 'application/json', buffer: await readFile(resolve('tests/fixtures/revision-compare/rc002-rev-a.json')) });
          await page.locator('[data-slot="baseline"] strong').filter({ hasText: /ready/i }).waitFor();
          await page.locator('[data-revc-file="candidate"]').setInputFiles({ name: 'b.json', mimeType: 'application/json', buffer: await readFile(resolve('tests/fixtures/revision-compare/rc002-rev-b.json')) });
          await page.locator('[data-slot="candidate"] strong').filter({ hasText: /ready/i }).waitFor();
          await page.locator('[data-revc-approve-basis]').scrollIntoViewIfNeeded();
          await page.locator('[data-revc-approve-basis]').click();
          await page.locator('[data-revc-run-compare]').scrollIntoViewIfNeeded();
          await page.locator('[data-revc-run-compare]').click();
          await page.getByRole('heading', { name: 'Guided visual revision review' }).waitFor({ timeout: 25_000 });
          const diagnostic = await page.evaluate(() => {
            const side = document.querySelector('.revc-review-side');
            const sideRect = side.getBoundingClientRect();
            const path = (element) => {
              const parts = [];
              let current = element;
              while (current && current !== side) {
                let part = current.tagName.toLowerCase();
                if (current.id) part += `#${current.id}`;
                if (typeof current.className === 'string' && current.className.trim()) part += `.${current.className.trim().split(/\s+/).join('.')}`;
                parts.unshift(part); current = current.parentElement;
              }
              return `.revc-review-side > ${parts.join(' > ')}`;
            };
            const rows = [...side.querySelectorAll('*')].map((element) => {
              const rect = element.getBoundingClientRect(); const style = getComputedStyle(element);
              return {
                path: path(element),
                tag: element.tagName.toLowerCase(),
                classes: typeof element.className === 'string' ? element.className : '',
                text: (element.innerText || element.getAttribute('aria-label') || '').trim().replace(/\s+/g, ' ').slice(0, 180),
                rect: { left: rect.left, right: rect.right, width: rect.width, top: rect.top, bottom: rect.bottom },
                clientWidth: element.clientWidth, scrollWidth: element.scrollWidth,
                overflowDelta: element.scrollWidth - element.clientWidth,
                outsideRight: rect.right - sideRect.right,
                display: style.display, width: style.width, minWidth: style.minWidth, maxWidth: style.maxWidth,
                gridTemplateColumns: style.gridTemplateColumns, whiteSpace: style.whiteSpace,
                overflowX: style.overflowX, overflowWrap: style.overflowWrap, wordBreak: style.wordBreak,
              };
            }).filter((row) => row.overflowDelta > 1 || row.outsideRight > 1 || row.rect.width > sideRect.width + 1)
              .sort((a, b) => Math.max(b.overflowDelta, b.outsideRight, b.rect.width - sideRect.width) - Math.max(a.overflowDelta, a.outsideRight, a.rect.width - sideRect.width));
            return {
              side: { clientWidth: side.clientWidth, scrollWidth: side.scrollWidth, rect: { left: sideRect.left, right: sideRect.right, width: sideRect.width } },
              offenders: rows.slice(0, 80),
            };
          });
          console.log(JSON.stringify(diagnostic, null, 2));
          await writeFile('revision-compare-ui-overflow-diagnostic.json', JSON.stringify(diagnostic, null, 2));
          await page.screenshot({ path: 'revision-compare-ui-overflow-diagnostic.png', fullPage: false });
          await browser.close();
          NODE
          node revision-compare-ui-diagnostic.mjs
      - name: Run complete Revision Compare qualification
        run: |
          set -o pipefail
          /usr/bin/time -v npm run test:revision-compare-qualification 2>&1 | tee revision-compare-ui-qualification.log
      - name: Capture repaired UI evidence
        if: success()
        run: |
          mkdir -p revision-compare-ui-after
          python3 -m http.server 4180 --bind 127.0.0.1 > revision-compare-ui-after/server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          cat > revision-compare-ui-after.mjs <<'NODE'
          import { chromium } from '@playwright/test';
          import { readFile, writeFile } from 'node:fs/promises';
          import { resolve } from 'node:path';

          const baseUrl = 'http://127.0.0.1:4180/tests/browser/revision-compare-layout.html';
          const fixtureA = resolve('tests/fixtures/revision-compare/rc002-rev-a.json');
          const fixtureB = resolve('tests/fixtures/revision-compare/rc002-rev-b.json');
          const browser = await chromium.launch({ headless: true });
          const results = [];

          async function open(viewport) {
            const context = await browser.newContext({ viewport });
            const page = await context.newPage();
            await page.goto(baseUrl, { waitUntil: 'networkidle' });
            await page.locator('[data-revc-open]').click();
            await page.locator('.revc-dialog').waitFor({ state: 'visible' });
            await page.waitForFunction(() => [...document.styleSheets].some((sheet) => sheet.href?.includes('revision-compare-layout.css')));
            return { context, page };
          }

          async function loadPair(page) {
            await page.locator('[data-revc-file="baseline"]').setInputFiles({ name: 'rc002-rev-a.json', mimeType: 'application/json', buffer: await readFile(fixtureA) });
            await page.locator('[data-slot="baseline"] strong').filter({ hasText: /ready/i }).waitFor();
            await page.locator('[data-revc-file="candidate"]').setInputFiles({ name: 'rc002-rev-b.json', mimeType: 'application/json', buffer: await readFile(fixtureB) });
            await page.locator('[data-slot="candidate"] strong').filter({ hasText: /ready/i }).waitFor();
          }

          async function record(page, id, state) {
            await page.screenshot({ path: `revision-compare-ui-after/${id}-${state}.png`, animations: 'disabled' });
            const metrics = await page.evaluate(() => {
              const box = (selector) => {
                const element = document.querySelector(selector); if (!element) return null;
                const rect = element.getBoundingClientRect();
                return { left: rect.left, top: rect.top, right: rect.right, bottom: rect.bottom, width: rect.width, height: rect.height, clientWidth: element.clientWidth, scrollWidth: element.scrollWidth, clientHeight: element.clientHeight, scrollHeight: element.scrollHeight };
              };
              return {
                viewport: { width: innerWidth, height: innerHeight },
                dialog: box('.revc-dialog'), body: box('.revc-body'), footer: box('.revc-dialog > footer'),
                reviewWorkspace: box('.revc-review-workspace'), reviewSide: box('.revc-review-side'),
                loadHeadingVisible: Boolean(document.querySelector('#revc-load-title')?.getClientRects().length),
                fileControlsVisible: [...document.querySelectorAll('.revc-file-button')].filter((element) => element.getClientRects().length).length,
              };
            });
            results.push({ id, state, metrics });
          }

          {
            const { context, page } = await open({ width: 1280, height: 720 });
            await record(page, '1280x720', '01-empty');
            await loadPair(page);
            await page.locator('[data-revc-approve-basis]').scrollIntoViewIfNeeded();
            await record(page, '1280x720', '02-loaded-scope');
            await context.close();
          }
          {
            const { context, page } = await open({ width: 980, height: 760 });
            await record(page, '980x760', '01-empty');
            await loadPair(page);
            await page.locator('[data-revc-approve-basis]').scrollIntoViewIfNeeded();
            await record(page, '980x760', '02-loaded-scope');
            await context.close();
          }
          {
            const { context, page } = await open({ width: 390, height: 844 });
            await record(page, '390x844', '01-empty');
            await loadPair(page);
            await page.locator('[data-revc-approve-basis]').scrollIntoViewIfNeeded();
            await page.locator('[data-revc-approve-basis]').click();
            await page.locator('[data-revc-run-compare]').scrollIntoViewIfNeeded();
            await page.locator('[data-revc-run-compare]').click();
            await page.getByRole('heading', { name: 'Guided visual revision review' }).waitFor({ timeout: 25_000 });
            await record(page, '390x844', '03-review');
            await context.close();
          }
          await browser.close();
          await writeFile('revision-compare-ui-after/metrics.json', JSON.stringify(results, null, 2));
          NODE
          node revision-compare-ui-after.mjs
      - name: Record repository state
        if: always()
        run: git status --short | tee revision-compare-ui-worktree.log
      - name: Upload qualification and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-compare-ui-visibility-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            revision-compare-ui-overflow-diagnostic.json
            revision-compare-ui-overflow-diagnostic.png
            revision-compare-ui-diagnostic-server.log
            revision-compare-ui-qualification.log
            revision-compare-ui-worktree.log
            revision-compare-ui-after/
            artifacts/revision-compare-results.json
            playwright-report/
            test-results/revision-compare/
