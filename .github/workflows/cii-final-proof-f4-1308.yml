name: CII Writer2 F4 final integrated retained proof

on:
  push:
    branches:
      - validation/cii-final-proof-f4-1308
  workflow_dispatch:

jobs:
  final-integrated-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact F3V-qualified retained head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Guard exact final retained composition
        shell: bash
        run: |
          set -euo pipefail
          SEMANTIC_HEAD=25fe367817e1987468d02b538995ebe30ca29065
          F3V_HEAD=7f47bb4a41f0fc360f3a3ceace03886cc4973e70

          # F4 adds only this workflow to the already-qualified F3V validation head.
          test "$(git diff --name-only "$F3V_HEAD"...HEAD | sort)" = ".github/workflows/cii-final-proof-f4-1308.yml"

          expected_from_semantic="$(printf '%s\n' \
            '.github/workflows/cii-bm001-live-preimage-1309.yml' \
            '.github/workflows/cii-final-proof-f4-1308.yml' \
            'tests/cii-workspace-multisource-bm001-live-preimage.test.js' \
            'tests/cii-workspace-multisource-partial-texpected-oracle.js' | sort)"
          test "$(git diff --name-only "$SEMANTIC_HEAD"...HEAD | sort)" = "$expected_from_semantic"

          # Original Slice-9 final-proof lanes stay byte-exact.
          test "$(git hash-object tests/cii-workspace-multisource-retained-auto-anchor-benchmark.test.js)" = "362481e07c510e3d8c7cc8b59727a367b156aa29"
          test "$(git hash-object tests/browser/cii-writer2-multisource-retained-benchmark.spec.mjs)" = "d86fc7ac94a5f22a24946e68b49036f9b749069e"
          test "$(git hash-object tests/browser/cii-writer2-multisource-retained-tile-ui.spec.mjs)" = "54deec5eb1d77f519667b783b89e3cdb65d75c55"
          test "$(git hash-object tests/cii-workspace-multisource-lower-bound-helpers.test.js)" = "17d9eb0e98edc1cb01b230aaf040eb1e4be6e1d2"
          test "$(git hash-object tests/cii-workspace-multisource-byte-closure-oracle.js)" = "d7eeec4e71d92bd8bc1138961ad25b9f10045e17"

          # F3V is the only intended validation-authority change.
          test "$(git hash-object tests/cii-workspace-multisource-partial-texpected-oracle.js)" = "5d9c925b7b9c58a2db1e0ffc05027ec468f48b60"
          test "$(git hash-object tests/cii-workspace-multisource-bm001-live-preimage.test.js)" = "6ff1ba3b4066d3ea323213b86b9e13c10e44c656"

          # Exact retained product composition remains unchanged.
          test "$(git hash-object tabs/cii-workspace/cii-workspace-multi-base-correspondence.js)" = "1512858f06cd6cc47c221cac306c4846302cde50"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-node-custody.js)" = "cf08a90b97d022432237593eafd665066155d6d6"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-alignment.js)" = "cfdbd033c2852627908874e2542de0e0c33f3014"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-source-target-audit.js)" = "8787fe0f09215ccd4e6bcc337f6d88a8f31d6d91"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-benchmark-overlay.js)" = "0bc83e1b747725a3c0e7e5cbd147aded421f10c4"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-multisource-nodename-authority.js)" = "12a282b4d6da6e42a1cecc374e86de06794b1822"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-multisource-bm001-correspondence.js)" = "15b451c84cfa11838004e58feb4c169069d82ef2"

          if git diff --name-only "$SEMANTIC_HEAD"...HEAD -- tabs/cii-workspace | grep -q .; then
            echo "Product mutation forbidden in F4"
            exit 1
          fi
          if git diff --name-only "$SEMANTIC_HEAD"...HEAD -- Benchmark | grep -q .; then
            echo "Benchmark mutation forbidden in F4"
            exit 1
          fi

          echo "F4_FINAL_INTEGRATED_EXACT_HEAD_GUARD_PASS"

      - name: Install dependencies
        run: npm ci

      - name: Run lower-bound helper denominator
        run: node tests/cii-workspace-multisource-lower-bound-helpers.test.js

      - name: Run retained Node auto-anchor full-proof lane
        run: node tests/cii-workspace-multisource-retained-auto-anchor-benchmark.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Create final integrated Playwright config
        shell: bash
        run: |
          cat > playwright.final-f4-1308.config.mjs <<'EOF'
          import base from './playwright.cii-writer2-retained.config.mjs';
          export default {
            ...base,
            testMatch: [
              'cii-writer2-multisource-retained-benchmark.spec.mjs',
              'cii-writer2-multisource-retained-tile-ui.spec.mjs',
            ],
            timeout: 360_000,
            expect: { timeout: 25_000 },
            workers: 1,
            retries: 0,
            reporter: [['list']],
            outputDir: 'test-results/cii-writer2-final-f4-1308',
          };
          EOF

      - name: Run final Chromium full-proof and tile lanes
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.final-f4-1308.config.mjs 2>&1 | tee final-f4-1308.log

      - name: Upload final integrated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cii-writer2-final-f4-1308
          path: |
            final-f4-1308.log
            test-results/cii-writer2-final-f4-1308
          if-no-files-found: warn
