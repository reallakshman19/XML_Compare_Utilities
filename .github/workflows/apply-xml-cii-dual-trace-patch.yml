name: Apply XML CII Dual Trace Patch

on:
  push:
    branches: [owner/xml-cii-dual-dtxr-trace]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner/xml-cii-dual-dtxr-trace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply validated shared DTXR runtime bridge
        run: |
          python scripts/apply-dtxr-ledger-runtime-bridge.py
          python scripts/apply-dtxr-json-trace-ledger-bridge.py
          node --check tabs/model-converters/converters/xmltocii2019_helper/enrichment-core.js
          node --check tabs/model-converters/json-trace/json-trace-panel.js
          node tests/xml-cii-dtxr-runtime-bridge.test.js
          node tests/xml-cii-json-trace-dual-evidence-ui.test.js
          node tests/xml-cii-dtxr-ledger-trace-consumer.test.js
      - name: Commit shared runtime bridge
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tabs/model-converters/converters/xmltocii2019_helper/enrichment-core.js tabs/model-converters/json-trace/json-trace-panel.js
          git diff --cached --quiet && exit 0
          git commit -m "Bridge authoritative DTXR ledger into JSON Trace runtime"
          git push origin HEAD:owner/xml-cii-dual-dtxr-trace
