name: Apply XML CII Dual Trace Patch

on:
  push:
    branches: [owner/xml-cii-dual-dtxr-trace]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner/xml-cii-dual-dtxr-trace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply validated DTXR enrichment patch
        run: |
          python scripts/apply-dtxr-ledger-enrichment.py
          node --check tabs/model-converters/converters/xmltocii2019_helper/enrichment-core.js
          node tests/xml-cii-xml-node-wise-trace.test.js
          node tests/xml-cii-dtxr-resolution-ledger.test.js
      - name: Commit enrichment integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tabs/model-converters/converters/xmltocii2019_helper/enrichment-core.js
          git diff --cached --quiet && exit 0
          git commit -m "Integrate authoritative DTXR ledger into XML enrichment"
          git push origin HEAD:owner/xml-cii-dual-dtxr-trace
