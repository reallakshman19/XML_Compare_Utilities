name: Apply XML CII Dual Trace Patch

on:
  push:
    branches: [owner/xml-cii-dual-dtxr-trace]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner/xml-cii-dual-dtxr-trace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply validated DTXR trace-ledger patch
        run: |
          python scripts/apply-dtxr-trace-ledger-diagnostics.py
          node --check converters/xml-cii2019-core/xml-node-wise-trace.js
          node tests/xml-cii-xml-node-wise-trace.test.js
          node tests/xml-cii-dtxr-resolution-ledger.test.js
          node tests/xml-cii-dtxr-ledger-trace-consumer.test.js
      - name: Commit trace-ledger integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add converters/xml-cii2019-core/xml-node-wise-trace.js
          git diff --cached --quiet && exit 0
          git commit -m "Make XML node trace consume authoritative DTXR ledger"
          git push origin HEAD:owner/xml-cii-dual-dtxr-trace
