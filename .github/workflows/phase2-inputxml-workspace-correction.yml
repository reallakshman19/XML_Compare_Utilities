name: Phase 2 InputXML Workspace Dependency Correction

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase2-inputxml-workspace-correction.yml

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: claude/snap-geometry-cii-issues-v272ju
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply byte-exact correction
        run: node scripts/phase2-inputxml-workspace-correction.mjs
      - name: Syntax, structure, and focused tests
        run: |
          node --check tabs/inputxml-workspace/inputxml-workspace-tab.js
          node --check tabs/inputxml-workspace/inputxml-workspace-orchestration.js
          node --check tests/inputxml-workspace-static.test.js
          test "$(wc -l < tabs/inputxml-workspace/inputxml-workspace-orchestration.js)" -lt 300
          ! grep -R "export default" \
            tabs/inputxml-workspace/inputxml-workspace-diagnostics.js \
            tabs/inputxml-workspace/inputxml-workspace-orchestration.js \
            tabs/inputxml-workspace/inputxml-workspace-diagnostics-view.js
          node tests/inputxml-workspace-static.test.js
          node tests/inputxml-workspace-accdb-sideload.test.js
          npm run test:inputxml-workspace
      - name: Commit correction and remove scaffolding
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/phase2-inputxml-workspace-correction.yml
          rm -f scripts/phase2-inputxml-workspace-correction.mjs
          git add -A
          git diff --cached --check
          git commit -m "fix: scope InputXML Workspace dependency invalidation"
          git push origin HEAD:claude/snap-geometry-cii-issues-v272ju
