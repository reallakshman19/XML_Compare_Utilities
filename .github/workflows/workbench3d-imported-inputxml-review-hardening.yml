name: Harden Workbench3D Imported InputXML Review

on:
  pull_request:
    paths:
      - '.github/workflows/workbench3d-imported-inputxml-review-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/workbench3d-imported-inputxml-review
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply owner-review hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)

          module_path = Path('workbench3d/ui/imported-inputxml-review.js')
          text = module_path.read_text(encoding='utf-8')
          anchor = "export function createImportedInputXmlReviewState(input = {}) {"
          eligibility = r'''export function isGenuineCaesarInputXml(value = '') {
  const raw = String(value ?? '');
  const root = raw.match(/<CAESARII\b([^>]*)>/i);
  return Boolean(root
    && /\bXML_TYPE\s*=\s*["']Input["']/i.test(root[1])
    && /<PIPINGMODEL\b/i.test(raw));
}

'''
          text = replace_once(text, anchor, eligibility + anchor, 'genuine InputXML helper')
          text = replace_once(
              text,
              "    sourceSchema: detectSchema(text),\n",
              "    sourceSchema: detectSchema(text),\n    genuineCaesarInputXml: isGenuineCaesarInputXml(text),\n",
              'source eligibility field',
          )
          old_start = """  if (source.sourceSchema !== XML_SCHEMA_KINDS.INPUT_XML) {
    return Object.freeze({
      source,
      request: null,
      review: createImportedInputXmlReviewState({
        side: source.side,
        status: 'NOT_APPLICABLE',
        sourceSchema: source.sourceSchema,
        sourceFilename: source.filename,
        sourceFingerprint: source.fingerprint,
        diagnostic: excludedDiagnostic(source.sourceSchema),
      }),
    });
  }
"""
          new_start = """  if (source.sourceSchema === XML_SCHEMA_KINDS.INPUT_XML && !source.genuineCaesarInputXml) {
    return Object.freeze({
      source,
      request: null,
      review: createImportedInputXmlReviewState({
        side: source.side,
        status: 'NOT_APPLICABLE',
        sourceSchema: source.sourceSchema,
        sourceFilename: source.filename,
        sourceFingerprint: source.fingerprint,
        diagnostic: Object.freeze({
          code: 'WORKBENCH_CAESAR_INPUTXML_ROOT_REQUIRED',
          message: 'PIPINGELEMENT markers alone are insufficient; categorized review requires a CAESARII root with XML_TYPE="Input" and PIPINGMODEL.',
        }),
      }),
    });
  }
  if (source.sourceSchema !== XML_SCHEMA_KINDS.INPUT_XML) {
    return Object.freeze({
      source,
      request: null,
      review: createImportedInputXmlReviewState({
        side: source.side,
        status: 'NOT_APPLICABLE',
        sourceSchema: source.sourceSchema,
        sourceFilename: source.filename,
        sourceFingerprint: source.fingerprint,
        diagnostic: excludedDiagnostic(source.sourceSchema),
      }),
    });
  }
"""
          text = replace_once(text, old_start, new_start, 'strict eligibility branch')
          text = replace_once(
              text,
              "  return source.sourceSchema === XML_SCHEMA_KINDS.INPUT_XML\n    && review.status === 'PASS'",
              "  return source.sourceSchema === XML_SCHEMA_KINDS.INPUT_XML\n    && source.genuineCaesarInputXml\n    && review.status === 'PASS'",
              'current review eligibility',
          )
          text = replace_once(
              text,
              "      schema: source.sourceSchema,\n      fingerprint:",
              "      schema: source.sourceSchema,\n      genuineCaesarInputXml: source.genuineCaesarInputXml,\n      fingerprint:",
              'receipt eligibility evidence',
          )
          text = replace_once(
              text,
              "  if (!container.__workbench3dImportedInputXmlReviewRuntime) {",
              "  if (!container.__workbench3dImportedInputXmlReviewRuntime\n      || container.__workbench3dImportedInputXmlReviewRuntime.closed) {",
              'remount runtime recreation',
          )
          module_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/workbench3d-imported-inputxml-review.test.js')
          test = test_path.read_text(encoding='utf-8')
          test = replace_once(
              test,
              "  createImportedInputXmlReviewCollection,\n",
              "  _test, closeImportedInputXmlReviewRuntime, createImportedInputXmlReviewCollection,\n",
              'test lifecycle imports',
          )
          test = replace_once(
              test,
              "const CATEGORIZED_XML = '<CategorizedInputXML schemaVersion=\"3\"><Line id=\"L1\" /></CategorizedInputXML>';\n",
              "const CATEGORIZED_XML = '<CategorizedInputXML schemaVersion=\"3\"><Line id=\"L1\" /></CategorizedInputXML>';\n"
              "const PIPINGELEMENT_ONLY_XML = '<Root><PIPINGELEMENT FROM_NODE=\"10\" TO_NODE=\"20\" /></Root>';\n",
              'non-CAESAR fixture',
          )
          eligibility_tests = """
const markerOnly = startImportedInputXmlReview({ side: 'source', text: PIPINGELEMENT_ONLY_XML, filename: 'marker-only.xml' });
assert.equal(markerOnly.request, null);
assert.equal(markerOnly.review.status, 'NOT_APPLICABLE');
assert.equal(markerOnly.review.diagnostic.code, 'WORKBENCH_CAESAR_INPUTXML_ROOT_REQUIRED');
const markerContainer = {};
const markerState = { importedInputXmlReview: createImportedInputXmlReviewCollection() };
await runImportedInputXmlReview({ container: markerContainer, state: markerState, side: 'source', text: PIPINGELEMENT_ONLY_XML, filename: 'marker-only.xml' });
assert.equal(markerContainer.__workbench3dImportedInputXmlReviewRuntime.client, null, 'Non-CAESAR marker XML must not create a worker client.');

const lifecycleContainer = {};
const firstRuntime = _test.ensureRuntime(lifecycleContainer);
closeImportedInputXmlReviewRuntime(lifecycleContainer);
const remountedRuntime = _test.ensureRuntime(lifecycleContainer);
assert.notEqual(remountedRuntime, firstRuntime, 'Remount must allocate a fresh imported-review runtime.');
assert.equal(remountedRuntime.closed, false);

"""
          test = replace_once(test, "const targetRequest = createImportedInputXmlReviewRequest", eligibility_tests + "const targetRequest = createImportedInputXmlReviewRequest", 'eligibility and remount tests')
          test_path.write_text(test, encoding='utf-8')

          static_path = Path('tests/workbench3d-imported-inputxml-review-static.test.js')
          static = static_path.read_text(encoding='utf-8')
          static = replace_once(
              static,
              "assert.match(review, /source\\.sourceSchema !== XML_SCHEMA_KINDS\\.INPUT_XML/);\n",
              "assert.match(review, /isGenuineCaesarInputXml/);\n"
              "assert.match(review, /WORKBENCH_CAESAR_INPUTXML_ROOT_REQUIRED/);\n"
              "assert.match(review, /source\\.sourceSchema === XML_SCHEMA_KINDS\\.INPUT_XML && !source\\.genuineCaesarInputXml/);\n"
              "assert.match(review, /source\\.sourceSchema !== XML_SCHEMA_KINDS\\.INPUT_XML/);\n",
              'static strict eligibility',
          )
          static = replace_once(
              static,
              "assert.match(review, /runtime\\.client\\?\\.close\\?\\.\\(\\)/);\n",
              "assert.match(review, /runtime\\.client\\?\\.close\\?\\.\\(\\)/);\n"
              "assert.match(review, /__workbench3dImportedInputXmlReviewRuntime\\.closed/);\n",
              'static remount guard',
          )
          static_path.write_text(static, encoding='utf-8')

          Path('.github/workflows/workbench3d-imported-inputxml-review-hardening.yml').unlink()
          PY
      - name: Run corrected WP4 qualification
        run: |
          node --check workbench3d/ui/imported-inputxml-review.js
          node --check workbench3d/ui/workbench3d-tab.js
          node tests/workbench3d-imported-inputxml-review.test.js
          node tests/workbench3d-imported-inputxml-review-static.test.js
          npm run test:workbench3d
          npm run test:inputxml-workspace
          git diff --check
      - name: Commit qualified hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(workbench3d): require genuine CAESAR InputXML review source'
          git push origin HEAD:agent/workbench3d-imported-inputxml-review
