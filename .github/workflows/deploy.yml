name: Deploy XML Compare Utilities to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
      - name: Verify exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Semantic validation
        run: npm test
      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v6
      - name: Prepare Pages artifact
        if: github.event_name == 'push'
        run: |
          mkdir -p "${{ runner.temp }}/pages"
          rsync -av --delete \
            --exclude='.*' \
            --exclude='tests/' \
            --exclude='README.md' \
            --exclude='package.json' \
            --exclude='**/__pycache__/' \
            --exclude='**/*.pyc' \
            ./ "${{ runner.temp }}/pages/"
          touch "${{ runner.temp }}/pages/.nojekyll"
      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages
          include-hidden-files: true
  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
