name: CII D5.3 Method-A boundary custody qualification

on:
  push:
    branches:
      - validation/cii-method-a-boundary-custody-1284
  workflow_dispatch:

jobs:
  d5-3-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Guard exact D5.3 product
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_BASE=2751b563505caa2c9be0803294b00c3177c2811a
          PRODUCT_HEAD=d919446c09237558da57b01bf9168985bf6d73db

          expected_validation=".github/workflows/cii-method-a-boundary-custody-1284.yml"
          actual_validation="$(git diff --name-only "$PRODUCT_HEAD"...HEAD | sort)"
          test "$actual_validation" = "$expected_validation"

          expected_product="$(printf '%s\n' \
            'agents/WIP-1284-node-custody_workreport.md' \
            'tabs/cii-workspace/cii-workspace-node-custody.js' \
            'tests/cii-workspace-method-a-boundary-node-custody.test.js' | sort)"
          actual_product="$(git diff --name-only "$PRODUCT_BASE" "$PRODUCT_HEAD" | sort)"
          test "$actual_product" = "$expected_product"

          test "$(git rev-parse "$PRODUCT_HEAD:tabs/cii-workspace/cii-workspace-node-custody.js")" = "6e7cb74f9533cde025bee083cdc8ac2b0b05cb25"
          test "$(git rev-parse "$PRODUCT_HEAD:tests/cii-workspace-method-a-boundary-node-custody.test.js")" = "030156fd8ee0fda90413a202d6c8f1cc2693ca33"
          test "$(git rev-parse "$PRODUCT_HEAD:agents/WIP-1284-node-custody_workreport.md")" = "37db5ffc6ae6eb6967bf4846187d2c682088fb70"

          test "$(git rev-parse "$PRODUCT_HEAD:tabs/cii-workspace/cii-workspace-multi-base-correspondence.js")" = "adf5c71f189f564cea87e38f55f62a36817e9d20"
          test "$(git rev-parse "$PRODUCT_HEAD:tabs/cii-workspace/cii-workspace-correspondence-arbitration.js")" = "ff26a1921dc527a7d7cef2e9a94c56b92651484f"
          test "$(git rev-parse "$PRODUCT_HEAD:tabs/cii-workspace/cii-workspace-candidates.js")" = "80733143c742fa97b3d6ff5b1b36a71a46daea0b"
          test "$(git rev-parse "$PRODUCT_HEAD:tabs/cii-workspace/cii-workspace-engineering-delta.js")" = "39575998f627a84808640872076cdd5e3b05202a"
          test "$(git rev-parse "$PRODUCT_HEAD:tabs/cii-workspace/cii-workspace-compare-review.js")" = "c793929aadf9367fa4a672bdd59214169fc58a73"

          test "$(git rev-parse "$PRODUCT_HEAD:tests/cii-workspace-method-a-anchor-provenance.test.js")" = "2462f0571a27b1b3c960baafd7cc718d08cc2316"
          test "$(git rev-parse "$PRODUCT_HEAD:tests/cii-workspace-method-a-boundary-provenance.test.js")" = "70e1407ddc94feb64b87a6079ea41442ed9dca78"
          test "$(git rev-parse "$PRODUCT_HEAD:tests/cii-workspace-method-a-projection-integration.test.js")" = "742e6f26d524fddc72f7f1b1f95ca0687d4c4954"

          if git diff --name-only "$PRODUCT_BASE" "$PRODUCT_HEAD" -- Benchmark | grep -q .; then
            echo "Benchmark mutation forbidden"
            exit 1
          fi

          for protected in \
            tabs/cii-workspace/cii-workspace-geometry.js \
            tabs/cii-workspace/cii-workspace-anchor-physical-candidates.js \
            tabs/cii-workspace/cii-workspace-correspondence-arbitration.js \
            tabs/cii-workspace/cii-workspace-candidates.js \
            tabs/cii-workspace/cii-workspace-engineering-delta.js \
            tabs/cii-workspace/cii-workspace-compare-review.js \
            tabs/cii-workspace/cii-workspace-writer-version-bridge.js; do
            if git diff --name-only "$PRODUCT_BASE" "$PRODUCT_HEAD" -- "$protected" | grep -q .; then
              echo "Protected product surface changed: $protected"
              exit 1
            fi
          done

          echo "D5_3_EXACT_PRODUCT_GUARD_PASS"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check D5.3 product
        run: |
          node --check tabs/cii-workspace/cii-workspace-node-custody.js
          node --check tests/cii-workspace-method-a-boundary-node-custody.test.js

      - name: Run D5.3 focused falsifiers
        run: node tests/cii-workspace-method-a-boundary-node-custody.test.js

      - name: Run inherited D3 regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/cii-workspace-method-a-anchor-provenance.test.js
          node tests/cii-workspace-method-a-boundary-provenance.test.js
          node tests/cii-workspace-method-a-projection-integration.test.js
