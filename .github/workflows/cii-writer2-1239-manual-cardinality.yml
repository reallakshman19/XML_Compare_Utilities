name: CII Writer2 #1239 Manual Anchor Cardinality

on:
  push:
    branches:
      - validation/cii-writer2-1239-manual-cardinality

permissions:
  contents: read

concurrency:
  group: cii-writer2-1239-manual-cardinality
  cancel-in-progress: false

jobs:
  manual-cardinality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout validation tree
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove validation-only delta
        shell: bash
        run: |
          set -euo pipefail
          OVERLAY_SHA=86415c1b0efae6fb4bde8eedcb21e97984b87fa6
          test "$(git merge-base "$OVERLAY_SHA" HEAD)" = "$OVERLAY_SHA"
          mapfile -t unexpected < <(git diff --name-only "$OVERLAY_SHA" HEAD | grep -Ev '^\.github/workflows/cii-writer2-1239-manual-cardinality\.yml$' || true)
          if [ "${#unexpected[@]}" -ne 0 ]; then
            printf 'UNEXPECTED_CARDINALITY_VALIDATION_DRIFT\n%s\n' "${unexpected[@]}"
            exit 1
          fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Create exact cardinality browser config
        shell: bash
        run: |
          cat > playwright.cii-writer2-manual-cardinality.generated.mjs <<'EOF'
          import { defineConfig, devices } from '@playwright/test';
          export default defineConfig({
            testDir: './tests/browser',
            testMatch: ['cii-writer2-manual-anchor-cardinality.spec.mjs'],
            fullyParallel: false,
            workers: 1,
            retries: 0,
            timeout: 600_000,
            expect: { timeout: 60_000 },
            reporter: [['line'], ['html', { outputFolder: 'playwright-report', open: 'never' }]],
            use: {
              ...devices['Desktop Chrome'],
              browserName: 'chromium',
              headless: true,
              viewport: { width: 1280, height: 800 },
              baseURL: 'http://127.0.0.1:4174',
              trace: 'retain-on-failure',
              screenshot: 'only-on-failure',
            },
            webServer: {
              command: 'node tests/browser/cii-writer2-static-server.mjs 4174',
              url: 'http://127.0.0.1:4174/tests/browser/cii-writer2-bridge-fixture.html',
              timeout: 120_000,
              reuseExistingServer: false,
            },
          });
          EOF

      - name: Run governed ONE TWO THREE retained cardinality experiment
        shell: bash
        run: |
          set -o pipefail
          start=$(date +%s)
          npx playwright test --config=playwright.cii-writer2-manual-cardinality.generated.mjs 2>&1 | tee manual-cardinality.log
          status=${PIPESTATUS[0]}
          end=$(date +%s)
          echo "ELAPSED_SECONDS=$((end-start))" | tee manual-cardinality-summary.log
          echo "EXIT_STATUS=$status" | tee -a manual-cardinality-summary.log
          exit "$status"

      - name: Upload cardinality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cii-writer2-1239-manual-cardinality
          path: |
            manual-cardinality.log
            manual-cardinality-summary.log
            playwright-report
            test-results
          if-no-files-found: warn
