name: CII Writer2 Slice 6 review-state qualification

on:
  push:
    branches:
      - validation/cii-writer2-slice6-review-state-1239
  workflow_dispatch:

jobs:
  slice6-review-state:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Guard Slice 6 validation overlay
        shell: bash
        run: |
          set -euo pipefail
          SLICE6=5f31bae3b229cfbd68ff8124562d37067843f036
          PERF=b7fb3513eabbac786a7d095c1be96fcfbbcac8e6

          allowed=$(cat <<'EOF'
          .github/workflows/cii-writer2-slice6-review-state.yml
          tabs/cii-workspace/cii-workspace-anchor-physical-candidates.js
          tabs/cii-workspace/cii-workspace-anchor-suggestions-core.js
          tabs/cii-workspace/cii-workspace-anchor-suggestions.js
          tabs/cii-workspace/cii-workspace-multisource-review-only-filter-shell.js
          tabs/cii-workspace/cii-workspace-source-set.js
          tabs/cii-workspace/cii-workspace-source-target-audit.js
          EOF
          )

          changed="$(git diff --name-only "$SLICE6"...HEAD | sort)"
          printf '%s
' "$changed"
          unexpected="$(comm -23 <(printf '%s
' "$changed") <(printf '%s
' "$allowed" | sed 's/^          //' | sort) || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected validation drift:"
            printf '%s
' "$unexpected"
            exit 1
          fi

          for file in \
            tabs/cii-workspace/cii-workspace-anchor-physical-candidates.js \
            tabs/cii-workspace/cii-workspace-anchor-suggestions-core.js \
            tabs/cii-workspace/cii-workspace-anchor-suggestions.js \
            tabs/cii-workspace/cii-workspace-multisource-review-only-filter-shell.js \
            tabs/cii-workspace/cii-workspace-source-set.js
          do
            current="$(git hash-object "$file")"
            expected="$(git show "$PERF:$file" | git hash-object --stdin)"
            test "$current" = "$expected"
            echo "PERF_OVERLAY_OK $file $current"
          done

          audit_sha="$(git hash-object tabs/cii-workspace/cii-workspace-source-target-audit.js)"
          test "$audit_sha" = "8787fe0f09215ccd4e6bcc337f6d88a8f31d6d91"
          echo "KNOWN_PARSE_REPAIR_OK $audit_sha"

          git diff --exit-code "$SLICE6" -- \
            tabs/cii-workspace/cii-workspace-multisource-review-state-controls.js \
            tabs/cii-workspace/cii-workspace-multisource-review-ui.js \
            tests/cii-workspace-multisource-review-state.test.js \
            tests/browser/cii-writer2-multisource-retained-tile-ui.spec.mjs
          echo "SLICE6_SEMANTICS_UNTOUCHED"
          echo "VALIDATION_HEAD=$(git rev-parse HEAD)"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Syntax + deterministic Slice 6 contract
        shell: bash
        run: |
          set -euo pipefail
          node --check tabs/cii-workspace/cii-workspace-source-target-audit.js
          node --check tabs/cii-workspace/cii-workspace-multisource-review-state-controls.js
          node --check tabs/cii-workspace/cii-workspace-multisource-review-ui.js
          node --check tests/browser/cii-writer2-multisource-retained-tile-ui.spec.mjs
          node tests/cii-workspace-multisource-review-state.test.js

      - name: Create Slice 6 browser config
        shell: bash
        run: |
          cat > playwright.slice6-review-state.config.mjs <<'EOF'
          import base from './playwright.cii-writer2-retained.config.mjs';

          export default {
            ...base,
            testMatch: ['cii-writer2-multisource-retained-tile-ui.spec.mjs'],
            timeout: 300_000,
            expect: { timeout: 30_000 },
            workers: 1,
            retries: 0,
            outputDir: 'test-results/cii-writer2-slice6-review-state',
            reporter: [['list']],
          };
          EOF

      - name: Run retained Slice 6 Writer2 UX regression
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.slice6-review-state.config.mjs 2>&1 | tee slice6-review-state.log

      - name: Upload Slice 6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cii-writer2-slice6-review-state
          path: |
            slice6-review-state.log
            playwright.slice6-review-state.config.mjs
            test-results/cii-writer2-slice6-review-state
          if-no-files-found: warn
