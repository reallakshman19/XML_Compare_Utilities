name: Repository static baseline repair

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/fix-navis-benchmark-static-contract.yml']

permissions:
  contents: write

env:
  TARGET_BRANCH: owner/fix-navis-benchmark-static-contract
  EXPECTED_TARGET_SHA: e010b3cb993f43ab71daf6d39be27a2dd3771790

jobs:
  certify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
      - name: Apply static baseline repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              file = Path(path)
              text = file.read_text()
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: expected exactly one source block, found {text.count(old)}: {old[:100]!r}')
                  text = text.replace(old, new, 1)
              file.write_text(text)

          patch('tests/navis-tag-isonote-static.test.js', [
            (
              "const benchmarkWorkflow = readFileSync('.github/workflows/navis-tag-isonote-full-benchmark.yml', 'utf8');",
              "const benchmarkExpected = JSON.parse(readFileSync('fixtures/navis-tag-isonote/asim1836-benchmark-expected.json', 'utf8'));",
            ),
            (
              "assert.match(benchmarkWorkflow, /asim1836-benchmark-expected\\.json/);\nassert.match(benchmarkWorkflow, /Frozen benchmark verified/);",
              "assert.match(benchmarkRunner, /const expectedPath = options\\.expected \\|\\| '';/);\nassert.match(benchmarkRunner, /coverage\\.expectations = verifyExpectations/);\nassert.equal(benchmarkExpected.schema, 'navis-tag-isonote-benchmark-expectations/v1');\nassert.equal(benchmarkExpected.profileId, 'asim1836-managed-stage-2/v1');\nassert.equal(benchmarkExpected.sourceCounts.tableRows, 163);\nassert.equal(benchmarkExpected.identityTrace.resolvedCount, 163);\nassert.equal(benchmarkExpected.coordinateFrame.status, 'DISJOINT_COORDINATE_EXTENTS');\nassert.equal(benchmarkExpected.resolution.unresolvedCount, 163);",
            ),
          ])

          patch('tests/pipeline-3d-model-cad-browser-contract.test.js', [
            (
              "const workflow = readFileSync(new URL('../.github/workflows/pipeline-cad-browser-acceptance.yml', import.meta.url), 'utf8');",
              "const browserSpecCount = (config.match(/pipeline[^']*\\.spec\\.mjs/g) || []).length;",
            ),
            (
              "assert.match(workflow, /@playwright\\/test@1\\.54\\.1/);\nassert.match(workflow, /playwright install --with-deps chromium/);\nassert.match(workflow, /actions\\/upload-artifact@v4/);",
              "assert.ok(browserSpecCount >= 15);\nassert.match(config, /screenshot: 'only-on-failure'/);\nassert.match(config, /trace: 'retain-on-failure'/);\nassert.match(config, /video: 'retain-on-failure'/);\nassert.match(config, /playwright-report\\/pipeline-cad-browser/);\nassert.match(config, /test-results\\/pipeline-cad-browser/);",
            ),
          ])

          patch('tests/xml-builder-viewport-browser-contract.test.js', [
            (
              "const workflow = fs.readFileSync('.github/workflows/xml-builder-viewport-browser.yml', 'utf8');",
              "const browserEvidencePaths = ['artifacts/xml-builder-viewport-browser-results.json', 'playwright-report/xml-builder-viewport', 'test-results/xml-builder-viewport'];",
            ),
            (
              "assert.match(workflow, /XML Builder Viewport Browser Acceptance/);\nassert.match(workflow, /timeout-minutes: 30/);",
              "for (const evidencePath of browserEvidencePaths) assert.ok(config.includes(evidencePath));\nassert.match(config, /timeout: 90_000/);\nassert.match(config, /trace: 'retain-on-failure'/);\nassert.match(config, /screenshot: 'only-on-failure'/);",
            ),
          ])

          patch('tests/pipeline-3d-model-hard-051-no-fallback-static.test.js', [
            ("assert.match(propagationRuntime, /sectionPropertyAssignmentPlan/);", "assert.match(propagation, /sectionPropertyAssignmentPlan/);"),
            ("assert.match(propagationRuntime, /sectionProfileRoutingPlan/);", "assert.match(propagation, /sectionProfileRoutingPlan/);"),
            ("assert.match(propagationRuntime, /inputXmlProfileAuthorityPlan/);", "assert.match(propagation, /inputXmlProfileAuthorityPlan/);"),
          ])

          patch('tests/pipeline-3d-model-hard-051-ui-static.test.js', [
            ("assert.match(controller, /action === 'clear'/);", "assert.match(controller, /name === 'clear'/);\nassert.match(controller, /clearDraft\\(instance\\)/);"),
          ])
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Focused repaired contracts
        run: |
          node tests/navis-tag-isonote-static.test.js
          node tests/pipeline-3d-model-cad-browser-contract.test.js
          node tests/xml-builder-viewport-browser-contract.test.js
          node tests/pipeline-3d-model-hard-051-no-fallback-static.test.js
          node tests/pipeline-3d-model-hard-051-ui-static.test.js
      - name: Repository-wide validation
        id: npm_test
        continue-on-error: true
        run: |
          mkdir -p /tmp/npm-test
          npm test > /tmp/npm-test/npm-test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-static-repair-npm-test
          path: /tmp/npm-test/npm-test.log
          if-no-files-found: error
      - if: steps.npm_test.outcome != 'success'
        run: exit 1
      - name: Enforce scope and exact head
        run: |
          git diff --check
          git diff --name-only | sort > /tmp/actual
          printf '%s\n' \
            tests/navis-tag-isonote-static.test.js \
            tests/pipeline-3d-model-cad-browser-contract.test.js \
            tests/xml-builder-viewport-browser-contract.test.js \
            tests/pipeline-3d-model-hard-051-no-fallback-static.test.js \
            tests/pipeline-3d-model-hard-051-ui-static.test.js | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
      - name: Commit and push certified static repair
        run: |
          git config user.name 'Repository Baseline Owner'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/navis-tag-isonote-static.test.js \
            tests/pipeline-3d-model-cad-browser-contract.test.js \
            tests/xml-builder-viewport-browser-contract.test.js \
            tests/pipeline-3d-model-hard-051-no-fallback-static.test.js \
            tests/pipeline-3d-model-hard-051-ui-static.test.js
          git commit -m 'test: repair stale repository static contracts'
          git push origin HEAD:${TARGET_BRANCH}
