name: Navis benchmark local static contract

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/fix-navis-benchmark-static-contract.yml']

permissions:
  contents: write

env:
  TARGET_BRANCH: owner/fix-navis-benchmark-static-contract
  EXPECTED_TARGET_SHA: e010b3cb993f43ab71daf6d39be27a2dd3771790

jobs:
  certify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
      - name: Replace stale workflow dependency with local benchmark contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/navis-tag-isonote-static.test.js')
          text = path.read_text()
          replacements = [
            (
              "const benchmarkWorkflow = readFileSync('.github/workflows/navis-tag-isonote-full-benchmark.yml', 'utf8');",
              "const benchmarkExpected = JSON.parse(readFileSync('fixtures/navis-tag-isonote/asim1836-benchmark-expected.json', 'utf8'));",
            ),
            (
              "assert.match(benchmarkWorkflow, /asim1836-benchmark-expected\\.json/);\nassert.match(benchmarkWorkflow, /Frozen benchmark verified/);",
              "assert.match(benchmarkRunner, /const expectedPath = options\\.expected \\|\\| '';/);\nassert.match(benchmarkRunner, /coverage\\.expectations = verifyExpectations/);\nassert.equal(benchmarkExpected.schema, 'navis-tag-isonote-benchmark-expectations/v1');\nassert.equal(benchmarkExpected.profileId, 'asim1836-managed-stage-2/v1');\nassert.equal(benchmarkExpected.sourceCounts.tableRows, 163);\nassert.equal(benchmarkExpected.identityTrace.resolvedCount, 163);\nassert.equal(benchmarkExpected.coordinateFrame.status, 'DISJOINT_COORDINATE_EXTENTS');\nassert.equal(benchmarkExpected.resolution.unresolvedCount, 163);",
            ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one source block, found {text.count(old)}: {old[:100]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Focused Navis static contract
        run: node tests/navis-tag-isonote-static.test.js
      - name: Repository-wide validation
        id: npm_test
        continue-on-error: true
        run: |
          mkdir -p /tmp/npm-test
          npm test > /tmp/npm-test/npm-test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navis-static-contract-npm-test
          path: /tmp/npm-test/npm-test.log
          if-no-files-found: error
      - if: steps.npm_test.outcome != 'success'
        run: exit 1
      - name: Enforce scope and exact head
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = 'tests/navis-tag-isonote-static.test.js'
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
      - name: Commit and push certified static repair
        run: |
          git config user.name 'Repository Baseline Owner'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/navis-tag-isonote-static.test.js
          git commit -m 'test: align Navis benchmark static contract'
          git push origin HEAD:${TARGET_BRANCH}
