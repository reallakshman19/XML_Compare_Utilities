name: PS Family Structured Report Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run PS family tests with captured output
        id: tests
        shell: bash
        run: |
          set +e
          npm run test:ps-family > ps-family-test.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload PS family test log
        uses: actions/upload-artifact@v4
        with:
          name: ps-family-structured-report-test-log
          path: ps-family-test.log
          if-no-files-found: error
      - name: Preserve test result
        shell: bash
        run: exit "${{ steps.tests.outputs.exit_code }}"
