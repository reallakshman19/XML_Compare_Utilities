name: Final InputXML Workspace Producer Adoption Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/inputxml-workspace-final-qualification.yml'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/inputxml-workspace-producer-adoption
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run WP3 qualification
        run: |
          node --check tabs/inputxml-workspace/inputxml-workspace-producer-adoption.js
          node --check tabs/inputxml-workspace/inputxml-workspace-tab.js
          node tests/inputxml-workspace-producer-adoption.test.js
          node tests/inputxml-workspace-producer-adoption-static.test.js
          npm run test:inputxml-workspace
          git diff --check
      - name: Remove qualification workflow
        run: |
          rm .github/workflows/inputxml-workspace-final-qualification.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(inputxml): retain qualified Workspace adoption head'
          git push origin HEAD:agent/inputxml-workspace-producer-adoption
