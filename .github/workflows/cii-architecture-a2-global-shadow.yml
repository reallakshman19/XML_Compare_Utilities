name: CII A2 Global Constraint Shadow
on:
  push:
    branches:
      - test/cii-architecture-a2-shadow03-global-69-20261014
  pull_request:
    paths:
      - 'scripts/cii-architecture-a2-global-constraint-shadow.mjs'
      - 'tests/cii-architecture-a2-global-constraint-shadow.test.js'
      - '.github/workflows/cii-architecture-a2-global-shadow.yml'

permissions:
  contents: read

jobs:
  global-readonly:
    name: Bounded global physical correspondence with no writer rights
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: A2-01 additive evidence prerequisite (authentic original bytes)
        run: node tests/cii-architecture-a2-shadow-joint-evidence.test.js
      - name: A2-02 element and subdivided path factor prerequisite
        run: node tests/cii-architecture-a2-physical-path-constraints.test.js
      - name: A2-03 global bounded CSP, ambiguity, cross-source custody and original CII fixtures
        run: node tests/cii-architecture-a2-global-constraint-shadow.test.js
