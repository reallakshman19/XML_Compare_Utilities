name: Pipeline CAD Markup Foundation

on:
  pull_request:
    branches: [main]
    paths:
      - 'tabs/pipeline-3d-model/pipeline-3d-model-cad-markup-*.js'
      - 'tabs/pipeline-3d-model/pipeline-3d-model-cad-workspace.js'
      - 'tabs/pipeline-3d-model/pipeline-3d-model-table2x-canvas.js'
      - 'tabs/pipeline-3d-model/pipeline-3d-model-table3x-canvas.js'
      - 'tests/pipeline-3d-model-cad-markup-*.test.js'
      - 'tests/browser/pipeline-cad-markup-*'
      - 'playwright.pipeline-cad-markup.config.mjs'
      - '.github/workflows/pipeline-cad-markup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markup-contracts-browser-and-invariance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact checked-out SHA
        id: exact_head
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_SHA" "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
          mkdir -p artifacts/pipeline-cad-markup
          printf '{"schema":"PipelineCadMarkupExactHead.v1","expectedSha":"%s","actualSha":"%s","shaMatch":true}\n' \
            "$EXPECTED_SHA" "$actual_sha" > artifacts/pipeline-cad-markup/exact-head.json

      - name: Enforce PCAD-005A file allowlist
        id: allowlist
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          base="${BASE_SHA:-$(git merge-base HEAD origin/main)}"
          git diff --name-only "$base" "$EXPECTED_SHA" | sort > artifacts/pipeline-cad-markup/changed-files.txt
          while IFS= read -r path; do
            case "$path" in
              tabs/pipeline-3d-model/pipeline-3d-model-cad-markup-*.js|\
              tabs/pipeline-3d-model/pipeline-3d-model-cad-workspace.js|\
              tabs/pipeline-3d-model/pipeline-3d-model-table2x-canvas.js|\
              tabs/pipeline-3d-model/pipeline-3d-model-table3x-canvas.js|\
              tests/pipeline-3d-model-cad-markup-contracts.test.js|\
              tests/pipeline-3d-model-cad-markup-model.test.js|\
              tests/pipeline-3d-model-cad-markup-commands.test.js|\
              tests/pipeline-3d-model-cad-markup-reconciliation.test.js|\
              tests/pipeline-3d-model-cad-markup-integration.test.js|\
              tests/browser/pipeline-cad-markup-fixture.html|\
              tests/browser/pipeline-cad-markup.spec.mjs|\
              playwright.pipeline-cad-markup.config.mjs|\
              .github/workflows/pipeline-cad-markup.yml) ;;
              *) echo "Forbidden PCAD-005A path: $path"; exit 1 ;;
            esac
          done < artifacts/pipeline-cad-markup/changed-files.txt
          ! grep -qx 'package.json' artifacts/pipeline-cad-markup/changed-files.txt
          ! grep -qx 'package-lock.json' artifacts/pipeline-cad-markup/changed-files.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: PCAD-005A contracts and deterministic persistence
        id: focused
        run: |
          node tests/pipeline-3d-model-cad-markup-contracts.test.js
          node tests/pipeline-3d-model-cad-markup-model.test.js
          node tests/pipeline-3d-model-cad-markup-commands.test.js
          node tests/pipeline-3d-model-cad-markup-reconciliation.test.js
          node tests/pipeline-3d-model-cad-markup-integration.test.js

      - name: PCAD-001 lifecycle regression
        run: node tests/pipeline-3d-model-cad-lifecycle-integration.test.js

      - name: PCAD-002 Object Snap regression
        run: node tests/pipeline-3d-model-cad-object-snap-integration.test.js

      - name: PCAD-003 precision contracts
        run: node tests/pipeline-3d-model-cad-precision-contracts.test.js

      - name: PCAD-003 precision parser
        run: node tests/pipeline-3d-model-cad-precision-parser.test.js

      - name: PCAD-003 precision adapters
        run: node tests/pipeline-3d-model-cad-precision-adapters.test.js

      - name: PCAD-003 precision integration baseline audit
        id: precision_integration
        shell: bash
        run: |
          set +e
          node tests/pipeline-3d-model-cad-precision-integration.test.js \
            > artifacts/pipeline-cad-markup/pcad-003-precision-integration.log 2>&1
          status=$?
          set -e
          cat artifacts/pipeline-cad-markup/pcad-003-precision-integration.log
          if (( status == 0 )); then
            printf '{"schema":"PipelineCadBaselineException.v1","test":"PCAD-003 precision integration","status":"PASS"}\n' \
              > artifacts/pipeline-cad-markup/pcad-003-baseline.json
            exit 0
          fi
          grep -Eq 'pipeline-3d-model-cad-precision-integration.test.js:(145|148|149):' \
            artifacts/pipeline-cad-markup/pcad-003-precision-integration.log
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'));
          const testSource = readFileSync('tests/pipeline-3d-model-cad-precision-integration.test.js', 'utf8');
          const browserConfig = readFileSync('playwright.pipeline-cad.config.mjs', 'utf8');
          assert.doesNotMatch(browserConfig, /pipeline-cad-precision\.spec\.mjs/);
          assert.equal(packageJson.scripts['test:pipeline-cad-precision'], undefined);
          assert.doesNotMatch(packageJson.scripts['test:static'], /test:pipeline-cad-precision/);
          assert.match(testSource, /pipeline-cad-precision\.spec\.mjs/);
          assert.match(testSource, /packageJson\.scripts\['test:pipeline-cad-precision'\]/);
          assert.match(testSource, /packageJson\.scripts\['test:static'\]/);
          writeFileSync('artifacts/pipeline-cad-markup/pcad-003-baseline.json', `${JSON.stringify({
            schema: 'PipelineCadBaselineException.v1',
            test: 'tests/pipeline-3d-model-cad-precision-integration.test.js',
            status: 'CURRENT_MAIN_STALE_REGISTRATION_GUARDS',
            protectedFilesModified: false,
            staleAssertions: [145, 148, 149],
            semanticPrecisionGates: ['contracts', 'parser', 'adapters', 'direct Chromium certification'],
          }, null, 2)}\n`);
          NODE

      - name: PCAD-004R selection and atomic batch regressions
        id: pcad_regressions
        run: |
          node tests/pipeline-3d-model-cad-selection-contracts.test.js
          node tests/pipeline-3d-model-cad-batch-commands.test.js
          node tests/pipeline-3d-model-cad-multi-selection-integration.test.js
          node tests/pipeline-3d-model-cad-current-authority-regression.test.js

      - name: Profile bend InputXML and Pipeline SVG parity gates
        id: authority
        run: |
          node tests/pipeline-3d-model-profile-propagation.test.js
          node tests/pipeline-3d-model-elastic-bend.test.js
          node tests/pipeline-engineering-svg-dual-ledger-marker-invariance.test.js
          node tests/pipeline-engineering-svg-parity.test.js

      - name: Production and test JavaScript syntax
        id: syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check tabs/pipeline-3d-model/pipeline-3d-model-cad-markup-contracts.js
          node --check tabs/pipeline-3d-model/pipeline-3d-model-cad-markup-model.js
          node --check tabs/pipeline-3d-model/pipeline-3d-model-cad-markup-commands.js
          node --check tabs/pipeline-3d-model/pipeline-3d-model-cad-markup-reconciliation.js
          node --check tabs/pipeline-3d-model/pipeline-3d-model-cad-markup-renderer.js
          node --check tabs/pipeline-3d-model/pipeline-3d-model-cad-markup-view.js
          node --check tabs/pipeline-3d-model/pipeline-3d-model-cad-workspace.js
          node --check tabs/pipeline-3d-model/pipeline-3d-model-table2x-canvas.js
          node --check tabs/pipeline-3d-model/pipeline-3d-model-table3x-canvas.js
          node --check tests/browser/pipeline-cad-markup.spec.mjs
          node --check playwright.pipeline-cad-markup.config.mjs
          node tests/startup-module-syntax.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: PCAD-003 precision Chromium direct certification
        shell: bash
        run: |
          cat > artifacts/pipeline-cad-markup/playwright.pcad003.config.mjs <<'CONFIG'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir: '../../tests/browser',
            testMatch: 'pipeline-cad-precision.spec.mjs',
            timeout: 45_000,
            expect: { timeout: 8_000 },
            fullyParallel: false,
            workers: 1,
            retries: 0,
            outputDir: '../../test-results/pipeline-cad-precision-direct',
            reporter: [['list'], ['json', { outputFile: 'precision-browser-results.json' }]],
            use: {
              baseURL: 'http://127.0.0.1:4173',
              browserName: 'chromium',
              viewport: { width: 1440, height: 1100 },
              screenshot: 'only-on-failure',
              trace: 'retain-on-failure',
            },
            webServer: {
              command: 'cd ../.. && python3 -m http.server 4173 --bind 127.0.0.1',
              url: 'http://127.0.0.1:4173/tests/browser/pipeline-cad-precision-fixture.html',
              reuseExistingServer: false,
              timeout: 120_000,
            },
          });
          CONFIG
          npx playwright test --config=artifacts/pipeline-cad-markup/playwright.pcad003.config.mjs

      - name: PCAD-005A-B01
        run: npx playwright test --config=playwright.pipeline-cad-markup.config.mjs --grep 'PCAD-005A-B01'
      - name: PCAD-005A-B02
        run: npx playwright test --config=playwright.pipeline-cad-markup.config.mjs --grep 'PCAD-005A-B02'
      - name: PCAD-005A-B03
        run: npx playwright test --config=playwright.pipeline-cad-markup.config.mjs --grep 'PCAD-005A-B03'
      - name: PCAD-005A-B04
        run: npx playwright test --config=playwright.pipeline-cad-markup.config.mjs --grep 'PCAD-005A-B04'
      - name: PCAD-005A-B05
        run: npx playwright test --config=playwright.pipeline-cad-markup.config.mjs --grep 'PCAD-005A-B05'
      - name: PCAD-005A-B06
        run: npx playwright test --config=playwright.pipeline-cad-markup.config.mjs --grep 'PCAD-005A-B06'
      - name: PCAD-005A-B07
        run: npx playwright test --config=playwright.pipeline-cad-markup.config.mjs --grep 'PCAD-005A-B07'
      - name: PCAD-005A-B08
        run: npx playwright test --config=playwright.pipeline-cad-markup.config.mjs --grep 'PCAD-005A-B08'
      - name: PCAD-005A-B09
        run: npx playwright test --config=playwright.pipeline-cad-markup.config.mjs --grep 'PCAD-005A-B09'
      - name: PCAD-005A-B10
        run: npx playwright test --config=playwright.pipeline-cad-markup.config.mjs --grep 'PCAD-005A-B10'
      - name: PCAD-005A-B11
        run: npx playwright test --config=playwright.pipeline-cad-markup.config.mjs --grep 'PCAD-005A-B11'
      - name: PCAD-005A-B12
        run: npx playwright test --config=playwright.pipeline-cad-markup.config.mjs --grep 'PCAD-005A-B12'
      - name: PCAD-005A-B13
        run: npx playwright test --config=playwright.pipeline-cad-markup.config.mjs --grep 'PCAD-005A-B13'
      - name: PCAD-005A-B14
        run: npx playwright test --config=playwright.pipeline-cad-markup.config.mjs --grep 'PCAD-005A-B14'
      - name: PCAD-005A-B15
        run: npx playwright test --config=playwright.pipeline-cad-markup.config.mjs --grep 'PCAD-005A-B15'
      - name: PCAD-005A-B16
        run: npx playwright test --config=playwright.pipeline-cad-markup.config.mjs --grep 'PCAD-005A-B16'

      - name: Startup smoke
        id: startup
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pcad-005a-startup.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node tests/browser/xml-compare-startup-smoke.mjs

      - name: Full repository tests
        id: full_repository
        run: npm test

      - name: Upload exact-head markup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-cad-markup-${{ env.EXPECTED_SHA }}
          path: |
            artifacts/pipeline-cad-markup
            test-results/pipeline-cad-markup
            /tmp/pcad-005a-startup.log
          if-no-files-found: error
          retention-days: 90
