name: CII P3.1 common-analysis projection qualification

on:
  push:
    branches:
      - validation/cii-common-analysis-projection-1319
  workflow_dispatch:

jobs:
  qualify-p3-1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Guard exact P3.1 product
        shell: bash
        run: |
          set -euo pipefail
          BASE=c1998df47e4183e6d54c30555cbc022742ffebc5
          PRODUCT=d3a468bd56e67c6ac84c7bbe004bfd35ad50f67f

          test "$(git diff --name-only "$PRODUCT"...HEAD | sort)" = ".github/workflows/cii-common-analysis-projection-1319.yml"

          expected="$(printf '%s\n' \
            'agents/WIP-1319-common-analysis-projection_workreport.md' \
            'tabs/cii-workspace/cii-workspace-core.js' \
            'tests/cii-workspace-common-analysis-projection.test.js' | sort)"
          test "$(git diff --name-only "$BASE" "$PRODUCT" | sort)" = "$expected"

          test "$(git rev-parse "$PRODUCT:tabs/cii-workspace/cii-workspace-core.js")" = "c7550892ca886a56754f5c612dc5c270a02844a2"
          test "$(git rev-parse "$PRODUCT:tests/cii-workspace-common-analysis-projection.test.js")" = "6d79df9acf458fd7cce97f4636159e2619d72788"
          test "$(git rev-parse "$PRODUCT:agents/WIP-1319-common-analysis-projection_workreport.md")" = "9dfff74ba64dca7c19511b65707cc68c8d500964"

          if git diff --name-only "$BASE" "$PRODUCT" -- Benchmark tabs/cii-workspace/cii-workspace-writer-version-bridge.js tabs/cii-workspace/cii-workspace-source-set.js tabs/cii-workspace/cii-workspace-multisource-preview.js tabs/cii-workspace/cii-workspace-multisource-writer2-ui.js | grep -q .; then
            echo "P3.1 scope violation"
            exit 1
          fi
          echo "P3_1_EXACT_PRODUCT_GUARD_PASS"

      - name: Install dependencies
        run: npm ci

      - name: Syntax
        run: |
          node --check tabs/cii-workspace/cii-workspace-core.js
          node --check tests/cii-workspace-common-analysis-projection.test.js

      - name: Run focused common-analysis split
        run: node tests/cii-workspace-common-analysis-projection.test.js

      - name: Run legacy writer/preview regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/cii-workspace-benchmark-writer-1a.test.js
          node tests/cii-workspace-benchmark-writer-1b.test.js
          node tests/cii-workspace-writer2-restraint-product-real-cii.test.js

      - name: Run retained multisource full-proof regression
        run: node tests/cii-workspace-multisource-retained-auto-anchor-benchmark.test.js
