name: Workbench3D TableXML Guarded Patch

on:
  push:
    branches: [agent/workbench3d-tablexml-audit-fix]
    paths:
      - 'scripts/workbench3d-tablexml-workpack-patch.py'
      - '.github/workflows/workbench3d-tablexml-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Work Pack branch
        uses: actions/checkout@v4
        with:
          ref: agent/workbench3d-tablexml-audit-fix
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Apply exact patch
        run: |
          python -m py_compile scripts/workbench3d-tablexml-workpack-patch.py
          python scripts/workbench3d-tablexml-workpack-patch.py
      - name: Syntax and focused authority checks
        run: |
          node --check workbench3d/tablexml/tablexml-diagnostics.js
          node --check workbench3d/tablexml/nodeset-builder.js
          node --check workbench3d/ui/table-to-xml-diagnostics-view.js
          node --check workbench3d/ui/table-to-xml-tab.js
          node --check tests/workbench3d-tablexml-authority.test.js
          node tests/workbench3d-tablexml-authority.test.js
          node tests/workbench3d-tablexml.test.js
          node tests/workbench3d-profiles.test.js
      - name: Full Workbench3D suite
        run: npm run test:workbench3d
      - name: Commit audited UI and remove scaffolding
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workbench3d/ui/table-to-xml-tab.js
          git rm -f scripts/workbench3d-tablexml-workpack-patch.py .github/workflows/workbench3d-tablexml-patch.yml
          git diff --cached --check
          git commit -m "fix: expose Workbench3D NodeSet authority diagnostics"
          git push origin HEAD:agent/workbench3d-tablexml-audit-fix
