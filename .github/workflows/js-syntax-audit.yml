name: JavaScript Syntax Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check production JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find core tabs -type f -name '*.js' -print0 \
            | sort -z \
            | while IFS= read -r -d '' file; do
                echo "Checking $file"
                node --check "$file"
              done
