name: JavaScript Syntax Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
      - name: Verify exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check production JavaScript syntax
        shell: bash
        run: |
          set -uo pipefail
          : > syntax-error.txt
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            if ! node --check "$file" > syntax-check.out 2>&1; then
              {
                echo "FAILING_FILE=$file"
                cat syntax-check.out
              } | tee syntax-error.txt
              exit 1
            fi
          done < <(find core tabs -type f -name '*.js' -print0 | sort -z)
      - name: Publish syntax failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-syntax-audit-${{ env.EXPECTED_SHA }}
          path: syntax-error.txt
          if-no-files-found: error
