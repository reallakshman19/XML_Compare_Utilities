name: Qualify Workbench3D Imported InputXML Review Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/workbench3d-imported-inputxml-review-bootstrap.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/workbench3d-imported-inputxml-review
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply exact Workbench3D integration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('workbench3d/ui/workbench3d-tab.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "import { parseInputXmlRecords, XML_SCHEMA_KINDS } from '../adapters/inputxml-adapter.js';\n",
              "import { parseInputXmlRecords, XML_SCHEMA_KINDS } from '../adapters/inputxml-adapter.js';\n"
              "import {\n"
              "  closeImportedInputXmlReviewRuntime, createImportedInputXmlReviewCollection,\n"
              "  importedInputXmlReviewReceiptJson, importedInputXmlReviewText, scheduleImportedInputXmlReview,\n"
              "} from './imported-inputxml-review.js';\n",
              'review imports',
          )

          replace_once(
              "      sourceXml: '', targetXml: '', sourceName: '', targetName: '',\n",
              "      sourceXml: '', targetXml: '', sourceName: '', targetName: '',\n"
              "      importedInputXmlReview: createImportedInputXmlReviewCollection(),\n",
              'review state',
          )

          helper_anchor = "function markerOptionsFromSettings(settings) {"
          helpers = r'''function importedInputXmlReviewSource(state, side) {
  const sourceSide = side === 'target' ? 'target' : 'source';
  return Object.freeze({
    side: sourceSide,
    text: String(sourceSide === 'source' ? state.sourceXml : state.targetXml),
    filename: String(sourceSide === 'source' ? state.sourceName : state.targetName)
      || `${sourceSide}-pasted.input.xml`,
  });
}

function importedInputXmlReviewDownloadName(state, side, suffix) {
  const source = importedInputXmlReviewSource(state, side);
  const stem = source.filename.replace(/\.(xml|txt)$/i, '').replace(/[^A-Za-z0-9._-]+/g, '_')
    || `${source.side}-imported`;
  return `${stem}.${suffix}`;
}

function importedInputXmlReviewControlsHtml(state, side) {
  const source = importedInputXmlReviewSource(state, side);
  const review = state.importedInputXmlReview?.[side]
    ?? createImportedInputXmlReviewCollection()[side];
  const reviewText = importedInputXmlReviewText(source, review);
  const cls = review.status === 'PASS' ? 'is-ok' : review.status === 'FAILED' ? 'is-bad' : '';
  const message = review.status === 'PASS'
    ? `Validated companion: ${Number(review.result?.summary?.categorizedElements || 0)} categorized element(s).`
    : review.diagnostic?.message || (review.status === 'RUNNING'
      ? 'Generating read-only categorized review companion…'
      : 'Load or paste genuine CAESAR InputXML to generate a categorized review companion.');
  const receiptDisabled = review.status === 'IDLE' ? 'disabled' : '';
  const reviewDisabled = reviewText ? '' : 'disabled';
  return `<div class="wb3d-import-review" data-wb3d-import-review="${side}">
    <div><span class="wb3d-badge ${cls}">Categorized Review: ${esc(review.status)}</span>
      <span class="wb3d-muted">${esc(message)}</span></div>
    <div class="wb3d-toolbar">
      <button class="wb3d-btn" data-action="download-imported-inputxml-review" data-side="${side}" ${reviewDisabled}>Download review</button>
      <button class="wb3d-btn" data-action="download-imported-inputxml-review-receipt" data-side="${side}" ${receiptDisabled}>Download receipt</button>
    </div>
  </div>`;
}

function refreshImportedInputXmlReviewControls(container, state, side) {
  const host = container.querySelector(`[data-wb3d-import-review="${side}"]`);
  if (host) host.outerHTML = importedInputXmlReviewControlsHtml(state, side);
}

function scheduleWorkbenchImportedInputXmlReview(container, state, side, delayMs = 450) {
  const source = importedInputXmlReviewSource(state, side);
  return scheduleImportedInputXmlReview({
    container,
    state,
    side,
    text: source.text,
    filename: source.filename,
    delayMs,
    onChange: () => refreshImportedInputXmlReviewControls(container, state, side),
  });
}

'''
          replace_once(helper_anchor, helpers + helper_anchor, 'review helpers')

          replace_once(
              "        ${schemaBadge('Detected', 'source', state.sourceXml)} ${state.sourceName ? `<span class=\"wb3d-muted\">${esc(state.sourceName)}</span>` : ''}\n"
              "        <textarea data-field=\"sourceXml\"",
              "        ${schemaBadge('Detected', 'source', state.sourceXml)} ${state.sourceName ? `<span class=\"wb3d-muted\">${esc(state.sourceName)}</span>` : ''}\n"
              "        ${importedInputXmlReviewControlsHtml(state, 'source')}\n"
              "        <textarea data-field=\"sourceXml\"",
              'source review controls',
          )
          replace_once(
              "        ${schemaBadge('Detected', 'target', state.targetXml)} ${state.targetName ? `<span class=\"wb3d-muted\">${esc(state.targetName)}</span>` : ''}\n"
              "        <textarea data-field=\"targetXml\"",
              "        ${schemaBadge('Detected', 'target', state.targetXml)} ${state.targetName ? `<span class=\"wb3d-muted\">${esc(state.targetName)}</span>` : ''}\n"
              "        ${importedInputXmlReviewControlsHtml(state, 'target')}\n"
              "        <textarea data-field=\"targetXml\"",
              'target review controls',
          )

          replace_once(
              "    const field = event.target.dataset?.field;\n    if (field) s[field] = event.target.value;",
              "    const field = event.target.dataset?.field;\n"
              "    if (field) {\n"
              "      s[field] = event.target.value;\n"
              "      if (field === 'sourceXml' || field === 'targetXml') {\n"
              "        const side = field === 'sourceXml' ? 'source' : 'target';\n"
              "        void scheduleWorkbenchImportedInputXmlReview(container, s, side);\n"
              "      }\n"
              "    }",
              'paste review scheduling',
          )

          old_file = r'''    const text = await file.text();
    if (event.target.dataset.side === 'source') { s.sourceXml = text; s.sourceName = file.name; }
    else { s.targetXml = text; s.targetName = file.name; }
    s.status = `Loaded ${file.name} (${Math.round(text.length / 1024)} KB) as ${event.target.dataset.side}.`;
    renderView(container, s);
'''
          new_file = r'''    const text = await file.text();
    const side = event.target.dataset.side === 'source' ? 'source' : 'target';
    if (side === 'source') { s.sourceXml = text; s.sourceName = file.name; }
    else { s.targetXml = text; s.targetName = file.name; }
    s.status = `Loaded ${file.name} (${Math.round(text.length / 1024)} KB) as ${side}.`;
    renderView(container, s);
    void scheduleWorkbenchImportedInputXmlReview(container, s, side, 0);
'''
          replace_once(old_file, new_file, 'file review scheduling')

          replace_once(
              "    const action = btn.dataset.action;\n\n    if (action === 'run-compare') rerunCompare();",
              "    const action = btn.dataset.action;\n\n"
              "    if (action === 'download-imported-inputxml-review') {\n"
              "      const side = btn.dataset.side === 'target' ? 'target' : 'source';\n"
              "      const source = importedInputXmlReviewSource(state, side);\n"
              "      const text = importedInputXmlReviewText(source, state.importedInputXmlReview?.[side]);\n"
              "      if (text) downloadFile(importedInputXmlReviewDownloadName(state, side, 'categorized-review.xml'), text, 'application/xml;charset=utf-8');\n"
              "      return;\n"
              "    }\n"
              "    if (action === 'download-imported-inputxml-review-receipt') {\n"
              "      const side = btn.dataset.side === 'target' ? 'target' : 'source';\n"
              "      const source = importedInputXmlReviewSource(state, side);\n"
              "      const receipt = importedInputXmlReviewReceiptJson(source, state.importedInputXmlReview?.[side]);\n"
              "      downloadFile(importedInputXmlReviewDownloadName(state, side, 'categorized-review-receipt.json'), receipt, 'application/json;charset=utf-8');\n"
              "      return;\n"
              "    }\n\n"
              "    if (action === 'run-compare') rerunCompare();",
              'review downloads',
          )

          replace_once(
              "          renderView(container, state);\n          rerunCompare();\n",
              "          renderView(container, state);\n"
              "          void scheduleWorkbenchImportedInputXmlReview(container, state, 'source', 0);\n"
              "          void scheduleWorkbenchImportedInputXmlReview(container, state, 'target', 0);\n"
              "          rerunCompare();\n",
              'revision NodeSet exclusion',
          )

          replace_once(
              "        renderView(container, state);\n        if (bothLoaded) rerunCompare();\n",
              "        renderView(container, state);\n"
              "        void scheduleWorkbenchImportedInputXmlReview(container, state, tx.active, 0);\n"
              "        if (bothLoaded) rerunCompare();\n",
              'table NodeSet exclusion',
          )

          replace_once(
              "  return () => {\n    state.viewer?.dispose();",
              "  return () => {\n    closeImportedInputXmlReviewRuntime(container);\n    state.viewer?.dispose();",
              'review teardown',
          )

          path.write_text(text, encoding='utf-8')

          package_path = Path('package.json')
          package_text = package_path.read_text(encoding='utf-8')
          old = '"test:workbench3d": "node tests/workbench3d-contracts.test.js'
          new = '"test:workbench3d": "node tests/workbench3d-imported-inputxml-review.test.js && node tests/workbench3d-imported-inputxml-review-static.test.js && node tests/workbench3d-contracts.test.js'
          if package_text.count(old) != 1:
              raise SystemExit('test:workbench3d package anchor mismatch')
          package_path.write_text(package_text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/workbench3d-imported-inputxml-review-bootstrap.yml').unlink()
          PY

      - name: Run WP4 qualification
        run: |
          node --check workbench3d/ui/imported-inputxml-review.js
          node --check workbench3d/ui/workbench3d-tab.js
          node tests/workbench3d-imported-inputxml-review.test.js
          node tests/workbench3d-imported-inputxml-review-static.test.js
          npm run test:workbench3d
          npm run test:inputxml-workspace
          git diff --check

      - name: Commit qualified integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(workbench3d): adopt imported InputXML categorized review'
          git push origin HEAD:agent/workbench3d-imported-inputxml-review
