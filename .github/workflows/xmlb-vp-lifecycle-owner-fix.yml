name: XMLB VP Lifecycle Owner Fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/xmlb-vp-lifecycle-owner-fix.yml'

permissions:
  contents: write

jobs:
  move-lifecycle-to-tab-owner:
    if: github.head_ref == 'agent/xmlb-vp-001-workbench-viewport'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xmlb-vp-001-workbench-viewport
      - name: Apply explicit XML Compare tab ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tab = Path('tabs/xml-compare-tab.js')
          source = tab.read_text()
          anchor = "import { bytes, renderXmlCompareTabView } from '../xml-compare/XmlCompareTabView.js?v=20260704-transfer-review-1';\n"
          addition = anchor + "import { installUniversalXmlCategorizerRuntime } from './xml-compare-universal-categorizer-runtime.js';\nimport { publishUniversalViewportContext } from '../xml-compare/universal-categorizer/universal-viewport-context.js';\n"
          if addition not in source:
              source = source.replace(anchor, addition)
          old_render = "function render(container, state) { const saved = captureRenderState(container), workspace = workspaceFromState(state); container.innerHTML = renderXmlCompareTabView({ state, workspace, issues: filteredIssues(state.report, state) });"
          new_render = "function render(container, state) { const saved = captureRenderState(container), workspace = workspaceFromState(state); publishUniversalViewportContext(document, { state, workspace }); container.innerHTML = renderXmlCompareTabView({ state, workspace, issues: filteredIssues(state.report, state) });"
          source = source.replace(old_render, new_render)
          old_mount = "export function renderXmlCompareTab(container) { const state = createInitialState(), ctrl = new AbortController(); consumePendingExternalLoad(state); render(container, state); bind(container, state, ctrl.signal); return () => { cancelLinewiseProducerRun(state, 'tab-unmount'); state.linewiseWorkerClient?.close?.(); state.linewiseWorkerClient = null; ctrl.abort(); container.innerHTML = ''; }; }"
          new_mount = "export function renderXmlCompareTab(container) { const state = createInitialState(), ctrl = new AbortController(), universalCategorizerRuntime = installUniversalXmlCategorizerRuntime(document); consumePendingExternalLoad(state); render(container, state); bind(container, state, ctrl.signal); return () => { cancelLinewiseProducerRun(state, 'tab-unmount'); state.linewiseWorkerClient?.close?.(); state.linewiseWorkerClient = null; universalCategorizerRuntime?.destroy?.(); ctrl.abort(); container.innerHTML = ''; }; }"
          if old_mount not in source:
              raise SystemExit('renderXmlCompareTab ownership anchor not found')
          source = source.replace(old_mount, new_mount)
          tab.write_text(source)

          view = Path('xml-compare/XmlCompareTabView.js')
          source = view.read_text()
          source = source.replace("import { publishUniversalViewportContext } from './universal-categorizer/universal-viewport-context.js';\n", '')
          source = source.replace("export function renderXmlCompareTabView({ state, workspace, issues }) { publishUniversalViewportContext(globalThis.document, { state, workspace }); return ", "export function renderXmlCompareTabView({ state, workspace, issues }) { return ")
          view.write_text(source)

          runtime = Path('tabs/xml-compare-universal-categorizer-runtime.js')
          source = runtime.read_text()
          source = source.replace("\ninstallUniversalXmlCategorizerRuntime();\n", '\n')
          runtime.write_text(source)
          PY
          rm -f .github/workflows/xmlb-vp-lifecycle-owner-fix.yml
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: move XML Builder viewport lifecycle to XML Compare tab'
          git push origin HEAD:agent/xmlb-vp-001-workbench-viewport
