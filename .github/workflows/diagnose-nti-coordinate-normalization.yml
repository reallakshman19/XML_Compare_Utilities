name: Diagnose NTI Coordinate Normalization

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner/nti-coordinate-normalization
      - name: Capture patch output
        continue-on-error: true
        run: |
          mkdir -p artifacts
          python scripts/run-nti-coordinate-normalization.py > artifacts/patch.log 2>&1
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nti-coordinate-patch-diagnostic
          path: artifacts
          if-no-files-found: error
