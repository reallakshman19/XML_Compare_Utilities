name: Sequential Sketcher Cross-Domain Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'tabs/sequential-sketcher/**'
      - 'docs/sequential-sketcher/**'
      - 'tests/sequential-sketcher-*.test.js'
      - 'tests/sequential-sketcher-1885-nc-blocked-evidence.mjs'
      - 'tests/helpers/sequential-1885-nc-evidence-report.js'
      - 'tests/fixtures/sequential-sketcher/**'
      - '.github/workflows/sequential-sketcher*.yml'

permissions:
  contents: read

jobs:
  support-steel:
    name: Support Steel Relationship Builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/combined-staged-model-input.test.js
      - run: node --test tests/support-steel-relationship-builder.test.js
      - run: node --test tests/support-steel-world-geometry.test.js
      - run: node --test tests/support-member-chain.test.js tests/support-member-chain-policy.test.js
      - run: node --test tests/support-carrier-resolution.test.js
      - run: node --test tests/support-carrier-attachment-geometry.test.js
      - run: node --test tests/support-carrier-topology.test.js
      - run: node --test tests/support-carrier-to-structure-path.test.js
      - run: node --test tests/support-restraint-function.test.js
      - run: node tests/support-restraint-function-ui.test.js
      - run: node tests/support-steel-relationship-builder-ui.test.js

  ps-native:
    name: PS Family Native and Restraint Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/combined-staged-model-input.test.js
      - run: node --test tests/ps-family-native-audit-pipeline.test.js
      - run: node --test tests/ps-family-native-carrier-resolution.test.js
      - run: node --test tests/support-carrier-attachment-geometry.test.js
      - run: node --test tests/support-carrier-topology.test.js
      - run: node --test tests/support-carrier-to-structure-path.test.js
      - run: node --test tests/support-restraint-function.test.js
      - run: node --test tests/ps-family-native-carrier-topology.test.js
      - run: node --test tests/ps-family-native-carrier-to-structure-path.test.js
      - run: node --test tests/ps-family-native-restraint-function.test.js
      - run: node tests/support-restraint-function-ui.test.js
      - run: node tests/ps-family-native-audit-pipeline-ui.test.js
      - run: node tests/ps-family-implementation-compliance.test.js
      - run: node --test tests/support-steel-relationship-builder.test.js tests/ps-family-evidence-graph-audit.test.js

  ps-graph-offline:
    name: PS Family Graph and Offline Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ps-family-evidence-graph-audit.test.js
      - run: node --test tests/ps-family-multiline-projection.test.js
      - run: node tests/ps-family-clash-audit-config.test.js
      - run: node tests/ps-family-clash-audit-ui-smoke.test.js
      - run: node tests/ps-family-accessibility-gate.test.js
      - run: node tests/ps-family-psclash-report.test.js
      - run: node tests/ps-family-implementation-compliance.test.js
      - run: node tests/ps-family-readiness.test.js
      - run: node tests/ps-family-output-fixtures.test.js
      - run: node tests/ps-family-clash-audit-benchmark-readiness.test.js
      - run: node --test tests/ps-family-offline-validation-benchmark.test.js
      - run: node tests/ps-family-offline-validation-ui.test.js

  ps-clash:
    name: PS Family Clash Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node tests/ps-family-clash-audit.test.js
      - run: node tests/ps-family-clash-audit-config.test.js
      - run: node tests/ps-family-clash-audit-ui-smoke.test.js
      - run: node tests/ps-family-output-fixtures.test.js
      - run: node tests/ps-family-performance-benchmark.test.js
      - run: node tests/ps-family-accessibility-gate.test.js
      - run: node tests/ps-family-implementation-compliance.test.js
      - run: node tests/ps-family-sample-fixtures.test.js
      - run: node tests/ps-family-sample-buttons.test.js
      - run: node tests/ps-family-report-filter-search.test.js
      - run: node tests/ps-family-active-report-export.test.js
      - run: node tests/ps-family-row-details.test.js
      - run: node tests/ps-family-hierarchy-tab.test.js
      - run: node tests/ps-family-tabbed-workspace-ui.test.js
      - run: node tests/ps-family-psclash-report.test.js
      - run: node tests/ps-family-readiness.test.js
      - run: node tests/ps-family-clash-audit-benchmark-readiness.test.js
