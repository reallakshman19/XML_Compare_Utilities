name: CII Find Replace Smart Fixed Width Build

on:
  push:
    branches:
      - feature/ciifr-smart-semantic-fixed-width

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ciifr-smart-semantic-fixed-width
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Patch smart semantic fixed-width support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one exact anchor, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          # Reuse the existing NODENAME field/ownership authority across the whole document
          # without changing the specialized exact-element NODENAME resolver.
          p = Path('tabs/cii-workspace/cii-workspace-find-replace-nodename-scope.js')
          text = p.read_text()
          anchor = 'export function resolveNodeNameScope(lines, operation, helpers) {'
          if text.count(anchor) != 1:
              raise SystemExit('nodename scope anchor mismatch')
          addition = r'''function allNodeNameSpans(context) {
  const spans = []; const blockers = [];
  for (let pointer = 1; pointer <= context.refs.length; pointer += 1) {
    const ref = context.refs[pointer - 1];
    const from = asciiField(
      ref, pointer, 'FROM', NODENAME_FROM_START, NODENAME_TO_START,
      context.owners.get(ownerKey(pointer, 'FROM')),
    );
    const to = asciiField(
      ref, pointer, 'TO', NODENAME_TO_START, NODENAME_ROW_END,
      context.owners.get(ownerKey(pointer, 'TO')),
    );
    if (from.status !== 'PASS') blockers.push(from.blocker); else spans.push(from.span);
    if (to.status !== 'PASS') blockers.push(to.blocker); else spans.push(to.span);
  }
  return blockers.length
    ? { status: 'BLOCKED', blockers: Object.freeze(blockers), spans: Object.freeze([]) }
    : { status: 'PASS', blockers: Object.freeze([]), spans: Object.freeze(spans) };
}

export function resolveDocumentNodeNameScope(lines, helpers) {
  const context = nodeNameContext(lines, helpers);
  if (context.status !== 'PASS') return context;
  const selected = allNodeNameSpans(context);
  if (selected.status !== 'PASS') return selected;
  return Object.freeze({
    status: 'PASS', scope: 'DOCUMENT', block: 'NODENAME', fieldAware: true,
    authority: 'CII_V14_DOCUMENT_NODENAME_FIXED_FIELDS', spans: selected.spans,
    evidence: Object.freeze({
      rowCount: context.count, mutableFieldCount: selected.spans.length,
      fromWidth: NODENAME_TO_START - NODENAME_FROM_START,
      toWidth: NODENAME_ROW_END - NODENAME_TO_START,
      serializer: 'AUTO_RIGHT_PAD_FIXED_WIDTH',
    }),
    blockers: Object.freeze([]),
  });
}

'''
          p.write_text(text.replace(anchor, addition + anchor, 1))

          # Add an opt-in smart DOCUMENT semantic resolution path.
          replace_once(
              'tabs/cii-workspace/cii-workspace-find-replace-scope-resolver.js',
              "import { resolveNodeNameScope } from './cii-workspace-find-replace-nodename-scope.js';",
              "import { resolveDocumentNodeNameScope, resolveNodeNameScope } from './cii-workspace-find-replace-nodename-scope.js';",
          )
          replace_once(
              'tabs/cii-workspace/cii-workspace-find-replace-scope-resolver.js',
              "  if (scope === 'DOCUMENT') {\n    return Object.freeze({ status: 'PASS', scope, authority: 'TARGET0_PHYSICAL_LINE_BODIES', spans: documentSpans(lines), evidence: Object.freeze({ lineCount: lines.length }), blockers: Object.freeze([]) });\n  }",
              "  if (scope === 'DOCUMENT') {\n    if (options.smartFixedWidth === 'NODENAME') {\n      return resolveDocumentNodeNameScope(lines, { sectionRefs, elementBlocks, exactElementBlock });\n    }\n    return Object.freeze({ status: 'PASS', scope, authority: 'TARGET0_PHYSICAL_LINE_BODIES', spans: documentSpans(lines), evidence: Object.freeze({ lineCount: lines.length }), blockers: Object.freeze([]) });\n  }",
          )

          # Validator: unequal-length DOCUMENT input first tries exact semantic NODENAME fields.
          p = Path('tabs/cii-workspace/cii-workspace-find-replace-validator.js')
          text = p.read_text()
          helper_anchor = "function overlapBlockers(claims) {"
          if text.count(helper_anchor) != 1:
              raise SystemExit('validator helper anchor mismatch')
          helper = r'''function smartDocumentNodeNamePlan(target0, operation, findText, replaceText, sequence) {
  const resolution = resolveFindReplaceScope(target0, operation, {
    fieldAwareMutation: true,
    smartFixedWidth: 'NODENAME',
  });
  if (resolution?.status !== 'PASS') return null;
  const plan = nodeNameClaimPlan(target0, findText, replaceText, resolution.spans, sequence, resolution);
  if (!plan.matches.length) return null;
  const blockers = [...plan.blockers];
  if (asciiLength(findText) == null || asciiLength(replaceText) == null) blockers.unshift('NODENAME_ASCII_TEXT_REQUIRED');
  return Object.freeze({
    resolution,
    matches: Object.freeze([...plan.matches]),
    claims: Object.freeze([...plan.claims]),
    blockers: Object.freeze([...new Set(blockers)]),
  });
}

'''
          text = text.replace(helper_anchor, helper + helper_anchor, 1)
          pattern = re.compile(
              r"    const nodeName = isNodeNameOperation\(operation\);.*?"
              r"(?=    if \(!operationBlockers\.length && matches\.length === 0\))",
              re.S,
          )
          replacement = r'''    const nodeName = isNodeNameOperation(operation);
    const scopeToken = String(operation?.scope || 'DOCUMENT').trim().toUpperCase();
    const fieldScoped = scopeToken === 'ELEMENT' || (scopeToken === 'BLOCK' && !nodeName);
    const findBytes = byteLength(findText); const replaceBytes = byteLength(replaceText);
    const unequalFixedWidth = requireEqualByteLength && findBytes != null && replaceBytes != null && findBytes !== replaceBytes;
    const operationBlockers = [];
    if (!findText) operationBlockers.push('FIND_TEXT_REQUIRED');
    if (findText.includes('\r') || findText.includes('\n') || replaceText.includes('\r') || replaceText.includes('\n')) operationBlockers.push('LINE_ENDING_TEXT_NOT_SUPPORTED');

    let smartDocument = null;
    if (!nodeName && scopeToken === 'DOCUMENT' && unequalFixedWidth && findBytes != null && replaceBytes != null) {
      smartDocument = smartDocumentNodeNamePlan(target0, operation, findText, replaceText, sequence);
    }

    if (nodeName) {
      if (asciiLength(findText) == null || asciiLength(replaceText) == null) operationBlockers.push('NODENAME_ASCII_TEXT_REQUIRED');
    } else {
      if (findBytes == null || replaceBytes == null) operationBlockers.push('NON_BYTE_TEXT_NOT_SUPPORTED');
      if (unequalFixedWidth && !smartDocument) operationBlockers.push(`FIXED_WIDTH_LENGTH_MISMATCH:${findBytes}:${replaceBytes}`);
      if (fieldScoped && (asciiLength(findText) == null || asciiLength(replaceText) == null)) operationBlockers.push('CII_FIELD_ASCII_TEXT_REQUIRED');
    }

    const scopeResolution = smartDocument?.resolution || resolveFindReplaceScope(target0, operation, { fieldAwareMutation: true });
    if (scopeResolution?.status !== 'PASS') for (const blocker of scopeResolution?.blockers || ['SCOPE_RESOLUTION_FAILED']) operationBlockers.push(blocker);

    let matches = []; let preparedClaims = [];
    if (!operationBlockers.length && smartDocument) {
      matches = [...smartDocument.matches]; operationBlockers.push(...smartDocument.blockers); preparedClaims = [...smartDocument.claims];
    } else if (!operationBlockers.length && nodeName) {
      const plan = nodeNameClaimPlan(target0, findText, replaceText, scopeResolution.spans, sequence, scopeResolution);
      matches = plan.matches; operationBlockers.push(...plan.blockers); preparedClaims = plan.claims;
    } else if (!operationBlockers.length && scopeResolution?.fieldAware) {
      const plan = fieldAwareClaimPlan(target0, findText, replaceText, scopeResolution.spans, sequence, scopeResolution);
      matches = plan.matches; operationBlockers.push(...plan.blockers); preparedClaims = plan.claims;
    } else if (!operationBlockers.length) matches = literalMatchesWithinSpans(target0, findText, scopeResolution.spans);

'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'validator main-block replacement count={count}')
          old_summary = "      sequence, status: operationBlockers.length ? 'BLOCKED' : 'VALID', scope: scopeToken,\n      block: operation?.block || null, matchCount: matches.length, scopeAuthority: scopeResolution?.authority || null,"
          new_summary = "      sequence, status: operationBlockers.length ? 'BLOCKED' : 'VALID', scope: scopeToken,\n      block: smartDocument ? 'NODENAME' : operation?.block || null,\n      semanticMode: smartDocument ? 'AUTO_NODENAME_FIXED_WIDTH' : null,\n      matchCount: matches.length, scopeAuthority: scopeResolution?.authority || null,"
          if text.count(old_summary) != 1:
              raise SystemExit('validator summary anchor mismatch')
          text = text.replace(old_summary, new_summary, 1)
          p.write_text(text)

          # Human-readable diagnostics: user enters logical values, never manual padding.
          p = Path('tabs/cii-workspace/cii-workspace-find-replace-editor-model.js')
          text = p.read_text()
          analyze_anchor = 'export function analyzeFindReplaceEditorRows(rows = [], operationSummaries = []) {'
          if text.count(analyze_anchor) != 1:
              raise SystemExit('editor model analyze anchor mismatch')
          helper = r'''function diagnosticBlockerMessage(codeInput, sequence) {
  const code = String(codeInput || '');
  const tooWide = code.match(/^NODENAME_REPLACEMENT_TOO_WIDE:(\d+):(\d+):(.+)$/);
  if (tooWide) {
    return `Row ${sequence}: replacement has ${tooWide[1]} characters; the matched Node Name field allows ${tooWide[2]}. Enter only the logical value — padding is automatic.`;
  }
  const fixed = code.match(/^FIXED_WIDTH_LENGTH_MISMATCH:(\d+):(\d+)$/);
  if (fixed) {
    return `Row ${sequence}: this unequal-length change did not resolve to a qualified smart fixed-width field. Do not add spaces manually; use an exact Node Name value or choose the appropriate Element/Block scope.`;
  }
  if (code === 'NODENAME_ASCII_TEXT_REQUIRED') {
    return `Row ${sequence}: Node Name values must use ASCII text. Fixed-width padding is handled automatically.`;
  }
  return `Row ${sequence}: ${code}`;
}

'''
          text = text.replace(analyze_anchor, helper + analyze_anchor, 1)
          text = text.replace(
              "        message: `Row ${sequence}: ${String(blocker)}`,",
              "        message: diagnosticBlockerMessage(blocker, sequence),",
          )
          summary_anchor = "    if (Number(summary?.matchCount) === 0) {"
          if text.count(summary_anchor) != 1:
              raise SystemExit('editor summary anchor mismatch')
          smart_info = r'''    if (summary?.semanticMode === 'AUTO_NODENAME_FIXED_WIDTH') {
      entries.push(freezeEntry({
        severity: 'INFO', code: 'SMART_FIXED_WIDTH_NODENAME', sequences: [sequence],
        message: `Row ${sequence}: exact Node Name field resolved automatically. Fixed-width padding is handled by the CII serializer; no Fortran spacing is required.`,
      }));
    }
'''
          text = text.replace(summary_anchor, smart_info + summary_anchor, 1)
          text = text.replace(
              "        message: `Row ${sequence}: ${code}`,",
              "        message: diagnosticBlockerMessage(code, sequence),",
          )
          old_export = "export const _test = Object.freeze({ rawReplacement, effectiveReplacement, activeRow });"
          new_export = "export const _test = Object.freeze({ rawReplacement, effectiveReplacement, activeRow, diagnosticBlockerMessage });"
          if text.count(old_export) != 1:
              raise SystemExit('editor model export anchor mismatch')
          text = text.replace(old_export, new_export, 1)
          p.write_text(text)

          # UI guidance: logical values only.
          replace_once(
              'tabs/cii-workspace/cii-workspace-find-replace.js',
              'Preview is the editor. Type directly or paste a rectangular range copied from Microsoft Excel. Find and Replace are always the first two editable columns.',
              'Preview is the editor. Type directly or paste a rectangular range copied from Microsoft Excel. Find and Replace are always the first two editable columns. Enter logical values only — recognized fixed-width CII fields are padded and serialized automatically.',
          )
          replace_once(
              'tabs/cii-workspace/cii-workspace-find-replace.js',
              'Excel paste: copy Find and Replace columns, click the first Find cell, then paste.',
              'Excel paste: copy Find and Replace columns, click the first Find cell, then paste. Do not add Fortran padding spaces; smart fixed-width formatting is automatic for recognized fields.',
          )
          PY

          cat > tests/cii-workspace-find-replace-smart-fixed-width.test.js <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import test from 'node:test';
          import { createFindReplaceOperation, FIND_REPLACE_CSV_MODES } from '../tabs/cii-workspace/cii-workspace-find-replace-csv.js';
          import { buildValidatedFindReplacePostimage } from '../tabs/cii-workspace/cii-workspace-find-replace-executor.js';
          import { analyzeFindReplaceEditorRows } from '../tabs/cii-workspace/cii-workspace-find-replace-editor-model.js';
          import { validateFindReplacePreimage } from '../tabs/cii-workspace/cii-workspace-find-replace-validator.js';

          const target0 = fs.readFileSync(new URL('../Benchmark/T.CII', import.meta.url), 'utf8');

          function approvedDocument(findText, replaceText) {
            return {
              ...createFindReplaceOperation({ findText, replaceText }, FIND_REPLACE_CSV_MODES.DOCUMENT),
              sequence: 1,
              status: 'APPROVED',
            };
          }

          test('DOCUMENT smart fixed-width replaces logical Node Name without user padding', () => {
            assert.ok(target0.includes('PS02302.1'));
            const operation = approvedDocument('PS02302.1', '/SL-123.7, /unset-, /SL-123.8, /SL-123.9');
            assert.equal(operation.replaceText, 'SL-123.7');
            assert.notEqual(operation.findText.length, operation.replaceText.length);

            const preimage = validateFindReplacePreimage(target0, [operation]);
            assert.equal(preimage.status, 'PASS', preimage.blockers.join('\n'));
            assert.equal(preimage.operationSummaries[0].semanticMode, 'AUTO_NODENAME_FIXED_WIDTH');
            assert.equal(preimage.operationSummaries[0].block, 'NODENAME');
            assert.ok(preimage.claims.length >= 1);
            for (const claim of preimage.claims) {
              assert.equal(claim.before.length, claim.after.length);
              assert.equal(claim.after.trim(), 'SL-123.7');
              assert.equal(claim.block, 'NODENAME');
            }

            const postimage = buildValidatedFindReplacePostimage(target0, preimage);
            assert.equal(postimage.status, 'QUALIFIED_POSTIMAGE', postimage.blockers.join('\n'));
            assert.equal(postimage.target1.length, target0.length);
            assert.equal((postimage.target1.match(/\r\n/g) || []).length, (target0.match(/\r\n/g) || []).length);
            assert.ok(postimage.target1.includes('SL-123.7'));
          });

          test('smart fixed-width blocks overflow with a human-readable capacity error', () => {
            const operation = approvedDocument('PS02302.1', 'X'.repeat(40));
            const preimage = validateFindReplacePreimage(target0, [operation]);
            assert.equal(preimage.status, 'FAIL');
            const summary = preimage.operationSummaries[0];
            assert.equal(summary.semanticMode, 'AUTO_NODENAME_FIXED_WIDTH');
            assert.ok(summary.blockers.some((value) => value.startsWith('NODENAME_REPLACEMENT_TOO_WIDE:40:')));
            const diagnostics = analyzeFindReplaceEditorRows([operation], preimage.operationSummaries);
            const overflow = diagnostics.entries.find((entry) => entry.code.startsWith('NODENAME_REPLACEMENT_TOO_WIDE:'));
            assert.ok(overflow);
            assert.match(overflow.message, /Enter only the logical value/);
            assert.match(overflow.message, /padding is automatic/i);
          });

          test('unknown unequal-length document text remains fail-closed instead of shifting CII columns', () => {
            const operation = approvedDocument('TOKEN_THAT_DOES_NOT_EXIST', 'X');
            const preimage = validateFindReplacePreimage(target0, [operation]);
            assert.equal(preimage.status, 'FAIL');
            assert.ok(preimage.operationSummaries[0].blockers.some((value) => value.startsWith('FIXED_WIDTH_LENGTH_MISMATCH:')));
            assert.equal(preimage.claims.length, 0);
            const diagnostics = analyzeFindReplaceEditorRows([operation], preimage.operationSummaries);
            const fixed = diagnostics.entries.find((entry) => entry.code.startsWith('FIXED_WIDTH_LENGTH_MISMATCH:'));
            assert.ok(fixed);
            assert.match(fixed.message, /Do not add spaces manually/);
          });
          EOF

      - name: Syntax check changed modules
        run: |
          node --check tabs/cii-workspace/cii-workspace-find-replace-nodename-scope.js
          node --check tabs/cii-workspace/cii-workspace-find-replace-scope-resolver.js
          node --check tabs/cii-workspace/cii-workspace-find-replace-validator.js
          node --check tabs/cii-workspace/cii-workspace-find-replace-editor-model.js
          node --check tabs/cii-workspace/cii-workspace-find-replace.js
          node --check tests/cii-workspace-find-replace-smart-fixed-width.test.js
      - name: Run focused Find and Replace regressions
        run: |
          node --test \
            tests/cii-workspace-find-replace-smart-fixed-width.test.js \
            tests/cii-workspace-find-replace-validator.test.js \
            tests/cii-workspace-find-replace-scope-resolver.test.js \
            tests/cii-workspace-find-replace-v14-field-authority.test.js \
            tests/cii-workspace-find-replace-v14-version-record.test.js \
            tests/cii-workspace-find-replace-review-sync.test.js \
            tests/cii-workspace-find-replace-session.test.js \
            tests/cii-workspace-find-replace-output.test.js \
            tests/cii-workspace-find-replace-ui-registration.test.js
      - name: Commit qualified branch changes and remove one-time workflow
        run: |
          rm .github/workflows/ciifr-smart-fixed-width-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ciifr): smart fixed-width semantic replacement"
          git push origin HEAD:feature/ciifr-smart-semantic-fixed-width
