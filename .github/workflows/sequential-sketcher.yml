name: Sequential Sketcher

on:
  pull_request:
    paths:
      - 'tabs/psnm-utility-tab.js'
      - 'tests/sequential-sketcher-1885-nc-fixture-matrix.mjs'
      - '.github/workflows/sequential-sketcher.yml'

permissions:
  contents: read

jobs:
  sequential-sketcher:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Capture pinned fixture-wide feature matrix
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/sequential-sketcher-diagnostic
          cp tests/sequential-sketcher-1885-nc-fixture-matrix.mjs artifacts/sequential-sketcher-diagnostic/fixture-matrix.mjs
          node tests/sequential-sketcher-1885-nc-fixture-matrix.mjs 2>&1 | tee artifacts/sequential-sketcher-diagnostic/fixture-matrix.log
          echo "${PIPESTATUS[0]}" > artifacts/sequential-sketcher-diagnostic/status.txt
          exit 0
      - name: Upload pinned fixture diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequential-sketcher-fixture-matrix-diagnostic
          path: artifacts/sequential-sketcher-diagnostic/
          if-no-files-found: error
      - name: Enforce pinned fixture result
        run: test "$(cat artifacts/sequential-sketcher-diagnostic/status.txt)" = '0'
