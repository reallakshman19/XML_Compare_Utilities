name: Topology Staged Export Interchange

on:
  pull_request:
    paths:
      - 'tabs/topology-trace-validator/topology-staged-export.js'
      - 'tests/topology-staged-export-interchange.test.mjs'
      - '.github/workflows/topology-staged-export-interchange.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify exact staged interchange shape
        run: node tests/topology-staged-export-interchange.test.mjs

  w214-w212-focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: W2.12 focused composite qualification
        run: |
          set -euo pipefail
          node tests/cii-workspace-writer2-composite-restraint.test.js
          node tests/cii-workspace-writer2-composite-restraint-partial-hanger.test.js
          node tests/cii-workspace-writer2-composite-restraint-falsifiers.test.js

  w214-w213-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: W2.13 synthetic and retained-real-CII product qualification
        run: |
          set -euo pipefail
          node tests/cii-workspace-writer2-restraint-product-routing.test.js
          node tests/cii-workspace-writer2-restraint-product-real-cii.test.js

  w214-writer2-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Inherited Writer2 product/composite regression slice
        run: |
          set -euo pipefail
          node tests/cii-workspace-writer2-composite-product-routing.test.js
          node tests/cii-workspace-writer2-hanger-partial-product.test.js
          node tests/cii-workspace-writer2-hanger-partial-deleted-testimony.test.js
          node tests/cii-workspace-writer2-real-benchmark-roundtrip.test.js
          node tests/cii-workspace-writer2-trifamily-real-benchmark-roundtrip.test.js

  w214-repository-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Repository npm test
        run: npm test
