name: Sequential Engineering SVG Owner Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - 'tabs/sequential-sketcher/sequential-engineering-svg-owner-bridge.js'
      - 'tabs/sequential-sketcher/sequential-engineering-svg-index-projection.js'
      - 'tabs/sequential-sketcher/sequential-engineering-svg-authority.js'
      - 'tabs/sequential-sketcher/sequential-engineering-svg-adapter.js'
      - 'tabs/sequential-sketcher/sequential-sketcher-workspace.js'
      - 'tests/sequential-engineering-svg-owner-bridge.test.js'
      - 'tests/sequential-engineering-svg-index-projection.test.js'
      - 'tests/sequential-engineering-svg-owner-bridge-static.test.js'
      - 'tests/sequential-engineering-svg-adapter.test.js'
      - '.github/workflows/sequential-engineering-svg-owner-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-bridge-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      ARTIFACT_DIR: artifacts/sequential-engineering-svg-owner-bridge
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checked-out SHA
        id: exact_head
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          mkdir -p "$ARTIFACT_DIR"
          printf '{"schema":"SequentialEngineeringSvgOwnerBridgeExactHead.v1","expectedSha":"%s","actualSha":"%s","shaMatch":true}\n' \
            "$EXPECTED_SHA" "$actual_sha" > "$ARTIFACT_DIR/exact-head.json"

      - name: Enforce Work Pack scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base="${BASE_SHA:-$(git merge-base HEAD origin/main)}"
          git diff --check "$base" "$EXPECTED_SHA"
          git diff --name-only "$base" "$EXPECTED_SHA" | sort > "$ARTIFACT_DIR/changed-files.txt"
          while IFS= read -r file; do
            case "$file" in
              tabs/sequential-sketcher/sequential-engineering-svg-owner-bridge.js|\
              tabs/sequential-sketcher/sequential-engineering-svg-index-projection.js|\
              tabs/sequential-sketcher/sequential-engineering-svg-authority.js|\
              tabs/sequential-sketcher/sequential-engineering-svg-adapter.js|\
              tabs/sequential-sketcher/sequential-sketcher-workspace.js|\
              tests/sequential-engineering-svg-owner-bridge.test.js|\
              tests/sequential-engineering-svg-index-projection.test.js|\
              tests/sequential-engineering-svg-owner-bridge-static.test.js|\
              tests/sequential-engineering-svg-adapter.test.js|\
              .github/workflows/sequential-engineering-svg-owner-bridge.yml) ;;
              *) echo "Forbidden SSK-ESVG-003B path: $file"; exit 1 ;;
            esac
          done < "$ARTIFACT_DIR/changed-files.txt"
          ! grep -Eq \
            '^(core/|workbench3d/|tabs/revision-compare/|tabs/pipeline-3d-model/|tabs/topology-trace-validator/|index\.html$|package(-lock)?\.json$)' \
            "$ARTIFACT_DIR/changed-files.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Syntax checks
        id: syntax
        run: |
          node --check tabs/sequential-sketcher/sequential-engineering-svg-owner-bridge.js
          node --check tabs/sequential-sketcher/sequential-engineering-svg-index-projection.js
          node --check tabs/sequential-sketcher/sequential-engineering-svg-authority.js
          node --check tabs/sequential-sketcher/sequential-engineering-svg-adapter.js
          node --check tabs/sequential-sketcher/sequential-sketcher-workspace.js
          node --check tests/sequential-engineering-svg-owner-bridge.test.js
          node --check tests/sequential-engineering-svg-index-projection.test.js
          node --check tests/sequential-engineering-svg-owner-bridge-static.test.js
          node --check tests/sequential-engineering-svg-adapter.test.js

      - name: Owner bridge and immutable index contracts
        id: focused
        run: |
          node tests/sequential-engineering-svg-owner-bridge.test.js
          node tests/sequential-engineering-svg-index-projection.test.js
          node tests/sequential-engineering-svg-owner-bridge-static.test.js
          node tests/sequential-engineering-svg-adapter.test.js
          node tests/sequential-engineering-svg-parity.test.js

      - name: Existing Shared shadow regressions
        id: shadow
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/sequential-engineering-svg-shadow-*.test.js; do
            node "$test_file"
          done

      - name: Inherited Sequential authority and lifecycle regressions
        id: inherited
        run: |
          node tests/sequential-sketcher-ui-static.test.js
          node tests/sequential-sketcher-branch-switch-ui.test.js
          node tests/sequential-construction-engine.test.js
          node tests/sequential-attachment-event.test.js
          node tests/sequential-zero-length-inline.test.js
          node tests/sequential-head-boundary-gate.test.js
          node tests/sequential-construction-acceptance.test.js
          node tests/sequential-supervised-transactions.test.js
          node tests/sequential-review-queue.test.js
          node tests/sequential-workspace-persistence.test.js
          node tests/sequential-continuity-geometry.test.js
          node tests/sequential-construction-tolerance-policy.test.js
          node tests/sequential-confirmed-support-projection.test.js

      - name: Startup module validation
        id: startup
        run: node tests/startup-module-syntax.test.js

      - name: Full repository tests
        id: full
        run: npm test

      - name: Write machine-readable certification
        id: certification
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          ACTUAL_SHA="$actual_sha" node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          const directory = process.env.ARTIFACT_DIR;
          mkdirSync(directory, { recursive: true });
          const evidence = {
            schema: 'SequentialEngineeringSvgOwnerBridgeCertification.v1',
            expectedSha: process.env.EXPECTED_SHA,
            actualSha: process.env.ACTUAL_SHA,
            shaMatch: process.env.EXPECTED_SHA === process.env.ACTUAL_SHA,
            ownerBridgeSchema: 'SequentialEngineeringSvgOwnerBridge.v1',
            ownerSnapshotSchema: 'SequentialEngineeringSvgOwnerSnapshot.v1',
            ownerEventSchema: 'SequentialEngineeringSvgOwnerEvent.v1',
            indexProjectionSchema: 'SequentialEngineeringSvgIndexProjection.v1',
            preSessionReasons: ['source-inspected', 'source-reloaded'],
            preSessionSnapshot: null,
            publicApi: ['getSnapshot', 'subscribe', 'destroy'],
            productionSharedSvgMounted: false,
            commandGatewayAdded: false,
            results: {
              scope: 'success',
              syntax: 'success',
              focused: 'success',
              shadow: 'success',
              inherited: 'success',
              startup: 'success',
              fullRepositoryTests: 'success',
            },
          };
          writeFileSync(`${directory}/certification.json`, `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Upload exact-head owner bridge evidence
        uses: actions/upload-artifact@v4
        with:
          name: sequential-engineering-svg-owner-bridge-${{ env.EXPECTED_SHA }}
          path: artifacts/sequential-engineering-svg-owner-bridge
          if-no-files-found: error
