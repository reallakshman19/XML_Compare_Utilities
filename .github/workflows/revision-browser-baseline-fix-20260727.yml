name: Revision Compare browser baseline final publisher

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/revision-browser-baseline-fix-20260727.yml']

permissions:
  contents: write

env:
  TARGET_BRANCH: owner/fix-revision-compare-browser-baseline-20260727
  EXPECTED_TARGET_SHA: 0e92c7d02c28352adf66e25d31e4dbd5df2b4674
  PATCH_SOURCE_COMMIT: 21f23b8b65fc3d9d38c85ad259c419030acfd3dc
  CI: 'true'

jobs:
  certify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out exact baseline branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Enforce exact baseline head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"

      - name: Replay four proven browser corrections
        run: |
          git show "$PATCH_SOURCE_COMMIT:.github/workflows/revision-browser-baseline-fix-20260727.yml" > /tmp/publisher.yml
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/publisher.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("          PY\n", start)
          lines = text[start:end].splitlines()
          Path('/tmp/browser-patch.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n')
          PY
          python3 /tmp/browser-patch.py

      - name: Add no-common intake barrier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/browser/revision-compare-rc001.spec.mjs')
          text = path.read_text()
          old = """  await upload(page, 'baseline', 'a.json', staged(['/A-ONLY']));
            await upload(page, 'candidate', 'b.json', staged(['/B-ONLY']));"""
          new = """  await upload(page, 'baseline', 'a.json', staged(['/A-ONLY']));
            await expect(page.locator('[data-slot=\"baseline\"] strong')).toContainText('ready');
            await upload(page, 'candidate', 'b.json', staged(['/B-ONLY']));
            await expect(page.getByRole('heading', { name: 'Confirm branch scope' })).toBeVisible();"""
          if old not in text:
              raise SystemExit('Expected no-common upload block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Focused browser regressions
        run: |
          npx playwright test \
            tests/browser/revision-compare-rc001.spec.mjs \
            tests/browser/revision-compare-evidence-package.spec.mjs \
            tests/browser/revision-compare-rc002.spec.mjs \
            tests/browser/revision-compare-rc003.spec.mjs \
            tests/browser/revision-compare-rc004.spec.mjs \
            --config=playwright.revision-compare.config.mjs

      - name: Complete Revision Compare Playwright
        run: npx playwright test --config=playwright.revision-compare.config.mjs

      - name: Revision Compare aggregate
        run: npm run test:revision-compare

      - name: Repository-wide validation
        run: npm test

      - name: Enforce five-file scope
        run: |
          git diff --check
          git diff --name-only | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          tests/browser/revision-compare-evidence-package.spec.mjs
          tests/browser/revision-compare-rc001.spec.mjs
          tests/browser/revision-compare-rc002.spec.mjs
          tests/browser/revision-compare-rc003.spec.mjs
          tests/browser/revision-compare-rc004.spec.mjs
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Commit and publish tested baseline repair
        run: |
          git config user.name 'Owner Release Bot'
          git config user.email 'owner-release-bot@users.noreply.github.com'
          git add tests/browser/revision-compare-rc001.spec.mjs \
            tests/browser/revision-compare-evidence-package.spec.mjs \
            tests/browser/revision-compare-rc002.spec.mjs \
            tests/browser/revision-compare-rc003.spec.mjs \
            tests/browser/revision-compare-rc004.spec.mjs
          git commit -m 'test: stabilize Revision Compare browser authority checks'
          git push origin HEAD:${TARGET_BRANCH}
