name: Revision Compare browser baseline diagnostic

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/revision-browser-baseline-fix-20260727.yml']

permissions:
  contents: read

env:
  TARGET_BRANCH: owner/fix-revision-compare-browser-baseline-20260727
  EXPECTED_TARGET_SHA: 0e92c7d02c28352adf66e25d31e4dbd5df2b4674
  PATCH_SOURCE_COMMIT: 21f23b8b65fc3d9d38c85ad259c419030acfd3dc
  CI: 'true'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact baseline branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Enforce exact baseline head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"

      - name: Replay four browser-test corrections
        run: |
          git show "$PATCH_SOURCE_COMMIT:.github/workflows/revision-browser-baseline-fix-20260727.yml" > /tmp/publisher.yml
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/publisher.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("          PY\n", start)
          lines = text[start:end].splitlines()
          Path('/tmp/browser-patch.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n')
          PY
          python3 /tmp/browser-patch.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Capture complete Revision Compare Playwright
        id: complete
        continue-on-error: true
        run: |
          mkdir -p diagnostic
          npx playwright test --config=playwright.revision-compare.config.mjs --reporter=line > diagnostic/complete-playwright.log 2>&1

      - name: Upload complete browser output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-browser-baseline-residual-20260727
          path: diagnostic/complete-playwright.log
          if-no-files-found: error

      - name: Require complete suite pass
        run: test "${{ steps.complete.outcome }}" = "success"
