name: Revision Compare browser baseline repair

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/revision-browser-baseline-fix-20260727.yml']

permissions:
  contents: write

env:
  TARGET_BRANCH: owner/fix-revision-compare-browser-baseline-20260727
  EXPECTED_TARGET_SHA: 0e92c7d02c28352adf66e25d31e4dbd5df2b4674
  CI: 'true'

jobs:
  certify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out exact baseline branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Enforce exact baseline head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"

      - name: Apply four browser-test corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}')
              file.write_text(text.replace(old, new, 1))

          replace('tests/browser/revision-compare-evidence-package.spec.mjs',
            """  await page.getByRole('button', { name: 'Confirm no match' }).click();
            const state = await page.evaluate(() => structuredClone(window.rcHandle.evidence().state));""",
            """  await page.getByRole('button', { name: 'Confirm no match' }).click();
            await expect.poll(() => page.evaluate((differenceId) => window.rcHandle.evidence().state.decision.ledger.decisions
              .find((item) => item.differenceId === differenceId)?.decisionState, rows.ambiguous))
              .toBe('CONFIRMED_NO_MATCH');
            const state = await page.evaluate(() => structuredClone(window.rcHandle.evidence().state));""")

          replace('tests/browser/revision-compare-rc002.spec.mjs',
            """  const scopeBranch = page.locator('[data-revc-branch-id=\"branch:/COMMON-500\"]');
            await page.locator('label.revc-scope-row', { has: scopeBranch }).click();
            await expect(scopeBranch).not.toBeChecked();""",
            """  const scopeBranch = page.locator('[data-revc-branch-id=\"branch:/COMMON-500\"]');
            await expect(scopeBranch).toBeEnabled();
            await scopeBranch.uncheck();
            await expect(scopeBranch).not.toBeChecked();""")

          replace('tests/browser/revision-compare-rc003.spec.mjs',
            """  const branch = page.locator('[data-revc-branch-id=\"branch:/COMMON-500\"]');
            const branchRow = page.locator('label.revc-scope-row', { has: branch });
            await branchRow.click(); await expect(branch).not.toBeChecked();
            await branchRow.click(); await expect(branch).toBeChecked();""",
            """  const branch = page.locator('[data-revc-branch-id=\"branch:/COMMON-500\"]');
            await expect(branch).toBeEnabled();
            await branch.uncheck(); await expect(branch).not.toBeChecked();
            await branch.check(); await expect(branch).toBeChecked();""")

          replace('tests/browser/revision-compare-rc004.spec.mjs',
            """  const common = page.locator('[data-revc-branch-id=\"branch:/COMMON-500\"]');
            const commonRow = page.locator('label.revc-scope-row', { has: common });
            await commonRow.click(); await expect(common).not.toBeChecked();
            await commonRow.click(); await expect(common).toBeChecked();""",
            """  const common = page.locator('[data-revc-branch-id=\"branch:/COMMON-500\"]');
            await expect(common).toBeEnabled();
            await common.uncheck(); await expect(common).not.toBeChecked();
            await common.check(); await expect(common).toBeChecked();""")
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Focused browser regressions
        run: |
          npx playwright test \
            tests/browser/revision-compare-evidence-package.spec.mjs \
            tests/browser/revision-compare-rc002.spec.mjs \
            tests/browser/revision-compare-rc003.spec.mjs \
            tests/browser/revision-compare-rc004.spec.mjs \
            --config=playwright.revision-compare.config.mjs

      - name: Complete Revision Compare Playwright
        run: npx playwright test --config=playwright.revision-compare.config.mjs

      - name: Revision Compare aggregate
        run: npm run test:revision-compare

      - name: Repository-wide validation
        run: npm test

      - name: Enforce four-file scope
        run: |
          git diff --check
          git diff --name-only | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          tests/browser/revision-compare-evidence-package.spec.mjs
          tests/browser/revision-compare-rc002.spec.mjs
          tests/browser/revision-compare-rc003.spec.mjs
          tests/browser/revision-compare-rc004.spec.mjs
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Commit and publish tested baseline repair
        run: |
          git config user.name 'Owner Release Bot'
          git config user.email 'owner-release-bot@users.noreply.github.com'
          git add tests/browser/revision-compare-evidence-package.spec.mjs \
            tests/browser/revision-compare-rc002.spec.mjs \
            tests/browser/revision-compare-rc003.spec.mjs \
            tests/browser/revision-compare-rc004.spec.mjs
          git commit -m 'test: stabilize Revision Compare browser authority checks'
          git push origin HEAD:${TARGET_BRANCH}
