name: CII Writer2 S1 D4 Method-A provenance

on:
  push:
    branches:
      - validation/cii-writer2-s1-d4-1269
  workflow_dispatch:

jobs:
  d4-method-a-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout validation head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Guard exact D3 product and retained stack
        shell: bash
        run: |
          set -euo pipefail
          D4BASE=e960731236a3fa585869e0d0a295093c646086ac
          D3BASE=a7e96865301a09865e0b4126c38310d7b1c8d421
          D3HEAD=2751b563505caa2c9be0803294b00c3177c2811a

          git fetch origin fix/cii-method-a-provenance-1268:refs/remotes/origin/fix/cii-method-a-provenance-1268
          test "$(git rev-parse refs/remotes/origin/fix/cii-method-a-provenance-1268)" = "$D3HEAD"

          expected_d4="$(printf '%s\n'             '.github/workflows/cii-writer2-s1-d4-1269.yml'             'tabs/cii-workspace/cii-workspace-multi-base-correspondence.js'             'tests/browser/cii-writer2-s1-d4-method-a-provenance.spec.mjs' | sort)"
          actual_d4="$(git diff --name-only "$D4BASE"...HEAD | sort)"
          test "$actual_d4" = "$expected_d4"

          expected_d3="$(printf '%s\n'             'agents/PR1280_workreport.md'             'tabs/cii-workspace/cii-workspace-multi-base-correspondence.js'             'tests/cii-workspace-method-a-anchor-provenance.test.js'             'tests/cii-workspace-method-a-boundary-provenance.test.js'             'tests/cii-workspace-method-a-projection-integration.test.js' | sort)"
          actual_d3="$(git diff --name-only "$D3BASE" "$D3HEAD" | sort)"
          test "$actual_d3" = "$expected_d3"

          test "$(git rev-parse "$D3HEAD:tabs/cii-workspace/cii-workspace-multi-base-correspondence.js")" = "adf5c71f189f564cea87e38f55f62a36817e9d20"
          test "$(git rev-parse "$D3HEAD:tabs/cii-workspace/cii-workspace-correspondence-arbitration.js")" = "ff26a1921dc527a7d7cef2e9a94c56b92651484f"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-multi-base-correspondence.js)" = "fbfa4b32fd2c4db9da0aa50f9b23bc1c54191a5d"
          test "$(git hash-object tests/browser/cii-writer2-s1-d4-method-a-provenance.spec.mjs)" = "09277285218be101f9a83f0d6a10dc98a7a0ae92"

          test "$(git hash-object tabs/cii-workspace/cii-workspace-anchor-physical-candidates.js)" = "ce3326a86f9e8fd88f26e583e27bf8147d0b39dd"
          test "$(git hash-object tests/cii-workspace-anchor-search-budget.test.js)" = "0dd1b002b15e8b49e077f5091bf0ec3b29890b79"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-anchor-suggestions-core.js)" = "1037163d7ace8f91cc889108c044d1d2e9884d58"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-anchor-suggestions.js)" = "48ac451a7084873a8f48b6a48237627ba0a4786c"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-multisource-review-only-filter-shell.js)" = "ebe18d2dc2ffe3ac8dd60b8e330aca25cfb01c28"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-source-set.js)" = "f4d36814c34a20b194389eebe7ed7ec52e42ba3b"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-source-target-audit.js)" = "8787fe0f09215ccd4e6bcc337f6d88a8f31d6d91"

          if git diff --name-only "$D4BASE"...HEAD -- Benchmark | grep -q .; then
            echo "Benchmark mutation forbidden"
            exit 1
          fi
          echo "S1_D4_VALIDATION_GUARD_PASS"

      - name: Install dependencies
        run: npm ci

      - name: Materialize exact D3 focused tests
        shell: bash
        run: |
          set -euo pipefail
          D3HEAD=2751b563505caa2c9be0803294b00c3177c2811a
          git show "$D3HEAD:tests/cii-workspace-method-a-anchor-provenance.test.js" > tests/.d4-anchor-1269.test.js
          git show "$D3HEAD:tests/cii-workspace-method-a-boundary-provenance.test.js" > tests/.d4-boundary-1269.test.js
          git show "$D3HEAD:tests/cii-workspace-method-a-projection-integration.test.js" > tests/.d4-integration-1269.test.js

      - name: Run focused D3 and bounded-preselection tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/.d4-anchor-1269.test.js
          node tests/.d4-boundary-1269.test.js
          node tests/.d4-integration-1269.test.js
          node tests/cii-workspace-anchor-search-budget.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Create focused Playwright config
        shell: bash
        run: |
          cat > playwright.s1-d4.config.mjs <<'EOF'
          import base from './playwright.cii-writer2-retained.config.mjs';
          export default {
            ...base,
            testMatch: ['cii-writer2-s1-d4-method-a-provenance.spec.mjs'],
            timeout: 240_000,
            expect: { timeout: 20_000 },
            workers: 1,
            retries: 0,
            reporter: [['list']],
            outputDir: 'test-results/cii-writer2-s1-d4',
          };
          EOF

      - name: Run D4 retained qualification
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.s1-d4.config.mjs 2>&1 | tee s1-d4.log

      - name: Upload D4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cii-writer2-s1-d4-method-a-provenance
          path: |
            s1-d4.log
            test-results/cii-writer2-s1-d4
          if-no-files-found: warn
