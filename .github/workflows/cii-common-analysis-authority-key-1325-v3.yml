name: CII P3.3-A authority-key qualification v3

on:
  push:
    branches:
      - validation/cii-common-analysis-authority-key-1325-v3
  workflow_dispatch:

jobs:
  qualify-p3-3-a:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Guard exact P3.3-A product
        shell: bash
        run: |
          set -euo pipefail
          BASE=c637db92295d379ca6cc3b8aa69d7ace8ff51b5f
          PRODUCT=bd3f1c4a35d87854a6881b0d9a6e9cb4e53d4982

          test "$(git diff --name-only "$PRODUCT"...HEAD | sort)" = ".github/workflows/cii-common-analysis-authority-key-1325-v3.yml"

          expected="$(printf '%s\n' \
            'agents/WIP-1325-common-analysis-authority-key_workreport.md' \
            'tabs/cii-workspace/cii-workspace-common-analysis-key.js' \
            'tests/cii-workspace-common-analysis-authority-key.test.js' | sort)"
          test "$(git diff --name-only "$BASE" "$PRODUCT" | sort)" = "$expected"

          test "$(git rev-parse "$PRODUCT:tabs/cii-workspace/cii-workspace-common-analysis-key.js")" = "6baf90caff8c457fa64e1ac859b5f3d3127063c3"
          test "$(git rev-parse "$PRODUCT:tests/cii-workspace-common-analysis-authority-key.test.js")" = "458e3e8c4dccfe2e6faa1616774f808687388513"
          test "$(git rev-parse "$PRODUCT:agents/WIP-1325-common-analysis-authority-key_workreport.md")" = "cc46875e8d9a9846ef23951d6ccd3e5ddea5af11"

          if git diff --name-only "$BASE" "$PRODUCT" -- Benchmark tabs/cii-workspace/cii-workspace-core.js tabs/cii-workspace/cii-workspace-multisource-preview.js tabs/cii-workspace/cii-workspace-multisource-review-only.js tabs/cii-workspace/cii-workspace-multisource-writer2-ui.js tabs/cii-workspace/cii-workspace-multisource-review-only-router.js | grep -q .; then
            echo "P3.3-A scope violation"
            exit 1
          fi
          echo "P3_3_A_EXACT_PRODUCT_GUARD_PASS"

      - name: Install dependencies
        run: npm ci

      - name: Syntax
        run: |
          node --check tabs/cii-workspace/cii-workspace-common-analysis-key.js
          node --check tests/cii-workspace-common-analysis-authority-key.test.js

      - name: Run deterministic key falsifiers
        run: node tests/cii-workspace-common-analysis-authority-key.test.js

      - name: Run prepared-session custody regression
        run: node tests/cii-workspace-prepared-source-set-session.test.js
