name: PS Family Evidence Graph Audit

on:
  pull_request:
    paths:
      - 'tabs/ps-family-clash-audit/**'
      - 'tabs/support-steel-relationship-builder/**'
      - 'tests/ps-family-*.test.js'
      - 'package.json'
      - '.github/workflows/ps-family-evidence-graph-audit.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Graph-native audit tests
        id: graph_tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node --test tests/ps-family-evidence-graph-audit.test.js > ps-family-evidence-graph-test.log 2>&1
          status=$?
          echo "$status" > ps-family-evidence-graph-test.status
          exit 0
      - name: Upload graph test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps-family-evidence-graph-test-log
          path: |
            ps-family-evidence-graph-test.log
            ps-family-evidence-graph-test.status
      - name: Enforce graph test result
        shell: bash
        run: |
          cat ps-family-evidence-graph-test.log
          test "$(cat ps-family-evidence-graph-test.status)" = "0"
      - name: Audit configuration and UI contracts
        run: node tests/ps-family-clash-audit-config.test.js && node tests/ps-family-clash-audit-ui-smoke.test.js && node tests/ps-family-accessibility-gate.test.js
      - name: Legacy XML validation compatibility
        run: node tests/ps-family-psclash-report.test.js
