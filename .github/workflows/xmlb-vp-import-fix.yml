name: XMLB VP Import Fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/xmlb-vp-import-fix.yml'

permissions:
  contents: write

jobs:
  correct-relative-imports:
    if: github.head_ref == 'agent/xmlb-vp-001-workbench-viewport'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xmlb-vp-001-workbench-viewport
      - name: Correct common viewport import depth
        run: |
          files=(
            xml-compare/universal-categorizer/universal-viewport-state.js
            xml-compare/universal-categorizer/universal-tree-viewport-host.js
            xml-compare/universal-categorizer/universal-pivot-viewport-host.js
            xml-compare/universal-categorizer/universal-viewport-shell-model.js
            xml-compare/universal-categorizer/universal-viewport-lifecycle.js
          )
          sed -i 's#../../../core/workbench-viewport/#../../core/workbench-viewport/#g' "${files[@]}"
          rm -f .github/workflows/xmlb-vp-import-fix.yml
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: correct XML Builder viewport core imports'
          git push origin HEAD:agent/xmlb-vp-001-workbench-viewport
