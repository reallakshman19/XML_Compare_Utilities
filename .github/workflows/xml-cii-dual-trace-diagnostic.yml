name: XML CII Dual Trace Diagnostic

on:
  push:
    branches: [owner/xml-cii-dual-dtxr-trace]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dual-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture DTXR ledger and trace regressions
        id: regression
        continue-on-error: true
        run: |
          mkdir -p artifacts/xml-cii-dual-trace
          set +e
          node tests/xml-cii-xml-node-wise-trace.test.js > artifacts/xml-cii-dual-trace/trace.log 2>&1
          TRACE_CODE=$?
          node tests/xml-cii-dtxr-resolution-ledger.test.js > artifacts/xml-cii-dual-trace/ledger.log 2>&1
          LEDGER_CODE=$?
          echo "trace=$TRACE_CODE" > artifacts/xml-cii-dual-trace/test.exit
          echo "ledger=$LEDGER_CODE" >> artifacts/xml-cii-dual-trace/test.exit
          if [ "$TRACE_CODE" -ne 0 ] || [ "$LEDGER_CODE" -ne 0 ]; then exit 1; fi
      - name: Upload DTXR diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml-cii-dual-trace-diagnostic
          path: artifacts/xml-cii-dual-trace
          if-no-files-found: error
      - name: Fail when regression failed
        if: steps.regression.outcome == 'failure'
        run: exit 1
