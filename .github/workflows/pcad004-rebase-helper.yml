name: PCAD-004 Rebase Helper

on:
  push:
    branches:
      - agent/pcad-004-rebase-20260717
    paths:
      - .github/workflows/pcad004-rebase-helper.yml

permissions:
  contents: write

jobs:
  copy-mission-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pcad-004-rebase-20260717
          fetch-depth: 0
      - name: Copy PCAD-004 mission files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/pcad-004-multi-selection
          git checkout origin/agent/pcad-004-multi-selection -- \
            package.json \
            playwright.pipeline-cad.config.mjs \
            tabs/pipeline-3d-model/pipeline-3d-model-cad-authoring.js \
            tabs/pipeline-3d-model/pipeline-3d-model-cad-batch-commands.js \
            tabs/pipeline-3d-model/pipeline-3d-model-cad-batch-controller.js \
            tabs/pipeline-3d-model/pipeline-3d-model-cad-batch-view.js \
            tabs/pipeline-3d-model/pipeline-3d-model-cad-precision-runtime.js \
            tabs/pipeline-3d-model/pipeline-3d-model-cad-selection-contracts.js \
            tabs/pipeline-3d-model/pipeline-3d-model-cad-selection-runtime.js \
            tabs/pipeline-3d-model/pipeline-3d-model-cad-workspace.js \
            tabs/pipeline-3d-model/pipeline-3d-model-table2x-canvas.js \
            tabs/pipeline-3d-model/pipeline-3d-model-table3x-canvas.js \
            tests/browser/pipeline-cad-multi-selection-fixture.html \
            tests/browser/pipeline-cad-multi-selection.spec.mjs \
            tests/pipeline-3d-model-cad-batch-commands.test.js \
            tests/pipeline-3d-model-cad-multi-selection-integration.test.js \
            tests/pipeline-3d-model-cad-selection-contracts.test.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "rebase PCAD-004 onto current main"
          git push origin HEAD:agent/pcad-004-rebase-20260717
