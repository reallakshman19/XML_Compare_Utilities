name: CategorizedInputXML Worker Transport

on:
  pull_request:
    paths:
      - 'xml-compare/categorized-inputxml-worker/**'
      - 'tests/categorized-inputxml-worker-*.test.js'
      - 'scripts/categorized-inputxml-worker-structure-check.mjs'
      - 'docs/categorized-inputxml-worker/**'
      - '.github/workflows/categorized-inputxml-worker-transport.yml'
  push:
    branches: [main]
    paths:
      - 'xml-compare/categorized-inputxml-worker/**'
      - 'tests/categorized-inputxml-worker-*.test.js'
      - 'scripts/categorized-inputxml-worker-structure-check.mjs'
      - 'docs/categorized-inputxml-worker/**'
      - '.github/workflows/categorized-inputxml-worker-transport.yml'

permissions:
  contents: read

jobs:
  transport-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enforce Work Pack diff scope
        run: |
          git fetch origin main --depth=1
          git diff --name-only origin/main...HEAD > categorized-inputxml-worker-diff.txt
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/categorized-inputxml-worker-transport.yml|\
              docs/categorized-inputxml-worker/*|\
              scripts/categorized-inputxml-worker-structure-check.mjs|\
              tests/categorized-inputxml-worker-*.test.js|\
              xml-compare/categorized-inputxml-worker/*) ;;
              *) echo "Out-of-scope change: $path"; exit 1 ;;
            esac
          done < categorized-inputxml-worker-diff.txt
          cat categorized-inputxml-worker-diff.txt
          git diff --quiet origin/main...HEAD -- xml-compare/categorized-inputxml-api
          git diff --quiet origin/main...HEAD -- xml-compare/inputxml-changeset-api

      - name: JavaScript syntax
        run: |
          for file in xml-compare/categorized-inputxml-worker/*.js; do node --check "$file"; done
          node --check tests/categorized-inputxml-worker-protocol.test.js
          node --check tests/categorized-inputxml-worker-runtime.test.js
          node --check tests/categorized-inputxml-worker-integration.test.js
          node --check tests/categorized-inputxml-worker-client.test.js
          node --check scripts/categorized-inputxml-worker-structure-check.mjs

      - name: Structure and isolation gate
        run: node scripts/categorized-inputxml-worker-structure-check.mjs

      - name: Run focused worker tests
        id: focused
        continue-on-error: true
        run: |
          set -o pipefail
          {
            node tests/categorized-inputxml-worker-protocol.test.js
            node tests/categorized-inputxml-worker-runtime.test.js
            node tests/categorized-inputxml-worker-integration.test.js
            node tests/categorized-inputxml-worker-client.test.js
          } > categorized-inputxml-worker-focused.log 2>&1

      - name: Upload focused test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: categorized-inputxml-worker-focused-log
          path: categorized-inputxml-worker-focused.log
          retention-days: 14

      - name: Enforce focused worker tests
        if: always()
        run: |
          cat categorized-inputxml-worker-focused.log
          test '${{ steps.focused.outcome }}' = 'success'

      - name: Full repository tests
        run: npm test
