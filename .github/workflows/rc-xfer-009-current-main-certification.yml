name: RC-XFER-009 Current Main Certification

on:
  pull_request:
    paths:
      - '.github/workflows/rc-xfer-009-current-main-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-xfer-009-current-main-certification
  cancel-in-progress: true

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Record exact environment
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          node --version
          npm --version
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Diagnose transfer manifest reconstruction
        run: |
          node --input-type=module <<'NODE' | tee rc-xfer-009-diagnostic.log
          import { createRevisionCompareTransferArtifacts } from './tabs/revision-compare/revision-transfer-artifacts.js';
          import { handoverInspectionFixture, cryptoRef } from './tests/revision-compare-transfer-handover-inspection-fixtures.mjs';
          const fixture = await handoverInspectionFixture();
          const payload = fixture.bundle.payload;
          const expected = await createRevisionCompareTransferArtifacts({
            result: payload.transferResult,
            audit: payload.transferAudit,
            proof: payload.transferProof,
            targetFileName: payload.transferPlan.receiverDocument.fileName,
            patchedTargetSchema: payload.transferPlan.receiverDocument.profile,
          }, { cryptoRef });
          console.log(JSON.stringify({
            actualManifest: payload.transferManifest,
            expectedManifest: expected.manifest,
            actualArtifactDescriptors: payload.transferArtifacts.map(({ text, ...rest }) => rest),
            expectedArtifactDescriptors: expected.artifacts.map(({ text, ...rest }) => rest),
          }, null, 2));
          NODE
      - name: Run exact Revision Compare qualification
        run: |
          set -o pipefail
          /usr/bin/time -v npm run test:revision-compare-qualification 2>&1 | tee rc-xfer-009-qualification.log
      - name: Record repository state
        if: always()
        run: |
          git status --short | tee rc-xfer-009-worktree.log
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-xfer-009-current-main-evidence
          if-no-files-found: warn
          retention-days: 30
          path: |
            rc-xfer-009-diagnostic.log
            rc-xfer-009-qualification.log
            rc-xfer-009-worktree.log
            playwright-report/
            test-results/
