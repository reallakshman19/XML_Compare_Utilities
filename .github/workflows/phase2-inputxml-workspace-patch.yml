name: Phase 2 InputXML Workspace Patch

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/phase2-inputxml-workspace-patch.mjs
      - .github/workflows/phase2-inputxml-workspace-patch.yml
  push:
    branches:
      - claude/snap-geometry-cii-issues-v272ju
    paths:
      - scripts/phase2-inputxml-workspace-patch.mjs
      - .github/workflows/phase2-inputxml-workspace-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: claude/snap-geometry-cii-issues-v272ju
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded patch
        run: node scripts/phase2-inputxml-workspace-patch.mjs
      - name: JavaScript syntax checks
        run: |
          node --check tabs/inputxml-workspace/inputxml-workspace-tab.js
          node --check tabs/inputxml-workspace/inputxml-workspace-diagnostics.js
          node --check tabs/inputxml-workspace/inputxml-workspace-orchestration.js
          node --check tabs/inputxml-workspace/inputxml-workspace-diagnostics-view.js
          node --check tabs/model-converters/xml-cii-topology-5c-panel.js
          node --check tests/inputxml-workspace-static.test.js
      - name: Focused workspace test
        run: node tests/inputxml-workspace-static.test.js
      - name: Commit patched capability
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tabs/inputxml-workspace/inputxml-workspace-tab.js \
            tabs/model-converters/xml-cii-topology-5c-panel.js \
            tests/inputxml-workspace-static.test.js
          git diff --cached --check
          git commit -m "feat: wire InputXML Workspace orchestration diagnostics"
          git push origin HEAD:claude/snap-geometry-cii-issues-v272ju
