name: CII Writer v11-v14 bridge qualification

on:
  pull_request:
    paths:
      - 'converters/cii-v11-v14-writer-worker.js'
      - 'converters/scripts/cii-v11-v14-upstream/**'
      - 'tabs/cii-workspace/cii-workspace-v11-v14-converter.js'
      - 'tabs/cii-workspace/cii-workspace-writer-version-bridge.js'
      - 'tests/cii-workspace-v11-v14-frozen-source.test.js'
      - 'tests/cii-workspace-v11-v14-frozen-engine.test.py'
      - '.github/workflows/cii-writer-v11-v14-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen upstream Git blob custody
        run: node tests/cii-workspace-v11-v14-frozen-source.test.js

      - name: Run frozen engine synthetic falsifiers
        run: python tests/cii-workspace-v11-v14-frozen-engine.test.py
