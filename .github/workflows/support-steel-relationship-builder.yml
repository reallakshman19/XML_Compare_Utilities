name: Support Steel Relationship Builder

on:
  pull_request:
    paths:
      - 'tabs/support-steel-relationship-builder/**'
      - 'tabs/psnm-utility-tab.js'
      - 'tabs/psnm-utility-tab-layout-stabilizer.js'
      - 'tests/support-steel-relationship-builder*.test.js'
      - 'core/app.js'
      - 'main-rhbg-fitguard.js'
      - 'index.html'
      - '.github/workflows/support-steel-relationship-builder.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Relationship engine tests
        run: node --test tests/support-steel-relationship-builder.test.js
      - name: Utility UI contract tests
        run: node tests/support-steel-relationship-builder-ui.test.js
