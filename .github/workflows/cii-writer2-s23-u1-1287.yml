name: CII Writer2 S2/S3 U1 causal trace

on:
  push:
    branches:
      - validation/cii-writer2-s23-u1-1287
  workflow_dispatch:

jobs:
  u1-current-ten-row-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout validation head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Guard exact retained diagnostic basis
        shell: bash
        run: |
          set -euo pipefail
          BASE=bd353b9e747ca322bba0aa2f609b0eae140df3ff

          expected="$(printf '%s\n' \
            '.github/workflows/cii-writer2-s23-u1-1287.yml' \
            'tests/browser/cii-writer2-s23-u1-trace.spec.mjs' | sort)"
          actual="$(git diff --name-only "$BASE"...HEAD | sort)"
          test "$actual" = "$expected"

          test "$(git hash-object tests/browser/cii-writer2-s23-u1-trace.spec.mjs)" = "d8efc9c89e233d09a7e2b86bd518ede6cc9ee54b"

          test "$(git hash-object tabs/cii-workspace/cii-workspace-node-custody.js)" = "6e7cb74f9533cde025bee083cdc8ac2b0b05cb25"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-multi-base-correspondence.js)" = "fbfa4b32fd2c4db9da0aa50f9b23bc1c54191a5d"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-anchor-physical-candidates.js)" = "ce3326a86f9e8fd88f26e583e27bf8147d0b39dd"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-source-target-audit.js)" = "8787fe0f09215ccd4e6bcc337f6d88a8f31d6d91"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-benchmark-overlay.js)" = "0bc83e1b747725a3c0e7e5cbd147aded421f10c4"
          test "$(git hash-object tests/browser/cii-writer2-s1-d4-method-a-provenance.spec.mjs)" = "09277285218be101f9a83f0d6a10dc98a7a0ae92"

          if git diff --name-only "$BASE"...HEAD -- tabs/cii-workspace | grep -q .; then
            echo "Production mutation forbidden in U1"
            exit 1
          fi
          if git diff --name-only "$BASE"...HEAD -- Benchmark | grep -q .; then
            echo "Benchmark mutation forbidden in U1"
            exit 1
          fi

          echo "S23_U1_DIAGNOSTIC_GUARD_PASS"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Create focused Playwright config
        shell: bash
        run: |
          cat > playwright.s23-u1.config.mjs <<'EOF'
          import base from './playwright.cii-writer2-retained.config.mjs';
          export default {
            ...base,
            testMatch: ['cii-writer2-s23-u1-trace.spec.mjs'],
            timeout: 240_000,
            expect: { timeout: 20_000 },
            workers: 1,
            retries: 0,
            reporter: [['list']],
            outputDir: 'test-results/cii-writer2-s23-u1',
          };
          EOF

      - name: Run U1 causal trace
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.s23-u1.config.mjs 2>&1 | tee s23-u1.log

      - name: Upload U1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cii-writer2-s23-u1-trace
          path: |
            s23-u1.log
            test-results/cii-writer2-s23-u1
          if-no-files-found: warn
