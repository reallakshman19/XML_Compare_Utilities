name: I121 Method C Post-Inspect Original Heartbeat Diagnostic
on:
  push:
    branches: [i121/wp2b-postinspect-gate-qa-20261018]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-a-only:
    name: Original CII Method C A-only heartbeat ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: windows-latest
            browser: msedge
    env:
      I121_BROWSER_CHANNEL: ${{ matrix.browser }}
    steps:
      - name: Keep LF checkout for original CII fixture SHA identity
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Source-only test syntax
        run: node --check tests/cii-workspace-i121-method-c-postinspect-heartbeat-native.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium dependencies on Linux only
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright install --with-deps chromium
      - name: Original real Writer2 Inspect and Method C A-only heartbeat
        run: node --test tests/cii-workspace-i121-method-c-postinspect-heartbeat-native.test.mjs
