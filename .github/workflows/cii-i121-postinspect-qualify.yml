name: I121 Postinspect Revision Fences Qualification
on:
  push:
    branches: [i121/postinspect-epoch-revocation-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify static syntax and controlled-promise negative cases
        run: |
          node --check docs/tabs/cii-workspace/cii-workspace-multisource-writer2-ui.js
          node --check docs/tabs/cii-workspace/cii-workspace-async-revision.js
          node --test tests/cii-workspace-i121-postinspect-epoch-native.test.mjs
      - name: Install pinned npm dependencies and genuine Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Genuine four-file served Writer2 regression and fail-closed checks
        run: |
          node --test tests/cii-workspace-i121-wp2b-committed-docs.test.mjs
          node --test tests/cii-workspace-i121-wp2b-lifecycle-native.test.mjs
          node --test tests/cii-workspace-i121-worker-wp1-contract.test.mjs tests/cii-workspace-i121-wp2-prepared-contract.test.mjs tests/cii-workspace-i121-negative-cache-regression.test.mjs
      - name: Preserve original browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i121-postinspect-original-chromium-${{ github.sha }}
          path: test-results/i126-original-writer2/
          if-no-files-found: ignore
          retention-days: 14
