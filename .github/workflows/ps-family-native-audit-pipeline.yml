name: PS Family Native Audit Pipeline

on:
  pull_request:
    paths:
      - 'tabs/ps-family-clash-audit/ps-family-native-audit-pipeline*.js'
      - 'tabs/ps-family-clash-audit/ps-family-carrier-evidence-export.js'
      - 'tabs/ps-family-clash-audit/ps-family-evidence-graph-audit.js'
      - 'tabs/ps-family-clash-audit/ps-family-evidence-audit-bootstrap.js'
      - 'tabs/support-steel-relationship-builder/**'
      - 'tests/ps-family-native-audit-pipeline*.test.js'
      - 'tests/ps-family-native-carrier-resolution.test.js'
      - 'tests/support-carrier-attachment-geometry.test.js'
      - '.github/workflows/ps-family-native-audit-pipeline.yml'
      - 'core/app.js'
      - 'main-rhbg-fitguard.js'
      - 'index.html'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native staged JSON pipeline engine
        run: node --test tests/ps-family-native-audit-pipeline.test.js
      - name: Native carrier evidence pipeline
        run: node --test tests/ps-family-native-carrier-resolution.test.js
      - name: Analytical carrier attachment engine
        run: node --test tests/support-carrier-attachment-geometry.test.js
      - name: Native pipeline UI and export contracts
        run: node tests/ps-family-native-audit-pipeline-ui.test.js
      - name: PS family module compliance
        run: node tests/ps-family-implementation-compliance.test.js
      - name: Relationship and graph audit regression
        run: node --test tests/support-steel-relationship-builder.test.js && node --test tests/ps-family-evidence-graph-audit.test.js
