name: PS Family Native Audit Pipeline

on:
  pull_request:
    paths:
      - 'tabs/ps-family-clash-audit/ps-family-native-audit-pipeline*.js'
      - 'tabs/ps-family-clash-audit/ps-family-native-combined-input.js'
      - 'tabs/ps-family-clash-audit/ps-family-restraint-function-*.js'
      - 'tabs/ps-family-clash-audit/ps-family-carrier-evidence-*.js'
      - 'tabs/ps-family-clash-audit/ps-family-carrier-topology-*.js'
      - 'tabs/ps-family-clash-audit/ps-family-carrier-to-structure-path-*.js'
      - 'tabs/ps-family-clash-audit/ps-family-evidence-graph-audit.js'
      - 'tabs/ps-family-clash-audit/ps-family-evidence-audit-bootstrap.js'
      - 'tabs/support-steel-relationship-builder/**'
      - 'tests/combined-staged-model-input.test.js'
      - 'tests/ps-family-native-audit-pipeline*.test.js'
      - 'tests/ps-family-native-carrier-resolution.test.js'
      - 'tests/ps-family-native-carrier-topology.test.js'
      - 'tests/ps-family-native-carrier-to-structure-path.test.js'
      - 'tests/ps-family-native-restraint-function.test.js'
      - 'tests/support-carrier-attachment-geometry.test.js'
      - 'tests/support-carrier-topology.test.js'
      - 'tests/support-carrier-to-structure-path.test.js'
      - 'tests/support-restraint-function*.test.js'
      - '.github/workflows/ps-family-native-audit-pipeline.yml'
      - 'core/app.js'
      - 'main-rhbg-fitguard.js'
      - 'index.html'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Combined staged model input contract
        run: node --test tests/combined-staged-model-input.test.js
      - name: Native staged JSON pipeline engine
        run: node --test tests/ps-family-native-audit-pipeline.test.js
      - name: Native carrier evidence pipeline
        run: node --test tests/ps-family-native-carrier-resolution.test.js
      - name: Analytical carrier attachment engine
        run: node --test tests/support-carrier-attachment-geometry.test.js
      - name: Fail-closed carrier topology engine
        run: node --test tests/support-carrier-topology.test.js
      - name: Complete carrier-to-structure path engine
        run: node --test tests/support-carrier-to-structure-path.test.js
      - name: Restraint function validation engine
        run: node --test tests/support-restraint-function.test.js
      - name: Native carrier topology pipeline
        run: node --test tests/ps-family-native-carrier-topology.test.js
      - name: Native carrier-to-structure path pipeline
        run: node --test tests/ps-family-native-carrier-to-structure-path.test.js
      - name: Native restraint function pipeline
        run: node --test tests/ps-family-native-restraint-function.test.js
      - name: Restraint function UI and export contracts
        run: node tests/support-restraint-function-ui.test.js
      - name: Native pipeline UI and export contracts
        run: node tests/ps-family-native-audit-pipeline-ui.test.js
      - name: PS family module compliance
        run: node tests/ps-family-implementation-compliance.test.js
      - name: Relationship and graph audit regression
        run: node --test tests/support-steel-relationship-builder.test.js && node --test tests/ps-family-evidence-graph-audit.test.js
