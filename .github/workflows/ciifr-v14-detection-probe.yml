name: CII Find Replace V14 Detection Probe

on:
  push:
    branches:
      - feature/cii-find-replace-v14-detection-benchmark

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run focused regressions
        run: |
          node --test \
            tests/cii-workspace-find-replace-v14-version-record.test.js \
            tests/cii-workspace-find-replace-session.test.js \
            tests/cii-workspace-find-replace-output.test.js
