name: CII Find Replace V14 Detection Probe

on:
  push:
    branches:
      - feature/cii-find-replace-v14-detection-benchmark

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Probe retained benchmark
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { detectFindReplaceCiiVersion, createFindReplaceSession, withFindReplaceTarget } from './tabs/cii-workspace/cii-workspace-find-replace-session.js';
          const text = fs.readFileSync('Benchmark/T.CII', 'utf8');
          const version = detectFindReplaceCiiVersion(text);
          const session = withFindReplaceTarget(createFindReplaceSession(), { name: 'T.CII', text });
          console.log(JSON.stringify({ version, status: session.status, errors: session.errors, prefix: text.slice(0, 240) }));
          if (version !== 14 || session.status !== 'TARGET_READY') process.exit(1);
          NODE
