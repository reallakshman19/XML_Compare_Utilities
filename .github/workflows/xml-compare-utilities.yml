name: XML Compare Utilities

on:
  pull_request:
  push:
    branches: [main]

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
      - name: Verify exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Static tests
        run: npm run test:static
      - name: XML tests
        run: npm run test:xml
      - name: Table tests
        run: npm run test:table
      - name: Full npm test
        run: npm test
