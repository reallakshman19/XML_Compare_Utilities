name: XML Compare Utilities

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Static tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:static 2>&1 | tee static-tests.log
      - name: Upload temporary static failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml-compare-static-${{ github.sha }}
          path: static-tests.log
          if-no-files-found: error
      - name: XML tests
        run: npm run test:xml
      - name: Table tests
        run: npm run test:table
      - name: Full npm test
        run: npm test
