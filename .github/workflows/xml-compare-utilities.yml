name: XML Compare Utilities

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Static tests
        run: npm run test:static
      - name: XML tests
        run: npm run test:xml
      - name: Table tests
        run: npm run test:table
      - name: Full npm test
        run: npm test
