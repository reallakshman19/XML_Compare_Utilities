name: XML Compare Utilities

on:
  pull_request:
  push:
    branches: [main]

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
      - name: Verify exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Diagnostic — Pipeline table paste integration
        run: node tests/pipeline-3d-model-table-paste.test.js
      - name: Diagnostic — Pipeline table paste parser
        run: node tests/pipeline-3d-model-table-paste-parser.test.js
      - name: Diagnostic — Pipeline table paste static
        run: node tests/pipeline-3d-model-table-paste-static.test.js
      - name: Diagnostic — Pipeline table paste UI static
        run: node tests/pipeline-3d-model-table-paste-ui-static.test.js
      - name: Diagnostic — Pipeline profile propagation
        run: node tests/pipeline-3d-model-profile-propagation.test.js
      - name: Diagnostic — Pipeline profile propagation static
        run: node tests/pipeline-3d-model-profile-propagation-static.test.js
      - name: Diagnostic — Pipeline bend core
        run: node tests/pipeline-3d-model-elastic-bend.test.js
      - name: Diagnostic — Pipeline bend static
        run: node tests/pipeline-3d-model-elastic-bend-static.test.js
      - name: Static tests
        run: npm run test:static
      - name: XML tests
        run: npm run test:xml
      - name: Table tests
        run: npm run test:table
      - name: Full npm test
        run: npm test
