name: Topology AutoFix 1885 Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/topology-autofix-1885-qualification.yml'
      - 'Benchmark/ATTRIBUTE_managed_stage_1885_Steam.json'
      - 'tabs/topology-trace-validator/**'
      - 'vendor/3d-converters/**'
      - 'tests/browser/topology-autofix-1885-qualification.spec.mjs'
      - 'tests/browser/topology-checker-autofix-1885-fixture.html'
      - 'playwright.topology-validator.config.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: TTV-C05 exact benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run exact 1885 qualification
        run: npx playwright test tests/browser/topology-autofix-1885-qualification.spec.mjs --config=playwright.topology-validator.config.mjs

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: topology-autofix-1885-evidence
          path: test-results/topology-trace-validator
          if-no-files-found: warn
          retention-days: 14
