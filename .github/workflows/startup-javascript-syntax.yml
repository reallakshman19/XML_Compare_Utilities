name: Startup JavaScript Syntax

on:
  pull_request:
    branches: [main]
    paths:
      - 'core/**/*.js'
      - 'tabs/**/*.js'
      - 'main-rhbg-fitguard.js'
      - '.github/workflows/startup-javascript-syntax.yml'

permissions:
  contents: read

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse startup JavaScript modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find core tabs -type f -name '*.js' -print0 | sort -z)
          node --check main-rhbg-fitguard.js
