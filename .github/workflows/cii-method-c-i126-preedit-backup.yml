# Exact predecessor workflow pre-edit backup for PR127 routing correction.
name: I126 PR118 legacy workflow pre-edit backup
on:
  pull_request:
    paths:
      - '.github/workflows/cii-method-c-i126-preedit-backup.yml'

permissions:
  contents: read

jobs:
  immutable-workflow-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert exact pre-edit PR118 workflow blob and create backup using repository utility
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/cii-method-c-wp2.yml)" = 41e014dd201ce0ab095f7f149c8dc41b47420274
          node utils/backup.cjs save .github/workflows/cii-method-c-wp2.yml "Plan to limit PR118 predecessor gates to the original PR118 head while adding separate I126 verification"
          node utils/backup.cjs list cii-method-c-wp2.yml
          mkdir -p .agent-worklogs/i126-pr118-ci-routing-preimage
          printf '# I126 PR118 predecessor CI routing preimage\nOriginal Git blob: 41e014dd201ce0ab095f7f149c8dc41b47420274\nNo workflow files modified at this checkpoint. Retain exact local backup and permit selective rollback.\n' > .agent-worklogs/i126-pr118-ci-routing-preimage/manifest.md
      - name: Upload original workflow preimage + checksum ledger
        uses: actions/upload-artifact@v4
        with:
          name: i126-pr118-workflow-preimage-${{ github.event.pull_request.head.sha }}
          path: |
            .backups/
            .agent-worklogs/i126-pr118-ci-routing-preimage/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
