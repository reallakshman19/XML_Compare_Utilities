name: Profile static exact diagnostic v2

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/profile-static-exact-diagnostic-v2.yml']

permissions:
  contents: read

env:
  TARGET_BRANCH: owner/fix-navis-benchmark-static-contract
  EXPECTED_TARGET_SHA: c7970803b575cf908ad3665ba41b21f22532a504

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Capture profile static chain
        id: profile_static_chain
        continue-on-error: true
        run: |
          mkdir -p /tmp/profile-static-v2
          node tests/pipeline-3d-model-profile-propagation-static.test.js > /tmp/profile-static-v2/output.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-static-exact-output-v2
          path: /tmp/profile-static-v2/output.log
          if-no-files-found: error
      - if: steps.profile_static_chain.outcome != 'success'
        run: exit 1
