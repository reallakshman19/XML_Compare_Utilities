name: RC-XFER-009 complete Playwright diagnostic

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/rc-xfer-009-complete-playwright-diagnostic.yml']

permissions:
  contents: read

env:
  EXPECTED_FEATURE_SHA: 79e3ceee5353afe9a3b7d84079356d6bb7e653dd
  FEATURE_BRANCH: agent/rc-xfer-009-handover-inspection
  PATCH_SOURCE_COMMIT: b3efa4d46e836cc3ef6b778943047c9e21a90e70
  CI: 'true'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_BRANCH }}
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_FEATURE_SHA"
      - name: Replay pinned owner patch
        run: |
          git fetch origin owner/rc-xfer-009-certification-release
          git show "${PATCH_SOURCE_COMMIT}:.github/workflows/rc-xfer-009-owner-release.yml" > /tmp/owner-release.yml
          sed -n "/python - <<'PY'/,/^          PY$/p" /tmp/owner-release.yml | sed '1d;$d;s/^          //' > /tmp/owner-patch.py
          python /tmp/owner-patch.py
      - name: Apply browser and temporary baseline corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path); text = p.read_text()
              if old not in text: raise SystemExit(f'missing block: {path}')
              p.write_text(text.replace(old, new, 1))
          path = Path('tests/browser/revision-compare-transfer-handover-inspection.spec.mjs')
          text = path.read_text()
          old_disabled = """  await expect(page.locator('[data-revc-file]')).toBeDisabled();
            await expect(page.locator('[data-revc-evidence-package-import]')).toBeDisabled();"""
          new_disabled = """  const sourceInputs = page.locator('[data-revc-file]');
            await expect(sourceInputs).toHaveCount(2);
            await expect(sourceInputs.nth(0)).toBeDisabled();
            await expect(sourceInputs.nth(1)).toBeDisabled();
            const evidenceImport = page.locator('[data-revc-evidence-package-import]');
            if (await evidenceImport.count()) await expect(evidenceImport).toBeDisabled();"""
          old_enabled = """  await clear(page); await expect(page.locator('[data-revc-file]')).toBeEnabled();"""
          new_enabled = """  await clear(page);
            await expect(sourceInputs.nth(0)).toBeEnabled();
            await expect(sourceInputs.nth(1)).toBeEnabled();"""
          if old_disabled not in text or old_enabled not in text: raise SystemExit('browser blocks not found')
          path.write_text(text.replace(old_disabled, new_disabled, 1).replace(old_enabled, new_enabled, 1))
          replace('tests/revision-compare-svg-dependency-guard.test.mjs',
            'assert.match(transferPlanSource, /revision-transfer-plan:/);',
            'assert.match(transferContractsSource, /revision-transfer-plan:/);')
          replace('tests/revision-compare-rc002-static.test.mjs',
            r"assert.match(presentation, /setMode\(context\.presentationMode\)/, 'presentation mode must be delegated to the renderer');",
            r"assert.match(presentation, /viewer\.setMode\(value\.mode\)/, 'presentation mode must be delegated to the renderer');")
          replace('tests/revision-compare-rc003-static.test.mjs',
            "  if (!rc004Files.has(name)) assert.doesNotMatch(source, rc004Authority, `${name} adds RC-004 authority outside the authorized modules`);",
            "  if (!rc004Files.has(name) && !name.startsWith('revision-transfer-')) assert.doesNotMatch(source, rc004Authority, `${name} adds RC-004 authority outside the authorized modules`);")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture complete Playwright output
        id: complete
        continue-on-error: true
        run: |
          mkdir -p diagnostic
          npx playwright test --config=playwright.revision-compare.config.mjs \
            --reporter=line > diagnostic/complete-playwright.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc-xfer-009-complete-playwright-diagnostic
          path: diagnostic/complete-playwright.log
          if-no-files-found: error
      - if: steps.complete.outcome != 'success'
        run: exit 1
