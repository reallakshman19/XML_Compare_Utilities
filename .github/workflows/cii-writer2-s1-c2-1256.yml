name: CII Writer2 S1 C2 propagation RCA

on:
  push:
    branches:
      - validation/cii-writer2-s1-c2-1256
  workflow_dispatch:

jobs:
  c2-propagation-rca:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validation head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Guard validation-only delta
        shell: bash
        run: |
          set -euo pipefail
          BASE=a217c0ed90a486252a3d20533c256284b65ebed2
          allowed=$(cat <<'EOF'
          .github/workflows/cii-writer2-s1-c2-1256.yml
          tabs/cii-workspace/cii-workspace-anchor-physical-candidates.js
          tabs/cii-workspace/cii-workspace-anchor-suggestions-core.js
          tabs/cii-workspace/cii-workspace-anchor-suggestions.js
          tabs/cii-workspace/cii-workspace-multisource-review-only-filter-shell.js
          tabs/cii-workspace/cii-workspace-source-set.js
          tabs/cii-workspace/cii-workspace-source-target-audit.js
          tests/browser/cii-writer2-s1-c2-propagation-rca.spec.mjs
          EOF
          )
          changed="$(git diff --name-only "$BASE"...HEAD | sort)"
          printf '%s\n' "$changed"
          unexpected="$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$allowed" | sed 's/^          //' | sort) || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected validation drift:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          test "$(git hash-object tabs/cii-workspace/cii-workspace-anchor-physical-candidates.js)" = "18e04998fdf48368f56ff5bf975671075d90cd84"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-anchor-suggestions-core.js)" = "1037163d7ace8f91cc889108c044d1d2e9884d58"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-anchor-suggestions.js)" = "48ac451a7084873a8f48b6a48237627ba0a4786c"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-multisource-review-only-filter-shell.js)" = "ebe18d2dc2ffe3ac8dd60b8e330aca25cfb01c28"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-source-set.js)" = "f4d36814c34a20b194389eebe7ed7ec52e42ba3b"
          test "$(git hash-object tabs/cii-workspace/cii-workspace-source-target-audit.js)" = "8787fe0f09215ccd4e6bcc337f6d88a8f31d6d91"

          if git diff --name-only "$BASE"...HEAD -- Benchmark | grep -q .; then
            echo "Benchmark mutation forbidden"
            exit 1
          fi
          echo "S1_C2_VALIDATION_GUARD_PASS"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Create focused Playwright config
        shell: bash
        run: |
          cat > playwright.s1-c2.config.mjs <<'EOF'
          import base from './playwright.cii-writer2-retained.config.mjs';
          export default {
            ...base,
            testMatch: ['cii-writer2-s1-c2-propagation-rca.spec.mjs'],
            timeout: 180_000,
            expect: { timeout: 20_000 },
            workers: 1,
            retries: 0,
            reporter: [['list']],
            outputDir: 'test-results/cii-writer2-s1-c2',
          };
          EOF

      - name: Run C2 retained downstream comparison
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.s1-c2.config.mjs 2>&1 | tee s1-c2.log

      - name: Upload C2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cii-writer2-s1-c2-propagation-rca
          path: |
            s1-c2.log
            test-results/cii-writer2-s1-c2
          if-no-files-found: warn
