name: CII P3.4-A Writer2 UI exact-head qualification

on:
  push:
    branches:
      - validation/cii-writer2-ui-prepared-session-1341
  workflow_dispatch:

jobs:
  qualify-p3-4-a:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: A-U4 exact composition and blob guard
        shell: bash
        run: |
          set -euo pipefail
          BASE=4c07c1da6bbbf90e318330c1550a4762e87281c5
          PRODUCT=a7e8c73ae2cf7d95207a5c1ed6911ffabc7c593d
          WORKFLOW=.github/workflows/cii-p3-4-a-writer2-ui-1341.yml

          test "$(git diff --name-only "$PRODUCT"...HEAD | sort)" = "$WORKFLOW"

          expected="$(printf '%s\n' \
            'agents/WIP-1341-writer2-ui-prepared-session_workreport.md' \
            'tabs/cii-workspace/cii-workspace-multisource-writer2-ui.js' \
            'tests/cii-workspace-writer2-ui-prepared-session-wiring.test.js' | sort)"
          test "$(git diff --name-only "$BASE" "$PRODUCT" | sort)" = "$expected"

          test "$(git rev-parse "$PRODUCT:agents/WIP-1341-writer2-ui-prepared-session_workreport.md")" = "b2ec7d46c3a93c25ceed1ce7d8299d9b0ff30d0e"
          test "$(git rev-parse "$PRODUCT:tabs/cii-workspace/cii-workspace-multisource-writer2-ui.js")" = "d898258c1c2ff149e3025744fd741cdbf1d27480"
          test "$(git rev-parse "$PRODUCT:tests/cii-workspace-writer2-ui-prepared-session-wiring.test.js")" = "a5a9f1ce9c5db6d4947aa9feeb9e0430031c9001"

          test "$(git diff --numstat "$BASE" "$PRODUCT" -- tabs/cii-workspace/cii-workspace-multisource-writer2-ui.js)" = $'18\t10\ttabs/cii-workspace/cii-workspace-multisource-writer2-ui.js'
          git diff --check "$BASE" "$PRODUCT"

          if git diff --name-only "$BASE" "$PRODUCT" -- \
            tabs/cii-workspace/cii-workspace-multisource-review-only-router.js \
            tabs/cii-workspace/cii-workspace-core.js \
            tabs/cii-workspace/cii-workspace-writer-version-bridge.js \
            tabs/cii-workspace/cii-workspace-source-set.js \
            tabs/cii-workspace/cii-workspace-multisource-preview.js \
            tabs/cii-workspace/cii-workspace-multisource-review-only.js \
            Benchmark | grep -q .; then
            echo "Protected P3.3/router/Benchmark surface changed"
            exit 1
          fi

          echo "A_U4_EXACT_COMPOSITION_PASS"

      - name: Install dependencies
        run: npm ci

      - name: Diagnose pre-existing anchor-ledger assertion
        shell: bash
        run: |
          set -euo pipefail
          BASE=4c07c1da6bbbf90e318330c1550a4762e87281c5
          PRODUCT=a7e8c73ae2cf7d95207a5c1ed6911ffabc7c593d
          TEST=tests/cii-workspace-multisource-anchor-ledger-ui.test.js

          git checkout --detach "$BASE"
          set +e
          node "$TEST" > /tmp/base-anchor-ledger.log 2>&1
          base_rc=$?
          set -e

          git checkout --detach "$PRODUCT"
          set +e
          node "$TEST" > /tmp/product-anchor-ledger.log 2>&1
          product_rc=$?
          set -e

          echo "BASE_RC=$base_rc"
          echo "PRODUCT_RC=$product_rc"
          tail -n 20 /tmp/base-anchor-ledger.log || true
          tail -n 20 /tmp/product-anchor-ledger.log || true

          if [ "$base_rc" -eq 0 ] && [ "$product_rc" -ne 0 ]; then
            echo "Candidate introduced anchor-ledger regression"
            exit 1
          fi

          if [ "$base_rc" -ne 0 ] && [ "$product_rc" -ne 0 ]; then
            grep -F "No HIGH correspondence rows are eligible" /tmp/base-anchor-ledger.log >/dev/null
            grep -F "No HIGH correspondence rows are eligible" /tmp/product-anchor-ledger.log >/dev/null
            echo "ANCHOR_LEDGER_PREEXISTING_BASELINE_FAILURE_CONFIRMED"
          else
            echo "ANCHOR_LEDGER_NO_CANDIDATE_REGRESSION"
          fi

          test "$(git rev-parse HEAD)" = "$PRODUCT"

      - name: A-U4 direct Writer2 UI wiring guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a7e8c73ae2cf7d95207a5c1ed6911ffabc7c593d"
          node tests/cii-workspace-writer2-ui-prepared-session-wiring.test.js

      - name: A-U4 prepared-session and cache behavior
        shell: bash
        run: |
          set -euo pipefail
          node tests/cii-workspace-prepared-source-set-session.test.js
          node tests/cii-workspace-prepared-writer2-preview.test.js
          node tests/cii-workspace-common-analysis-cache.test.js
          node tests/cii-workspace-common-analysis-projection.test.js

      - name: A-U4 retained review and session regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/cii-workspace-multisource-review-state.test.js
          node tests/cii-workspace-multisource-review-ui.test.js
          node tests/cii-workspace-multisource-review-ledger-binding.test.js
          node tests/cii-workspace-multisource-session-persistence.test.js

      - name: A-U4 retained S1-S2-S3 semantic non-regression
        shell: bash
        run: |
          set -euo pipefail
          node tests/cii-workspace-multisource-retained-auto-anchor-benchmark.test.js

      - name: A-U4 final exact-head assertion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a7e8c73ae2cf7d95207a5c1ed6911ffabc7c593d"
          git diff --quiet
          echo "P3_4_A_EXACT_HEAD_QUALIFICATION_PASS"
