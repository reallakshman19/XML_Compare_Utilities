name: Qualify InputXML Workspace Producer Adoption Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/inputxml-workspace-producer-adoption-pr-bootstrap.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/inputxml-workspace-producer-adoption
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Execute checked-in exact integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/inputxml-workspace-producer-adoption-bootstrap.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply exact Workspace integration\n'
          start = source.index(marker)
          run_start = source.index('        run: |\n', start) + len('        run: |\n')
          end = source.index('\n      - name: Run focused qualification', run_start)
          block = source[run_start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          script = script.replace(chr(92) + '"', '"')
          script = script.replace(
              "    if count != 1:\n        raise SystemExit(f'{label}: expected one anchor, found {count}')\n    text = text.replace(old, new, 1)",
              "    expected = 2 if label == 'click close runtime cleanup' else 1\n"
              "    if count != expected:\n        raise SystemExit(f'{label}: expected {expected} anchor(s), found {count}')\n"
              "    text = text.replace(old, new, 1)",
          )
          script = script.replace(
              "replace_once(old_render, new_render, 'categorized panel')",
              "render_start = text.index('function renderCategorizedTab(state) {')\n"
              "render_end = text.index('function renderMiscConfigSubtab', render_start)\n"
              "text = text[:render_start] + new_render.rstrip() + '\\n\\n' + text[render_end:]",
          )
          script = script.replace(
              "replace_once(sideload_success, sideload_adopt, 'automatic enriched categorization')",
              "apply_start = text.index(\"    } else if (action === 'apply-sideload') {\")\n"
              "apply_end = text.index(\"    } else if (action === 'run-categorized') {\", apply_start)\n"
              "apply_block = text[apply_start:apply_end]\n"
              "success_end = apply_block.rfind('      }\\n')\n"
              "if success_end < 0: raise SystemExit('apply-sideload success boundary missing')\n"
              "adopt_call = \"        await runWorkspaceProducerCategorization(dialog, state, {\\n          text: result.xmlText,\\n          sourceKind: 'enriched',\\n          filename: 'inputxml-workspace-enriched.input.xml',\\n        });\\n\"\n"
              "apply_block = apply_block[:success_end] + adopt_call + apply_block[success_end:]\n"
              "text = text[:apply_start] + apply_block + text[apply_end:]",
          )
          script = script.replace(
              "replace_once(old_run, new_run, 'categorized action routing')",
              "action_start = text.index(\"    } else if (action === 'run-categorized') {\")\n"
              "action_end = text.index(\"    } else if (action === 'push-categorized-xmlcompare-source'\", action_start)\n"
              "text = text[:action_start] + new_run.rstrip() + '\\n' + text[action_end:]",
          )
          Path('/tmp/inputxml-workspace-adoption-apply.sh').write_text(script, encoding='utf-8')
          subprocess.run(['bash', '/tmp/inputxml-workspace-adoption-apply.sh'], check=True)
          Path('.github/workflows/inputxml-workspace-producer-adoption-pr-bootstrap.yml').unlink()
          PY

      - name: Run focused qualification
        run: |
          node --check tabs/inputxml-workspace/inputxml-workspace-producer-adoption.js
          node --check tabs/inputxml-workspace/inputxml-workspace-tab.js
          node tests/inputxml-workspace-producer-adoption.test.js
          node tests/inputxml-workspace-producer-adoption-static.test.js
          npm run test:inputxml-workspace
          git diff --check

      - name: Commit qualified integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(inputxml): adopt producer worker in Workspace'
          git push origin HEAD:agent/inputxml-workspace-producer-adoption
