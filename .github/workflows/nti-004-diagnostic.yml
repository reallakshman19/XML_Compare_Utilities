name: NTI-004 Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  navis-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Navis core
        if: always()
        run: node tests/navis-tag-isonote.test.js
      - name: Navis benchmark parser
        if: always()
        run: node tests/navis-tag-isonote-benchmark.test.js
      - name: Navis readiness
        if: always()
        run: node tests/navis-tag-isonote-readiness.test.js
      - name: Navis contracts
        if: always()
        run: node tests/navis-tag-isonote-contracts-v3.test.js
      - name: Navis index refinement
        if: always()
        run: node tests/navis-tag-isonote-index-refinement.test.js
      - name: Navis static
        if: always()
        run: node tests/navis-tag-isonote-static.test.js
      - name: Utility layout aggregate
        if: always()
        run: node tests/psnm-utility-layout-stabilizer.test.js
