name: NTI-004 Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  navis-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture Navis core result
        id: core
        continue-on-error: true
        run: |
          mkdir -p artifacts/nti004-diagnostic
          set +e
          node tests/navis-tag-isonote.test.js > artifacts/nti004-diagnostic/core.log 2>&1
          CODE=$?
          echo "$CODE" > artifacts/nti004-diagnostic/core.exit
          exit $CODE
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nti004-core-diagnostic
          path: artifacts/nti004-diagnostic
          if-no-files-found: error
      - name: Fail when core failed
        if: steps.core.outcome == 'failure'
        run: exit 1
