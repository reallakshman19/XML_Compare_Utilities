name: SSK-TS-2A exact-head certification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ssk-ts-2a-exact-head-cert-20260727.yml'
      - '.github/scripts/ssk-ts-2a-owner-patch.py'

permissions:
  contents: write

env:
  FEATURE_BRANCH: agent/ssk-ts-2a-journal-package-v2-clean
  EXPECTED_FEATURE_SHA: e32946869e9bb5d2eb8472ea76a76341fd927028
  EXPECTED_MAIN_SHA: 8f5c2a5ce5c53d0a1e5e91234537d80368b1a554
  CI: 'true'

jobs:
  certify-correct-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_BRANCH }}
          fetch-depth: 0

      - name: Enforce exact starting heads
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_FEATURE_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

      - name: Restack on exact current main
        run: |
          git config user.name 'SSK-TS-2A Owner'
          git config user.email 'actions@users.noreply.github.com'
          git merge --no-ff --no-edit "$EXPECTED_MAIN_SHA"

      - name: Fetch and apply reviewed Owner correction
        run: |
          git fetch origin owner/ssk-ts-2a-exact-head-cert-20260727
          git show origin/owner/ssk-ts-2a-exact-head-cert-20260727:.github/scripts/ssk-ts-2a-owner-patch.py > /tmp/ssk-ts-2a-owner-patch.py
          python3 /tmp/ssk-ts-2a-owner-patch.py
          git add \
            tests/sequential-workspace-command-authority-package.test.js \
            tabs/sequential-sketcher/persistence/sequential-workspace-package-v2.js
          git commit -m 'fix: canonicalize Sequential package v2 authority'
          echo "TESTED_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax, line and export guards
        run: |
          node --check tabs/sequential-sketcher/persistence/sequential-workspace-command-authority.js
          node --check tabs/sequential-sketcher/persistence/sequential-workspace-package-v2.js
          node --check tests/sequential-workspace-command-authority-package.test.js
          test "$(wc -l < tabs/sequential-sketcher/persistence/sequential-workspace-command-authority.js)" -lt 300
          test "$(wc -l < tabs/sequential-sketcher/persistence/sequential-workspace-package-v2.js)" -lt 300
          test "$(wc -l < tests/sequential-workspace-command-authority-package.test.js)" -lt 300
          ! grep -RE "export[[:space:]]+default|module\.exports" \
            tabs/sequential-sketcher/persistence/sequential-workspace-command-authority.js \
            tabs/sequential-sketcher/persistence/sequential-workspace-package-v2.js

      - name: Run focused package-v2 qualification
        id: focused
        continue-on-error: true
        run: |
          set +e
          node tests/sequential-workspace-command-authority-package.test.js > focused-package-v2.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload focused qualification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssk-ts-2a-focused-log
          path: focused-package-v2.log
          if-no-files-found: error

      - name: Enforce focused package-v2 qualification
        run: test "${{ steps.focused.outputs.status }}" = "0"

      - name: Command-journal aggregate
        run: npm run test:command-journal

      - name: Repository-wide validation
        run: npm test

      - name: Enforce exact five-file mission scope
        run: |
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          docs/ssk-ts-2a-journal-package-v2.md
          tabs/sequential-sketcher/persistence/sequential-workspace-command-authority.js
          tabs/sequential-sketcher/persistence/sequential-workspace-package-v2.js
          tests/command-journal-phase2.test.mjs
          tests/sequential-workspace-command-authority-package.test.js
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          test -z "$(git status --short)"
          test "$(git rev-parse HEAD)" = "$TESTED_HEAD_SHA"

      - name: Publish exact tested feature head
        run: git push origin HEAD:"$FEATURE_BRANCH"
