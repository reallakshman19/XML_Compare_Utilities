name: SSK-TS-2A exact-head certification

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ssk-ts-2a-exact-head-cert-20260727.yml']

permissions:
  contents: write

env:
  FEATURE_BRANCH: agent/ssk-ts-2a-journal-package-v2-clean
  EXPECTED_FEATURE_SHA: e32946869e9bb5d2eb8472ea76a76341fd927028
  EXPECTED_MAIN_SHA: 9859283b00c0e70d4f28ffc83ebb04156b972702
  CI: 'true'

jobs:
  certify-correct-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_BRANCH }}
          fetch-depth: 0

      - name: Enforce exact starting heads
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_FEATURE_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

      - name: Restack on exact current main
        run: |
          git config user.name 'SSK-TS-2A Owner'
          git config user.email 'actions@users.noreply.github.com'
          git merge --no-ff --no-edit "$EXPECTED_MAIN_SHA"

      - name: Apply Owner corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('tests/sequential-workspace-command-authority-package.test.js')
          lines = test_path.read_text().splitlines(keepends=True)
          output = []
          index = 0
          while index < len(lines):
              line = lines[index]
              if line == "import { execFileSync } from 'node:child_process';\n":
                  index += 1
                  continue
              if line.startswith("const BASE_SHA = '"):
                  index += 1
                  continue
              if line.startswith('const ALLOWED_PATHS = Object.freeze(['):
                  index += 1
                  while index < len(lines) and lines[index].strip() != ']);':
                      index += 1
                  index += 1
                  continue
              if line.startswith('const changedPaths = execFileSync('):
                  index += 1
                  while index < len(lines) and not lines[index].startswith('assert(changedPaths.every('):
                      index += 1
                  index += 1
                  continue
              output.append(line)
              index += 1
          test_path.write_text(''.join(output))

          package_path = Path('tabs/sequential-sketcher/persistence/sequential-workspace-package-v2.js')
          source = package_path.read_text()
          source = source.replace(
              "import { buildSequentialEvidenceModel, indexSequentialEvidence } from '../source/sequential-evidence-model.js';\n",
              '',
          )
          old_authority_source = """  restoreSequentialWorkspacePackage(result);
          return result;
        }
        function registryForCreate(options, base) {
          const evidence = options.evidence || buildSequentialEvidenceModel(base.source.records);
          const indexes = indexSequentialEvidence(evidence);
          const entries = options.branchRegistry?.entries?.();
          if (!Array.isArray(entries)) fail('WORKSPACE_PACKAGE_V2_BRANCH_REGISTRY_REQUIRED');
          return normalizedRegistry(base.branchIds, entries, indexes);
        }
        """
          new_authority_source = """  const restoration = restoreSequentialWorkspacePackage(result);
          return Object.freeze({ packageValue: result, restoration });
        }
        """
          if old_authority_source not in source:
              raise SystemExit('expected authority-source block not found')
          source = source.replace(old_authority_source, new_authority_source)
          old_create = """  const base = explicitV1Package(options);
          const authorityRegistry = registryForCreate(options, base);
        """
          new_create = """  const prepared = explicitV1Package(options);
          const base = prepared.packageValue;
          const authorityRegistry = normalizedRegistry(
            prepared.restoration.branchIds,
            prepared.restoration.workspaces,
            prepared.restoration.indexes,
          );
        """
          if old_create not in source:
              raise SystemExit('expected create block not found')
          package_path.write_text(source.replace(old_create, new_create))
          PY
          git add \
            tests/sequential-workspace-command-authority-package.test.js \
            tabs/sequential-sketcher/persistence/sequential-workspace-package-v2.js
          git commit -m 'fix: canonicalize Sequential package v2 authority'
          echo "TESTED_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax, line and export guards
        run: |
          node --check tabs/sequential-sketcher/persistence/sequential-workspace-command-authority.js
          node --check tabs/sequential-sketcher/persistence/sequential-workspace-package-v2.js
          node --check tests/sequential-workspace-command-authority-package.test.js
          test "$(wc -l < tabs/sequential-sketcher/persistence/sequential-workspace-command-authority.js)" -lt 300
          test "$(wc -l < tabs/sequential-sketcher/persistence/sequential-workspace-package-v2.js)" -lt 300
          test "$(wc -l < tests/sequential-workspace-command-authority-package.test.js)" -lt 300
          ! grep -RE "export[[:space:]]+default|module\.exports" \
            tabs/sequential-sketcher/persistence/sequential-workspace-command-authority.js \
            tabs/sequential-sketcher/persistence/sequential-workspace-package-v2.js

      - name: Run focused package-v2 qualification
        id: focused
        continue-on-error: true
        run: |
          set +e
          node tests/sequential-workspace-command-authority-package.test.js > focused-package-v2.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload focused qualification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssk-ts-2a-focused-log
          path: focused-package-v2.log
          if-no-files-found: error

      - name: Enforce focused package-v2 qualification
        run: test "${{ steps.focused.outputs.status }}" = "0"

      - name: Command-journal aggregate
        run: npm run test:command-journal

      - name: Repository-wide validation
        run: npm test

      - name: Enforce exact five-file mission scope
        run: |
          git diff --check "$EXPECTED_MAIN_SHA"...HEAD
          git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          docs/ssk-ts-2a-journal-package-v2.md
          tabs/sequential-sketcher/persistence/sequential-workspace-command-authority.js
          tabs/sequential-sketcher/persistence/sequential-workspace-package-v2.js
          tests/command-journal-phase2.test.mjs
          tests/sequential-workspace-command-authority-package.test.js
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          test -z "$(git status --short)"
          test "$(git rev-parse HEAD)" = "$TESTED_HEAD_SHA"

      - name: Publish exact tested feature head
        run: git push origin HEAD:"$FEATURE_BRANCH"
