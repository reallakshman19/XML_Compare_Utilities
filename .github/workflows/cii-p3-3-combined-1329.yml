name: CII P3.3-E combined prepared preview qualification

on:
  push:
    branches:
      - validation/cii-p3-3-combined-1329
  workflow_dispatch:

jobs:
  qualify-p3-3-e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: E-U1 exact P3.3 composition guard
        shell: bash
        run: |
          set -euo pipefail
          BASE=c637db92295d379ca6cc3b8aa69d7ace8ff51b5f
          PRODUCT=4c07c1da6bbbf90e318330c1550a4762e87281c5

          test "$(git diff --name-only "$PRODUCT"...HEAD | sort)" = ".github/workflows/cii-p3-3-combined-1329.yml"

          expected="$(printf '%s\n' \
            'agents/WIP-1325-common-analysis-authority-key_workreport.md' \
            'agents/WIP-1326-prepared-writer2-preview_workreport.md' \
            'agents/WIP-1327-common-analysis-cache_workreport.md' \
            'agents/WIP-1328-prepared-review-only-thin_workreport.md' \
            'agents/WIP-1335-pure-element-paths_workreport.md' \
            'agents/WIP-1338-prepared-review-only-adapter_workreport.md' \
            'tabs/cii-workspace/cii-workspace-common-analysis-key.js' \
            'tabs/cii-workspace/cii-workspace-multisource-preview.js' \
            'tabs/cii-workspace/cii-workspace-multisource-review-only-prepared.js' \
            'tabs/cii-workspace/cii-workspace-multisource-review-only.js' \
            'tabs/model-converters/xml-cii-inputxml-path-aligner.js' \
            'tests/cii-workspace-common-analysis-authority-key.test.js' \
            'tests/cii-workspace-common-analysis-cache.test.js' \
            'tests/cii-workspace-prepared-review-only-adapter.test.js' \
            'tests/cii-workspace-prepared-review-only-thin-integration.test.js' \
            'tests/cii-workspace-prepared-writer2-preview.test.js' \
            'tests/xml-cii-inputxml-path-aligner-purity.test.js' | sort)"
          test "$(git diff --name-only "$BASE" "$PRODUCT" | sort)" = "$expected"

          test "$(git rev-parse "$PRODUCT:tabs/cii-workspace/cii-workspace-common-analysis-key.js")" = "db8573e6cca0cff6bbf7fbeef97c3690418d5688"
          test "$(git rev-parse "$PRODUCT:tabs/cii-workspace/cii-workspace-multisource-preview.js")" = "d8d669b174c97a543cfd139df7d14e6bd71b76ce"
          test "$(git rev-parse "$PRODUCT:tabs/cii-workspace/cii-workspace-multisource-review-only-prepared.js")" = "2eccf41ad9d33377de8045b5f0e01eebe79c6461"
          test "$(git rev-parse "$PRODUCT:tabs/cii-workspace/cii-workspace-multisource-review-only.js")" = "86f8b1827e73c27c0a71d78985542eced50565c5"
          test "$(git rev-parse "$PRODUCT:tabs/model-converters/xml-cii-inputxml-path-aligner.js")" = "d54f4faa2a40b461b892e7b8b9fd2ebf84b70672"

          lines="$(wc -l < tabs/cii-workspace/cii-workspace-multisource-review-only.js)"
          test "$lines" -lt 300

          if git diff --name-only "$BASE" "$PRODUCT" -- \
            tabs/cii-workspace/cii-workspace-core.js \
            tabs/cii-workspace/cii-workspace-writer-version-bridge.js \
            tabs/cii-workspace/cii-workspace-source-set.js \
            tabs/cii-workspace/cii-workspace-multisource-writer2-ui.js \
            tabs/cii-workspace/cii-workspace-multisource-review-only-router.js \
            Benchmark | grep -q .; then
            echo "P3.3 protected surface changed"
            exit 1
          fi

          echo "P3_3_E_EXACT_COMPOSITION_PASS"

      - name: Install dependencies
        run: npm ci

      - name: E-U2 Writer2 prepared construction/cache counts
        shell: bash
        run: |
          set -euo pipefail
          node tests/cii-workspace-prepared-writer2-preview.test.js
          node tests/cii-workspace-common-analysis-cache.test.js

      - name: E-U3 review-only prepared counts/parity
        shell: bash
        run: |
          set -euo pipefail
          node tests/cii-workspace-prepared-review-only-adapter.test.js
          node tests/cii-workspace-prepared-review-only-thin-integration.test.js
          node tests/cii-workspace-multisource-review-only.test.js

      - name: E-U4 inherited semantic regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/cii-workspace-common-analysis-authority-key.test.js
          node tests/cii-workspace-prepared-source-set-session.test.js
          node tests/cii-workspace-common-analysis-projection.test.js
          node tests/xml-cii-inputxml-path-aligner-purity.test.js
          node tests/cii-workspace-multisource-retained-auto-anchor-benchmark.test.js
