name: CII Writer2 S1 R2.2 design prototype

on:
  push:
    branches:
      - validation/cii-s1-r2-2-1262
  workflow_dispatch:

jobs:
  r2-2-design:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout validation head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Guard design-only delta
        shell: bash
        run: |
          set -euo pipefail
          BASE=aac6b0cd64eec22026a57aecc014b4545d64a1d8
          changed="$(git diff --name-only "$BASE"...HEAD | sort)"
          printf '%s\n' "$changed"
          expected="$(cat <<'EOF' | sort
          .github/workflows/cii-writer2-s1-r2-2-1262.yml
          tests/browser/cii-writer2-s1-r2-2-design.spec.mjs
          tests/browser/cii-writer2-s1-r2-2-rev2-rule-selection.spec.mjs
          EOF
          )"
          unexpected="$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$expected") || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected R2.2 drift:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          test "$(git hash-object tabs/cii-workspace/cii-workspace-anchor-physical-candidates.js)" = "e9ee2ec6046a7772ae70f73de83ece6724d7865c"
          if git diff --name-only "$BASE"...HEAD -- Benchmark | grep -q .; then
            echo "Benchmark mutation forbidden"
            exit 1
          fi
          echo "S1_R2_2_DESIGN_GUARD_PASS"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Create focused Playwright config
        shell: bash
        run: |
          cat > playwright.s1-r2-2.config.mjs <<'EOF'
          import base from './playwright.cii-writer2-retained.config.mjs';
          export default {
            ...base,
            testMatch: ['cii-writer2-s1-r2-2-design.spec.mjs', 'cii-writer2-s1-r2-2-rev2-rule-selection.spec.mjs'],
            timeout: 240_000,
            expect: { timeout: 20_000 },
            workers: 1,
            retries: 0,
            reporter: [['list']],
            outputDir: 'test-results/cii-writer2-s1-r2-2',
          };
          EOF

      - name: Run R2.2 design prototype
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.s1-r2-2.config.mjs 2>&1 | tee s1-r2-2.log

      - name: Upload R2.2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cii-writer2-s1-r2-2-design
          path: |
            s1-r2-2.log
            s1-r2-2-design-prototype.json
            s1-r2-2-rev2-rule-selection.json
            test-results/cii-writer2-s1-r2-2
          if-no-files-found: warn
