name: Repository baseline repair certification

on:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: owner/repository-baseline-repair-clean
      EXPECTED_TARGET_SHA: fd4e7a773ec5650c9a51d828511f8530f3fd1c39
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact target head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture elastic-bend static output
        id: bend_static
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node tests/pipeline-3d-model-elastic-bend-static.test.js > elastic-bend-static.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload elastic-bend static output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elastic-bend-static-output-v3
          path: elastic-bend-static.log

      - name: Require elastic-bend static pass
        run: test "${{ steps.bend_static.outputs.status }}" = "0"
