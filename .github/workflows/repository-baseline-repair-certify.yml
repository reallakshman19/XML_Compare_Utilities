name: GRE topology fixture consensus certification

on:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_BRANCH: owner/fix-gre-topology-fixture-consensus
      EXPECTED_TARGET_SHA: 13ef913323d3358353301b51cccf2d1096474d3e
    steps:
      - name: Check out exact fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact target head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: GRE fixture evidence
        run: node tests/pipeline-gre-caesar-fixture-evidence.test.js

      - name: GRE field mapping
        run: node tests/pipeline-gre-caesar-bend-field-mapping.test.js

      - name: GRE topology mapping
        run: node tests/pipeline-gre-caesar-bend-topology-mapping.test.js

      - name: GRE qualification
        run: node tests/pipeline-gre-caesar-bend-qualification.test.js

      - name: GRE qualification static
        run: node tests/pipeline-gre-caesar-bend-qualification-static.test.js

      - name: Verify clean worktree
        run: test -z "$(git status --short)"
