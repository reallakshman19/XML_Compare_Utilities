name: Repository baseline repair certification

on:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_BRANCH: owner/repository-baseline-repair-clean
      EXPECTED_TARGET_SHA: b4c34e24e00209a3db2b87d4ed03a802c4b500a1
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact target head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture Phase 6 output
        id: phase6
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node tests/project-migrations-phase6.test.mjs > phase6.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload Phase 6 output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-migrations-phase6-output
          path: phase6.log

      - name: Require Phase 6 pass
        run: test "${{ steps.phase6.outputs.status }}" = "0"
