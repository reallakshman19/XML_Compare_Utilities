name: GRE topology fixture consensus certification

on:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: owner/fix-gre-topology-fixture-consensus
      EXPECTED_TARGET_SHA: 13ef913323d3358353301b51cccf2d1096474d3e
    steps:
      - name: Check out exact fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact target head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture GRE qualification static output
        id: gre_static
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node tests/pipeline-gre-caesar-bend-qualification-static.test.js > gre-qualification-static.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload GRE qualification static output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gre-qualification-static-output
          path: gre-qualification-static.log

      - name: Require GRE qualification static pass
        run: test "${{ steps.gre_static.outputs.status }}" = "0"
