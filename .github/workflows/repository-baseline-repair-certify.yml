name: Repository baseline repair certification

on:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: owner/repository-baseline-repair-clean
      EXPECTED_TARGET_SHA: 1ad5933a58f9e4b8af24a5ca97c2120fac9fbeaa
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact target head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository-wide validation
        run: npm test

      - name: Capture post-test worktree
        if: always()
        run: git status --short > post-test-worktree.log

      - name: Upload post-test worktree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synchronized-baseline-post-test-worktree
          path: post-test-worktree.log
