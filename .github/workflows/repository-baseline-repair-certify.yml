name: Repository baseline repair certification

on:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: owner/repository-baseline-repair-clean
      EXPECTED_TARGET_SHA: af07d834dc583223a8706ae7c3559c4fc1645b60
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact target head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture profile-static output
        id: profile_gate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node tests/pipeline-3d-model-profile-propagation-static.test.js > profile-static.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload profile-static output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-baseline-profile-static-output
          path: profile-static.log

      - name: Require profile-static pass
        run: test "${{ steps.profile_gate.outputs.status }}" = "0"
