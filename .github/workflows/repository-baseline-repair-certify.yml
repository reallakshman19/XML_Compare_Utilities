name: Repository baseline repair certification

on:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: owner/repository-baseline-repair-clean
      EXPECTED_TARGET_SHA: ee142801b70123d97e3abf15f8aafe288fd3d40b
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact target head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture GRE adoption static output
        id: gre_adoption
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node tests/pipeline-3d-model-inputxml-gre-document-adoption-static.test.js > gre-adoption-static.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload GRE adoption static output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-baseline-gre-adoption-static-output
          path: gre-adoption-static.log

      - name: Require GRE adoption static pass
        run: test "${{ steps.gre_adoption.outputs.status }}" = "0"
