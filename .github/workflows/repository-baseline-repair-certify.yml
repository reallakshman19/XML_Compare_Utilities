name: Repository baseline repair certification

on:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: owner/repository-baseline-repair-clean
      EXPECTED_TARGET_SHA: 6b1b14187bc42b66b42b386abbad4a4915931474
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact target head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pipeline CAD browser contract
        run: node tests/pipeline-3d-model-cad-browser-contract.test.js

      - name: Pipeline export-context contract
        run: node tests/pipeline-3d-model-export-context-static.test.js

      - name: Pipeline no-fallback contract
        run: node tests/pipeline-3d-model-hard-051-no-fallback-static.test.js

      - name: Pipeline configuration UI contract
        run: node tests/pipeline-3d-model-hard-051-ui-static.test.js

      - name: Pipeline InputXML document contract
        run: node tests/pipeline-3d-model-inputxml-document-static.test.js

      - name: Pipeline GRE document-adoption static contract
        run: node tests/pipeline-3d-model-inputxml-gre-document-adoption-static.test.js

      - name: Pipeline profile static contract
        run: node tests/pipeline-3d-model-profile-propagation-static.test.js

      - name: Pipeline profile behavior
        run: node tests/pipeline-3d-model-profile-propagation.test.js

      - name: Pipeline property-section static contract
        run: node tests/pipeline-3d-model-property-sections-static.test.js

      - name: Pipeline property-section behavior
        run: node tests/pipeline-3d-model-property-sections.test.js

      - name: Pipeline elastic-bend behavior
        run: node tests/pipeline-3d-model-elastic-bend.test.js

      - name: XML Builder viewport browser contract
        run: node tests/xml-builder-viewport-browser-contract.test.js

      - name: Capture repository-wide validation
        id: repository_validation
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm test > npm-test.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload repository-wide output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-baseline-final-npm-test-output-v2
          path: npm-test.log

      - name: Require repository-wide pass
        run: test "${{ steps.repository_validation.outputs.status }}" = "0"

      - name: Verify clean worktree
        run: test -z "$(git status --short)"
