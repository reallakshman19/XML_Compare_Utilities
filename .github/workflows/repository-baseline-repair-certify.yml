name: Repository baseline repair certification

on:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: owner/repository-baseline-repair-clean
      EXPECTED_TARGET_SHA: acbf322b4b3272b4088396c52a21411bcd7c6d7b
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact target head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture CAD current-authority output
        id: cad_authority
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node tests/pipeline-3d-model-cad-current-authority-regression.test.js > cad-current-authority.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload CAD current-authority output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-current-authority-output
          path: cad-current-authority.log

      - name: Require CAD current-authority pass
        run: test "${{ steps.cad_authority.outputs.status }}" = "0"
