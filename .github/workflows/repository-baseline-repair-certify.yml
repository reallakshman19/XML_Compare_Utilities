name: Repository baseline repair certification

on:
  pull_request:

permissions:
  contents: write

jobs:
  certify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_BRANCH: owner/repository-baseline-repair-clean
      EXPECTED_TARGET_SHA: b4c34e24e00209a3db2b87d4ed03a802c4b500a1
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify exact target head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"

      - name: Correct blocked Pipeline artifact expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/project-migrations-phase6.test.mjs')
          text = path.read_text()
          old = "assert.equal(pipelineOutputById.get('pipeline-inputxml-document-plan').text, pipelineNative.inputXmlDocumentPlanText);"
          new = "assert.equal(pipelineOutputById.has('pipeline-inputxml-document-plan'), false);"
          if text.count(old) != 1:
              raise SystemExit('expected exact Phase 6 assertion once')
          path.write_text(text.replace(old, new))
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Phase 6
        run: node tests/project-migrations-phase6.test.mjs

      - name: Commit and push tested correction
        run: |
          test "$(git diff --name-only)" = "tests/project-migrations-phase6.test.mjs"
          git config user.name "Owner Release Bot"
          git config user.email "owner-release-bot@users.noreply.github.com"
          git add tests/project-migrations-phase6.test.mjs
          git commit -m "test: align blocked Pipeline migration artifacts"
          git push origin HEAD:$TARGET_BRANCH
