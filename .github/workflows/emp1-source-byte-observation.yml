name: EMP.1 pinned source byte observation

# Temporary evidence-only workflow for Advanced_Analysis Issue #1261.
on:
  push:
    branches:
      - qualification/emp1-source-bytes-1261
  pull_request:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated evidence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PDFs are byte-identical to pinned source commit
        shell: bash
        run: |
          set -euo pipefail
          base="dc1371afcd44c12de86b2dad6eddf00f1f0b3c55"
          git cat-file -e "$base^{commit}"
          paths=(
            "docs/emp.1/WRC537_2013.pdf"
            "docs/emp.1/CAUx 2017 - WRC01f.pdf"
          )
          for path in "${paths[@]}"; do
            expected="$(git rev-parse "$base:$path")"
            actual="$(git hash-object "$path")"
            printf '%s\n  expected_blob=%s\n  actual_blob=%s\n' "$path" "$expected" "$actual"
            test "$actual" = "$expected"
          done
          test "$(git rev-parse "$base:docs/emp.1/WRC537_2013.pdf")" = "ce861233928154145a9257efbbf8dbef3f5a17d1"
          test "$(git rev-parse "$base:docs/emp.1/CAUx 2017 - WRC01f.pdf")" = "76573b41462943b2987e28b23ebbbf7e51ac0a02"

      - name: Prepare PDF inspection tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null 2>&1 || ! command -v pdftoppm >/dev/null 2>&1 || ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi

      - name: Observe hashes and extract bounded evidence
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/test-results/emp1-source-byte-observation"
          mkdir -p "$out/caux-pages"
          wrc="docs/emp.1/WRC537_2013.pdf"
          caux="docs/emp.1/CAUx 2017 - WRC01f.pdf"

          sha256sum "$wrc" "$caux" > "$out/raw-sha256.txt"
          stat --printf='%s  %n\n' "$wrc" "$caux" > "$out/byte-counts.txt"
          git hash-object "$wrc" > "$out/wrc-git-blob-sha1.txt"
          git hash-object "$caux" > "$out/caux-git-blob-sha1.txt"
          pdfinfo "$wrc" > "$out/WRC537_2013.pdfinfo.txt"
          pdfinfo "$caux" > "$out/CAUx_2017_WRC01f.pdfinfo.txt"

          pdftotext -layout "$wrc" "$out/WRC537_2013.txt"
          pdftotext -f 24 -l 31 -layout "$caux" "$out/CAUx_2017_WRC01f_pp24-31.txt"
          pdftoppm -f 24 -l 31 -png -r 160 "$caux" "$out/caux-pages/page" >/dev/null

          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          base = 'dc1371afcd44c12de86b2dad6eddf00f1f0b3c55'
          files = [
              ('WRC537_2013', Path('docs/emp.1/WRC537_2013.pdf'), 'ce861233928154145a9257efbbf8dbef3f5a17d1', 1443744),
              ('CAUX_2017_WRC01F', Path('docs/emp.1/CAUx 2017 - WRC01f.pdf'), '76573b41462943b2987e28b23ebbbf7e51ac0a02', 7260396),
          ]
          rows = []
          for source_id, path, blob, expected_size in files:
              data = path.read_bytes()
              rows.append({
                  'sourceId': source_id,
                  'path': str(path),
                  'pinnedCommit': base,
                  'gitBlobSha1': blob,
                  'expectedByteCount': expected_size,
                  'observedByteCount': len(data),
                  'rawPdfSha256': hashlib.sha256(data).hexdigest(),
                  'byteCountMatches': len(data) == expected_size,
              })
          out = Path('test-results/emp1-source-byte-observation/source-observation.json')
          out.write_text(json.dumps({
              'schema': 'emp1-source-byte-observation/v1',
              'status': 'PASS' if all(r['byteCountMatches'] for r in rows) else 'FAIL',
              'sources': rows,
              'authorityNote': 'Observed from a temporary branch whose PDF blobs are proven byte-identical to the pinned source commit; no PDF byte is modified by this branch.'
          }, indent=2) + '\n', encoding='utf-8')
          PY

          cat "$out/source-observation.json"

      - name: Upload byte and page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emp1-source-byte-observation-${{ github.sha }}
          path: test-results/emp1-source-byte-observation
          if-no-files-found: error
          retention-days: 30
