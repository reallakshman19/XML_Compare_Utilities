name: Startup Syntax Diagnostic

on:
  pull_request:
    paths:
      - '**/*.js'
      - '.github/workflows/startup-syntax-diagnostic.yml'

permissions:
  contents: read

jobs:
  startup-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse every production JavaScript module
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            node --check "${file}"
          done < <(find . -type f -name '*.js' \
            -not -path './node_modules/*' \
            -not -path './.backups/*' \
            -not -path './tests/*' \
            -print0 | sort -z)
