name: Startup Syntax Diagnostic

on:
  pull_request:
    paths:
      - '**/*.js'
      - '.github/workflows/startup-syntax-diagnostic.yml'

permissions:
  contents: read

jobs:
  startup-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse every production JavaScript module
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          checked=0
          while IFS= read -r -d '' file; do
            checked=$((checked + 1))
            if ! output=$(node --check "${file}" 2>&1); then
              failed=1
              echo "::error file=${file}::JavaScript syntax check failed"
              printf '%s\n' "${output}"
            fi
          done < <(find . -type f -name '*.js' \
            -not -path './node_modules/*' \
            -not -path './.backups/*' \
            -not -path './tests/*' \
            -print0 | sort -z)
          echo "Checked ${checked} production JavaScript files."
          exit "${failed}"
